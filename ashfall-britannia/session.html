<!-- Layout, chrome and renderers are shared with every campaign. This page adds
     only its own atmosphere and says where its data comes from. -->
<link rel="stylesheet" href="/assets/session-layout.css">
<style>
body{
  background-image:
    radial-gradient(130% 80% at 50% -8%, rgba(232,162,74,.08), rgba(5,10,14,0) 42%),
    radial-gradient(120% 90% at 50% 12%, rgba(5,10,14,.12), rgba(5,10,14,.62) 55%, rgba(5,10,14,.95)),
    url('/assets/img/general_background.webp');
  background-size:cover;background-position:center 28%;background-attachment:fixed;
}
.ash{position:fixed;inset:-12% 0 0 0;pointer-events:none;z-index:1}
.ash i{position:absolute;top:-10%;border-radius:50%;background:rgba(222,216,204,.9);box-shadow:0 0 3px rgba(222,216,204,.5);opacity:0;animation:fall linear infinite}
.ash i.ember{background:rgba(232,162,74,.85);box-shadow:0 0 7px rgba(232,162,74,.75)}
@keyframes fall{0%{transform:translate3d(0,-10vh,0) scale(1);opacity:0}6%{opacity:.95}50%{transform:translate3d(calc(var(--dx,14px)*.5),52vh,0) scale(.96)}94%{opacity:.72}100%{transform:translate3d(var(--dx,14px),114vh,0) scale(.9);opacity:0}}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:80;opacity:.05;mix-blend-mode:overlay;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}
/* Lift the page above the falling ash. No transform on these: a transformed
   ancestor breaks the sticky rails. */
.topbar,#body,footer{position:relative;z-index:3}
.stitle.sun{color:#E8A24A;text-shadow:0 0 30px rgba(232,162,74,.4)}
@media(prefers-reduced-motion:reduce){.ash i{animation:none}}
</style>
</head>
<body>
<div class="ash" id="ash" aria-hidden="true"></div>
<div id="session"></div>

<script src="/assets/session-layout.js"></script>
<script>
var VR='https://raw.githubusercontent.com/TheLittlestAskew/ashfall_vault/main';
var SS='01-Sessions',HUB='00-Campaign-Hub/Trackers';
var QB=VR+'/'+HUB+'/Quote%20Board%20S01-S10.md';
var PF=VR+'/'+HUB+'/Profanity%20Ledger%20S01-S10.md';
var LT=VR+'/'+HUB+'/Loot%20Tracker%20S01-S10.md';
var VEGA=VR+'/03-Characters/01%20PCs/Vega%20Bloodroot.md';
var INDEX=VR+'/00-Campaign-Hub/Public%20Session%20Index.json';
var SELF=location.pathname.split('/').pop()||'session.html';
var ROSTER=['Vega Bloodroot','Valerian Hellebore','Deanna Smith-Wesson','Samothy Smith-Wesson','Barrett Grimmskar','Zelda Z Whipper','Flux'];

var ARC=[
 {n:'01',d:'2026-02-12',lbl:'February 13, 2026',t:'Graduation Day',f:SS+'/Session%2001%20%E2%80%94%20Graduation%20Day.md',tags:[{l:'\u2694 Combat',c:'combat'},{l:'\u21e7 Level 4\u21925',c:'level'}]},
 {n:'02',d:'2026-02-16',lbl:'February 17, 2026',t:'Ashes of the Living',f:SS+'/Session%2002%20%E2%80%94%20Ashes%20of%20the%20Living.md',tags:[{l:'\u2694 Combat',c:'combat'}]},
 {n:'03',d:'2026-02-24',lbl:'February 24, 2026',t:'Mr. Cat, Esquire',f:SS+'/Session%2003%20%E2%80%94%20Mr.%20Cat,%20Esquire.md',tags:[{l:'\u2694 Combat',c:'combat'},{l:'\u26a1 Cliffhanger',c:'cliff'}]},
 {n:'04',d:'2026-03-03',lbl:'March 4, 2026',t:'A Gust of Wind',f:SS+'/Session%2004%20%E2%80%94%20A%20Gust%20of%20Wind.md',tags:[{l:'\u2694 Combat',c:'combat'},{l:'\u21e7 Level 5\u21926',c:'level'},{l:'\u29c9 Sub-DM',c:'subdm'}]},
 {n:'04.5',d:'2026-03-11',lbl:'~March 11, 2026',t:'The Basement',f:SS+'/Session%2004.5%20%E2%80%94%20The%20Basement%20(UNRECORDED).md',badge:'Lost Session',tags:[{l:'\u21e7 Level 6\u21927',c:'level'},{l:'\u2014 Reconstructed',c:'rp'}]},
 {n:'05',d:'2026-03-24',lbl:'March 24, 2026',t:'The Bell of Saint Ardas',f:SS+'/Session%2005%20%E2%80%94%20The%20Bell%20of%20Saint%20Ardas.md',tags:[{l:'\u25cf Roleplay',c:'rp'}]},
 {n:'06',d:'2026-04-01',lbl:'April 1, 2026',t:'Protect the Light',f:SS+'/Session%2006%20%E2%80%94%20Protect%20the%20Light.md',tags:[{l:'\u2694 Combat',c:'combat'},{l:'\u2737 Hargraven joins',c:'level'}]},
 {n:'07',d:'2026-04-20',lbl:'April 20, 2026',t:'The Sun Shard',f:SS+'/Session%2007%20%E2%80%94%20The%20Sun%20Shard.md',sun:true,tags:[{l:'\u2694 Combat',c:'combat'},{l:'\u2600 Sun Shard claimed',c:'sun'}]},
 {n:'08',d:'2026-05-04',lbl:'May 4, 2026',t:'Silence in the Library',f:SS+'/Session%2008%20%E2%80%94%20Silence%20in%20the%20Library.md',tags:[{l:'\u2694 Combat',c:'combat'},{l:'\u2600 Solar Fist mounted',c:'sun'},{l:'\u26a1 Cliffhanger',c:'cliff'}]},
 {n:'09',d:'2026-05-11',lbl:'May 11, 2026',t:'The Battle of the Veiled Dawn',f:SS+'/Session%2009%20%E2%80%94%20The%20Battle%20of%20the%20Veiled%20Dawn%20(PARTIAL%20RECORDING).md',badge:'Partial Recording',tags:[{l:'\u2694 Combat',c:'combat'},{l:'\u21e7 Level 7\u21928',c:'level'}]}
];

function loadRegistry(){return fetchT(INDEX).then(function(text){if(!text)return ARC;var data=JSON.parse(text),sessions=data&&data.sessions;if(!Array.isArray(sessions))throw new Error('Invalid public session index.');sessions.forEach(function(x){var known=null;for(var i=0;i<ARC.length;i++)if(String(ARC[i].n)===String(x.n))known=ARC[i];var entry={n:x.n,d:x.d,lbl:x.lbl,t:x.t,f:x.f,tags:[]};if(known){for(var k in known)entry[k]=known[k];entry.d=x.d;entry.lbl=x.lbl;entry.t=x.t;entry.f=x.f;}entry.trackers=x.trackers||null;if(known)ARC[ARC.indexOf(known)]=entry;else ARC.push(entry);});ARC.sort(function(a,b){return parseFloat(a.n)-parseFloat(b.n);});return ARC;}).catch(function(){return ARC;});}
function trackerUrl(s,key,fallback){return VR+'/'+((s.trackers&&s.trackers[key])||fallback);}
function sw(s){return (s||'').replace(/\[\[([^\]|]+)\|([^\]]+)\]\]/g,'$2').replace(/\[\[([^\]]+)\]\]/g,'$1');}
function wl(s){return (s||'').replace(/\[\[Session\s+(\d+(?:\.\d+)?)[^\]|]*(?:\|([^\]]+))?\]\]/g,function(m,n,d){var nn=(n.indexOf('.')<0&&n.length<2)?('0'+n):n;return '['+(d||('Session '+n))+']('+SELF+'?n='+nn+')';}).replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g,function(m,a,b){return b||a;});}
function fetchT(u){return fetch(u).then(function(r){return r.ok?r.text():null;}).catch(function(){return null;});}

/* extract a "## Heading" section body (until next ## or ---) */
function section(md,h){var re=new RegExp('^##\\s+'+h+'\\b[^\\n]*$','mi');var m=re.exec(md);if(!m)return'';var a=md.slice(m.index+m[0].length);var e=a.search(/\n##\s|\n---/);return (e<0?a:a.slice(0,e)).trim();}
/* extract a tracker block for "## S0N — ..." */
function sessBlock(md,n){if(!md)return'';var key=String(parseFloat(n));var parts=md.split(/\n(?=##\s+S\d)/);for(var i=0;i<parts.length;i++){var h=/^##\s+S(\d+(?:\.\d+)?)/m.exec(parts[i]);if(h&&String(parseFloat(h[1]))===key)return parts[i];}return'';}
/* A wikilink alias inside a vault table carries a pipe, usually escaped
   ([[Name\|Alias]]) and sometimes not. A bare split('|') cut those cells in two
   and shifted every column after them, so pipes inside [[...]] are shielded first. */
function tableRows(t){var rows=(t||'').split('\n').filter(function(l){return l.trim().charAt(0)==='|';});if(rows.length<2)return[];function c(r){return r.replace(/\\\|/g,'\u0000').replace(/\[\[[^\]\n]*\]\]/g,function(m){return m.replace(/\|/g,'\u0000');}).split('|').slice(1,-1).map(function(x){return x.replace(/\u0000/g,'|').trim();});}return rows.slice(2).map(c);}

function ash(){var host=document.getElementById('ash');if(!host)return;var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;var N=reduce?40:66;for(var i=0;i<N;i++){var f=document.createElement('i');var sz=(Math.random()*3.2+1).toFixed(2);f.style.width=sz+'px';f.style.height=sz+'px';f.style.left=(Math.random()*100).toFixed(2)+'%';if(Math.random()<0.16)f.className='ember';if(reduce){f.style.top=(Math.random()*100).toFixed(2)+'%';f.style.opacity=(Math.random()*0.25+0.12).toFixed(2);}else{var d=(Math.random()*15+11).toFixed(1);f.style.animationDuration=d+'s';f.style.animationDelay=(-Math.random()*d).toFixed(1)+'s';f.style.setProperty('--dx',(Math.random()*80-30).toFixed(0)+'px');}host.appendChild(f);}}

function prose(t){return t?{kind:'prose',body_md:wl(t)}:null;}
function list(items){return items.length?{kind:'list',items:items}:null;}
function bullets(lines){return lines.map(function(x){return '- '+x;}).join('\n');}

/* Vega's account: her Key Events beat for this session, else the lead of the Summary. */
function vegaBeat(vegaMd,noteBody,s){
  if(vegaMd){
    var re=new RegExp('^[\\-*]\\s*\\*\\*S0?'+s.n.replace('.','\\.')+'\\b','mi');
    var lines=section(vegaMd,'Key Events').split(/\n(?=\s*[-*]\s)/);
    for(var i=0;i<lines.length;i++){if(re.test(lines[i].trim()))return lines[i].replace(/^\s*[-*]\s/,'');}
  }
  return section(noteBody,'Summary').split(/\n\s*\n/)[0]||'';
}
function quoteItems(qbMd,n){
  var block=sessBlock(qbMd,n),out=[],re=/\*\*([^\n*]+?)·\s*\[([^\]]+)\]\*\*\s*\n>\s*["“]([^"”]+)["”]?/g,m;
  while((m=re.exec(block))!==null){var sp=m[1].replace(/\[\[([^\]|]+)(?:\|[^\]]+)?\]\]/g,'$1').trim();if(/above-table|→/i.test(sp))continue;out.push({Speaker:sp,Quote:'“'+m[3].trim()+'”',Tag:m[2].trim()});}
  return out;
}
/* Per-speaker totals, not per-word, so this is a table rather than the shared
   by-word renderer. */
function profanityMd(pfMd,n){
  var block=sessBlock(pfMd,n);
  var rows=tableRows(block).filter(function(r){return r[0]&&!/unattributed/i.test(r[0]);});
  if(!rows.length)return'';
  var champ=(/\*\*Session champion:\*\*\s*([^\n]+)/.exec(block)||[])[1];
  return '| Speaker | Total |\n|---|---|\n'+rows.map(function(r){
    return '| '+sw(r[0]).replace(/\*\*/g,'')+' | '+(r[r.length-1]||'').replace(/[*()]/g,'').trim()+' |';
  }).join('\n')+(champ?'\n\n**Champion:** '+sw(champ).replace(/\*/g,''):'');
}

async function load(n){
  await loadRegistry();
  var idx=-1,s=null;
  for(var i=0;i<ARC.length;i++){if(ARC[i].n===n||parseFloat(ARC[i].n)===parseFloat(n)){s=ARC[i];idx=i;break;}}
  if(!s)throw new Error('Unknown session “'+n+'”.');
  var got=await Promise.all([
    fetchT(VR+'/'+s.f),fetchT(VEGA),
    fetchT(trackerUrl(s,'quotes',HUB+'/Quote%20Board%20S01-S10.md')),
    fetchT(trackerUrl(s,'loot',HUB+'/Loot%20Tracker%20S01-S10.md')),
    fetchT(trackerUrl(s,'profanity',HUB+'/Profanity%20Ledger%20S01-S10.md'))
  ]);
  var md=got[0];
  if(!md)throw new Error('Failed to load this session’s notes.');
  var fm=(/^---\n([\s\S]*?)\n---/.exec(md)||[null,''])[1];
  var body=md.replace(/^---\s*\n[\s\S]*?\n---\s*\n/,'');

  var kv={};
  tableRows(section(body,'Metadata')).forEach(function(r){if(r.length>=2)kv[sw(r[0]).replace(/\*\*/g,'').trim().toLowerCase()]=sw(r[1]).replace(/\*\*/g,'').trim();});
  var lvl=(/^party-level:\s*(.+)$/m.exec(fm||'')||[])[1]||'';
  var intro=(/^\s*>\s*(.+)$/m.exec(body)||[])[1]||'';
  var guests=[],gm,gre=/\[\[([^\]|]+?)\]\]/g;/* A [[Session NN ...]] link in the intro is a cross-reference, not a guest. */
  while((gm=gre.exec(intro))){if(ROSTER.indexOf(gm[1])<0&&!/^Session\s/.test(gm[1]))guests.push(gm[1]);}

  var arch=section(body,'Archivist Notes').split(/\n(?=\s*[-*]\s)/).filter(function(l){return /^\s*[-*]\s/.test(l);});
  var flags=[],notes=[];
  arch.forEach(function(l){(/⚑|\bflag/i.test(l)?flags:notes).push(l.replace(/^\s*[-*]\s/,'').replace(/⚑/g,''));});

  var beat=vegaBeat(got[1],body,s);
  var panels={
    narrative:prose(section(body,'Summary')),
    threads:prose(section(body,'Threads').split('\n').filter(function(l){return /^\s*[-*]\s/.test(l);}).join('\n')),
    archivist:prose(bullets(notes)),
    continuity:prose(bullets(flags)),
    npcs:list(tableRows(section(body,'NPCs')).map(function(r){return {Name:sw(r[0]||''),Status:wl(r[1]||'')};})),
    locations:list(kv['location']?[{Location:kv['location']}]:[]),
    quotes:list(got[2]?quoteItems(got[2],s.n):[]),
    loot:list(got[3]?tableRows(sessBlock(got[3],s.n)).map(function(r){return {'Character/Owner':sw(r[0]||''),'Item/Artifact':wl(r[1]||''),'State/Context':sw(r[2]||'')};}):[]),
    profanity:prose(got[4]?profanityMd(got[4],s.n):'')
  };
  Object.keys(panels).forEach(function(k){if(!panels[k])delete panels[k];});

  return {
    sessions:ARC.map(function(x){return {label:x.n,title:x.t};}),idx:idx,
    label:s.n,title:s.t,titleClass:s.sun?'sun':'',date:s.d,dateLabel:s.lbl,
    where:[['Location',kv['location']],['Party level',lvl.replace(/->/g,'→')],['Archive',kv['session date']]],
    guests:guests,
    tags:(s.badge?[s.badge]:[]).concat((s.tags||[]).map(function(t){return t.l;})),
    pov:beat?{byline:s.t,md:wl(beat)}:null,
    panels:panels
  };
}

function boot(){
  ash();
  SessionLayout.mount({
    campaign:'Ashfall Britannia',home:'/ashfall-britannia/',
    archive:{href:'/ashfall-britannia/archive.html',label:'The Ash Record'},
    povLabel:'Vega’s Account · “I am the fist”',
    rollView:'ashfall_session_rolls',rollSummary:true,recBase:'',
    roster:ROSTER,
    nav:[
      ['narrative','Narrative Summary'],
      ['threads','Open Threads'],
      ['archivist','Archivist Notes'],
      ['continuity','Continuity Flags'],
      ['rolllog','Roll Log']
    ],
    load:load
  });
}
if(typeof marked!=='undefined'){document.addEventListener('DOMContentLoaded',boot);}else{window.addEventListener('load',boot);}
</script>
