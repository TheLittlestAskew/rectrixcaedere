<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rectrix Caedere</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prop-types/15.8.1/prop-types.min.js"></script>
<script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=Cinzel+Decorative:wght@400&family=Raleway:wght@300;400;500&family=Alegreya+Sans+SC:wght@400;500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg-void);color:var(--text-1);font-family:var(--f-body);font-size:var(--text-lg);line-height:1.5;min-height:100vh;-webkit-font-smoothing:antialiased}
.shell{display:flex;min-height:100vh}

/* ── Sidebar — frameless ── */
.side{width:var(--sidebar-width);min-height:100vh;background:linear-gradient(180deg,var(--bg-sidebar-top),var(--bg-sidebar-bottom));position:fixed;left:var(--sidebar-left,0px);top:0;bottom:0;z-index:100;display:flex;flex-direction:column;overflow-y:auto;padding:8px 12px;border-right:1px solid var(--border)}
.side-brand{padding:16px 8px 16px;text-align:center;position:relative}
.side-brand::after{content:'';position:absolute;bottom:0;left:8px;right:8px;height:1px;background:linear-gradient(90deg,transparent,var(--gold-mid),transparent)}
.side-logo-img{display:block;width:100%;max-width:160px;height:auto;margin:0 auto;filter:drop-shadow(0 0 14px var(--gold-alpha-30))}
.side-section{font-family:var(--f-label);font-size:var(--text-2xs);letter-spacing:3px;text-transform:uppercase;color:var(--gold-mid);padding:14px 8px 6px;display:flex;align-items:center;gap:6px}
.side-section::before,.side-section::after{content:'\2726';font-size:5px;opacity:.4}
.camp-list{list-style:none}
.camp-list button{display:flex;align-items:center;width:100%;padding:9px 8px;background:none;border:none;color:var(--text-2);font-family:var(--f-body);font-size:var(--text-md);cursor:pointer;transition:all var(--dur-hover) var(--ease);text-align:left;position:relative}
.camp-list button:hover{color:var(--text-1);background:var(--gold-alpha-5)}
.camp-list button.on{color:var(--gold-bright);background:linear-gradient(90deg,var(--gold-alpha-10),transparent);font-weight:500}
.camp-list button.on::before{content:'';position:absolute;left:0;top:4px;bottom:4px;width:2px;background:linear-gradient(180deg,var(--gold-bright),var(--gold-mid));border-radius:0 2px 2px 0}
.camp-list .ct{margin-left:auto;font-size:var(--text-xs);font-family:var(--f-label);color:var(--text-3)}
.camp-list button.off{opacity:.45;cursor:default;font-style:italic;color:var(--text-3);letter-spacing:.5px}
.side-div{height:1px;margin:8px 8px;background:linear-gradient(90deg,transparent,var(--border),transparent)}
.side-nav{list-style:none;margin-top:auto;padding:0 0 8px}
.side-nav button{display:flex;align-items:center;gap:8px;width:100%;padding:8px 8px;background:none;border:none;color:var(--text-3);font-family:var(--f-label);font-size:var(--text-xs);letter-spacing:1.5px;cursor:pointer;transition:all var(--dur-hover) var(--ease);text-transform:uppercase}
.side-nav button:hover{color:var(--text-2)}.side-nav button.on{color:var(--gold-bright)}
.side-nav .ni{width:13px;height:13px;opacity:.45}.side-nav button.on .ni{opacity:.9}

/* ── Main 4-row grid ── */
.main{flex:1;margin-left:calc(var(--sidebar-left,0px) + var(--sidebar-width,209px));display:grid;grid-template-rows:74px auto auto auto;gap:12px;padding:9px 12px 24px;align-content:start}

/* ── Row 1: Header ── */
.row-hdr{position:relative;background:linear-gradient(180deg,var(--gold-alpha-4),transparent);border:1px solid var(--border);border-radius:var(--r);display:flex;align-items:center;justify-content:space-between;padding:0 24px;overflow:hidden}
.row-hdr::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent 5%,var(--gold-mid) 30%,var(--gold) 50%,var(--gold-mid) 70%,transparent 95%);opacity:.35;pointer-events:none}
.hdr-title{font-family:var(--f-deco);font-size:var(--text-xl);color:var(--gold-pale);letter-spacing:6px;text-transform:uppercase}
.hdr-sub{font-family:var(--f-serif);font-style:italic;font-size:var(--text-base);color:var(--text-3);margin-top:2px}
.top-center-img{position:absolute;left:50%;transform:translateX(-50%);width:38%;max-width:480px;min-width:220px;height:auto;pointer-events:none;user-select:none}
.hdr-right{display:flex;align-items:center;gap:10px;position:relative;z-index:1}
.hdr-filter{font-family:var(--f-label);font-size:var(--text-xs);letter-spacing:1.5px;color:var(--text-3);border:1px solid var(--border);border-radius:12px;padding:4px 12px;text-transform:uppercase;white-space:nowrap}
.top-icon{width:32px;height:32px;border:1px solid var(--border);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--gold-mid);transition:all var(--dur-enter) var(--ease);cursor:pointer}
.top-icon:hover{border-color:var(--border-strong);color:var(--gold-bright)}

/* ── Row sub-grids ── */
.row-kpi{--kpi-h:270px;display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px;align-items:stretch}
.row-mid{display:grid;grid-template-columns:1fr 1.15fr 1.6fr;gap:12px}
.row-bot{display:grid;grid-template-columns:2.2fr 2.2fr 2.4fr;gap:12px}

/* ── Panel base — frameless ── */
.panel{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px 18px;position:relative;overflow:hidden;transition:border-color var(--dur-hover) var(--ease)}
.panel:hover{border-color:var(--border-strong)}

/* ── KPI cards — ornamental oracle framing, centered content ── */
.kpi{width:auto;min-width:0;height:var(--kpi-h);padding:16px 12px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;transition:all var(--dur-enter) var(--ease);background:radial-gradient(130% 90% at 50% -12%,var(--gold-alpha-6),transparent 55%),var(--bg-card)}
.kpi:hover{transform:translateY(-2px);box-shadow:var(--shadow-glow)}
.kpi .kl{font-family:var(--f-label);font-size:var(--text-2xs);letter-spacing:2px;text-transform:uppercase;color:var(--gold);opacity:.72;margin-bottom:6px;position:relative;z-index:2}
.kpi .kv{font-family:var(--f-display);font-size:clamp(32px,3.2vw,44px);font-weight:500;color:var(--text-1);line-height:1;letter-spacing:1px;position:relative;z-index:2}
.kpi .ks{font-family:var(--f-body);font-size:var(--text-xs);color:var(--text-2);margin-top:6px;font-weight:300;position:relative;z-index:2}
.kpi.n20{--panel-accent:var(--success)}.kpi.n20 .kv{color:var(--success)}
.kpi.n1{--panel-accent:var(--danger)}.kpi.n1 .kv{color:var(--danger)}
/* ornament layer */
.k-accent{position:absolute;top:0;left:13%;right:13%;height:1.5px;border-radius:2px;opacity:.75;pointer-events:none;z-index:1}
.k-corner{position:absolute;width:30px;height:30px;pointer-events:none;z-index:1}
.k-corner.tl{top:9px;left:9px}
.k-corner.tr{top:9px;right:9px;transform:scaleX(-1)}
.k-corner.bl{bottom:9px;left:9px;transform:scaleY(-1)}
.k-corner.br{bottom:9px;right:9px;transform:scale(-1,-1)}
.k-sigil{position:absolute;top:50%;left:50%;width:118px;height:118px;transform:translate(-50%,-48%);opacity:.06;pointer-events:none;z-index:0;transition:opacity var(--dur-enter) var(--ease)}
.kpi:hover .k-sigil{opacity:.11}

/* ── KPI chart panel — stretch to fill row height ── */
.kpi-chart{grid-column:1/-1;height:var(--kpi-h);align-self:stretch}

/* ── Profanity Meter — wide KPI card with dial gauge ── */
.prof-meter{grid-column:span 2;height:var(--kpi-h);display:flex;flex-direction:column}
.prof-meter .ph{margin-bottom:4px}
.pf-body{display:flex;align-items:center;gap:14px;flex:1;min-height:0}
.pf-stat{flex-shrink:0;min-width:118px}
.pf-num{font-family:var(--f-display);font-size:clamp(34px,3.4vw,48px);font-weight:500;color:var(--danger);line-height:1}
.pf-tier{font-family:var(--f-label);font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--gold-pale);margin-top:4px}
.pf-lead{font-family:var(--f-body);font-size:12px;color:var(--text-2);margin-top:5px}
.pf-peak{font-family:var(--f-body);font-size:11px;color:var(--text-3);margin-top:4px}
.pf-gauge-svg{flex:1;min-width:0;max-width:260px;height:auto;align-self:center}

/* ── Campaign Snapshot promoted into KPI row ── */
.kpi-snap{grid-column:span 2;height:var(--kpi-h);overflow:auto;scrollbar-width:none}
.kpi-snap::-webkit-scrollbar{display:none}

/* ── Chart / content panels ── */
.cp{padding:14px 16px}
.ph{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.ph h3{font-family:var(--f-display);font-size:var(--text-base);font-weight:500;color:var(--text-1);letter-spacing:2px;text-transform:uppercase}
.ph .star{color:var(--gold-mid);font-size:9px;opacity:.6;flex-shrink:0}
.ph .psub{font-family:var(--f-serif);font-style:italic;font-size:var(--text-xs);color:var(--text-3);margin-left:auto;white-space:nowrap}

/* ── Tooltip ── */
.ctt{background:var(--bg-card-inner)!important;border:1px solid var(--border-strong)!important;border-radius:var(--r)!important;padding:10px 14px!important;box-shadow:var(--shadow-card)}
.ctt .tl2{font-family:var(--f-label);font-size:var(--text-2xs);color:var(--gold-bright);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:3px}
.ctt .tv{font-family:var(--f-display);font-size:var(--text-lg);color:var(--text-1);font-weight:500}

/* ── Character table ── */
.char-tbl{width:100%;border-collapse:collapse}
.char-tbl th{font-family:var(--f-label);font-size:var(--text-2xs);letter-spacing:1.5px;text-transform:uppercase;color:var(--text-3);padding:5px 8px;border-bottom:1px solid var(--border);text-align:left}
.char-tbl td{font-family:var(--f-body);font-size:13px;color:var(--text-2);padding:6px 8px;border-bottom:1px solid var(--gold-alpha-5)}
.char-tbl td:first-child{color:var(--text-1)}.char-tbl .up{color:var(--success)}.char-tbl .dn{color:var(--danger)}

/* ── Activity feed ── */
.feed{list-style:none;display:flex;flex-direction:column;gap:5px;overflow-y:auto;max-height:218px;scrollbar-width:none}
.feed::-webkit-scrollbar{display:none}
.feed li{padding:6px 10px;background:var(--gold-alpha-3);border-radius:var(--r);border-left:2px solid var(--border)}
.feed .ft{font-family:var(--f-body);font-size:13px;color:var(--text-1);line-height:1.35}
.feed .fm{font-family:var(--f-label);font-size:var(--text-2xs);letter-spacing:1px;color:var(--text-3);margin-top:2px}

/* ── Quest Tracker ── */
.quest-panel{display:flex;flex-direction:column}
.qt-wrap{display:flex;flex-direction:column;flex:1;min-height:0}
.qt-tabs{display:flex;gap:6px;margin-bottom:10px;flex-shrink:0}
.qt-tab{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;background:var(--gold-alpha-3);border:1px solid var(--border);border-radius:var(--r);color:var(--text-3);font-family:var(--f-label);font-size:var(--text-xs);letter-spacing:1.5px;text-transform:uppercase;padding:6px 10px;cursor:pointer;transition:all var(--dur-hover) var(--ease)}
.qt-tab:hover{color:var(--text-2);border-color:var(--border-strong)}
.qt-tab.on{color:var(--gold-bright);background:linear-gradient(180deg,var(--gold-alpha-10),transparent);border-color:var(--gold-mid)}
.qt-count{font-family:var(--f-display);font-size:var(--text-xs);color:var(--text-3);background:var(--bg-card-inner);border-radius:8px;padding:0 6px;line-height:16px}
.qt-tab.on .qt-count{color:var(--gold-bright)}
.qt-list{list-style:none;display:flex;flex-direction:column;gap:5px;overflow-y:auto;flex:1;min-height:0;max-height:260px;scrollbar-width:thin;scrollbar-color:var(--gold-mid) transparent;padding-right:4px}
.qt-list::-webkit-scrollbar{width:6px}
.qt-list::-webkit-scrollbar-thumb{background:var(--gold-mid);border-radius:3px}
.qt-list::-webkit-scrollbar-track{background:transparent}
.qt-item{padding:7px 10px;background:var(--gold-alpha-3);border-radius:var(--r);border-left:2px solid var(--gold-mid)}
.qt-item.done{border-left-color:var(--success);opacity:.78}
.qt-row{display:flex;align-items:baseline;gap:7px}
.qt-mark{color:var(--gold-mid);font-size:9px;flex-shrink:0}
.qt-item.done .qt-mark{color:var(--success)}
.qt-title{font-family:var(--f-body);font-size:13px;color:var(--text-1);font-weight:500;flex:1}
.qt-sess{font-family:var(--f-label);font-size:var(--text-2xs);letter-spacing:1px;color:var(--text-3);background:var(--bg-card-inner);border-radius:7px;padding:1px 6px;flex-shrink:0}
.qt-desc{font-family:var(--f-body);font-size:11px;color:var(--text-3);line-height:1.4;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.qt-empty{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--text-3);font-family:var(--f-label);font-size:var(--text-xs);letter-spacing:1px;padding:40px 16px;min-height:120px}

/* ── Campaign snapshot ── */
.snap-sigil{display:flex;justify-content:center;margin:0 0 8px}
.snap-status{list-style:none;display:flex;flex-direction:column;gap:4px}
.snap-status li{display:flex;align-items:baseline;gap:8px;padding:4px 0;border-bottom:1px solid var(--gold-alpha-5)}
.snap-status .sk{font-family:var(--f-label);font-size:var(--text-2xs);letter-spacing:1.5px;text-transform:uppercase;color:var(--text-3);min-width:88px;flex-shrink:0}
.snap-status .sv{color:var(--text-2);font-family:var(--f-body);font-size:13px}

/* ── Session list ── */
.sess-list{list-style:none;display:flex;flex-direction:column;gap:6px}
.sess-list li{display:grid;grid-template-columns:44px 1fr auto;gap:8px;align-items:center;padding:7px 10px;border-radius:var(--r);background:var(--gold-alpha-3);border-left:2px solid var(--border)}
.sess-list .sd{font-family:var(--f-label);font-size:var(--text-2xs);color:var(--text-3);letter-spacing:1px}
.sess-list .sn{font-family:var(--f-body);font-size:13px;color:var(--text-1)}
.sess-list .sl{font-size:var(--text-xs);color:var(--text-3);margin-top:2px}
.sess-list .sr{font-family:var(--f-label);font-size:var(--text-2xs);letter-spacing:1px;padding:2px 7px;border-radius:8px;border:1px solid;white-space:nowrap}
.sr.win{color:var(--success);border-color:var(--success)}.sr.part{color:var(--warn);border-color:var(--warn)}.sr.fail{color:var(--danger);border-color:var(--danger)}

/* ── Quote board ── */
.quote-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;height:calc(100% - 28px);padding:4px 12px}
.quote-body{font-family:var(--f-serif);font-style:italic;font-size:var(--text-xl);color:var(--text-1);line-height:1.5;text-align:center}
.quote-attr{font-family:var(--f-label);font-size:var(--text-xs);letter-spacing:2px;text-transform:uppercase;color:var(--gold-mid);text-align:center;margin-top:10px}

/* ── Resource cards ── */
.res-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.res-card{background:var(--bg-card-inner);border:1px solid var(--border);border-radius:var(--r-lg);padding:12px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;transition:all var(--dur-hover) var(--ease);cursor:pointer}
.res-card:hover{border-color:var(--border-strong);background:var(--gold-alpha-5)}
.res-card .rn{font-family:var(--f-label);font-size:var(--text-xs);letter-spacing:1.5px;text-transform:uppercase;color:var(--text-1)}
.res-card .rs{font-family:var(--f-body);font-size:var(--text-2xs);color:var(--text-3)}
.res-card .ri{color:var(--gold-mid);opacity:.8;margin-bottom:2px}

/* ── Recharts overrides ── */
.recharts-cartesian-axis-tick-value{fill:var(--text-3)!important;font-family:var(--f-label)!important;font-size:var(--text-2xs)!important}
.recharts-cartesian-grid line{stroke:var(--gold-alpha-5)!important}
.recharts-legend-item-text{color:var(--text-2)!important;font-family:var(--f-label)!important;font-size:var(--text-xs)!important}

/* ── Animations ── */
@keyframes fu{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.ai{animation:fu var(--dur-appear) var(--ease) both}
.d1{animation-delay:.05s}.d2{animation-delay:.1s}.d3{animation-delay:.15s}.d4{animation-delay:.2s}.d5{animation-delay:.25s}.d6{animation-delay:.35s}.d7{animation-delay:.45s}.d8{animation-delay:.55s}

/* ── Mobile controls: hidden until small screens ── */
.menu-btn,.filter-btn,.drawer-close{display:none}
.filter-btn{align-items:center;gap:6px;background:var(--gold-alpha-8);border:1px solid var(--border);border-radius:14px;color:var(--gold-pale);font-family:var(--f-label);font-size:13px;letter-spacing:1.5px;text-transform:uppercase;padding:6px 14px;cursor:pointer;transition:all var(--dur-hover) var(--ease)}
.filter-btn:hover{border-color:var(--border-strong);color:var(--gold-bright)}
.filter-btn svg{width:13px;height:13px}
.menu-btn{align-items:center;justify-content:center;width:38px;height:38px;background:none;border:1px solid var(--border);border-radius:8px;color:var(--gold-mid);cursor:pointer;flex-shrink:0}
.drawer-close{position:absolute;top:8px;right:8px;width:30px;height:30px;background:none;border:1px solid var(--border);border-radius:6px;color:var(--gold-mid);font-size:16px;line-height:1;cursor:pointer}
.drawer-overlay{position:fixed;inset:0;background:rgba(3,6,10,.66);z-index:99;animation:fade .25s var(--ease)}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* ── Decorative corner flourishes — large screens only (background layer) ── */
.deco-corners{position:fixed;inset:0;pointer-events:none;z-index:0;display:none}
.deco-corners .dc{position:absolute;width:150px;height:150px;color:var(--gold-mid);opacity:.38}
.deco-corners .dc-tl{top:10px;left:calc(var(--sidebar-width,209px) + 14px)}
.deco-corners .dc-br{bottom:10px;right:14px;transform:rotate(180deg)}

/* ── Responsive ─────────────────────────────────────────
   Breakpoints: desktop >1080 · tablet 681-1080 · mobile ≤680
   ──────────────────────────────────────────────────────── */

/* KPI cascade: all-in-row (≥1401, supports up to 6) → 3-up → 2-up → 1-up */
@media(max-width:1400px){
  .row-kpi{grid-template-columns:repeat(3,1fr)}
  .row-mid{grid-template-columns:1fr 1fr}
  .row-bot{grid-template-columns:1fr 1fr}
}

/* Decorative corners only appear at large widths */
@media(min-width:1401px){ .deco-corners{display:block} }

/* ── Tablet: icon-rail sidebar, filters on their own row ── */
@media(min-width:681px) and (max-width:1080px){
  :root{--sidebar-width:66px}
  .side{padding:8px 6px;align-items:center}
  .side-logo-img{max-width:46px}
  .side-section{font-size:0;justify-content:center;padding:12px 0 6px}
  .side-section::before,.side-section::after{font-size:6px}
  .camp-list button{justify-content:center;padding:10px 2px;font-size:var(--text-md)}
  .camp-list button .ct{display:none}
  .camp-list button.on::before{top:6px;bottom:6px}
  .side-nav{align-items:center}
  .side-nav button{justify-content:center;font-size:0;letter-spacing:0;padding:10px 0}
  .side-nav .ni{width:17px;height:17px}

  .row-kpi{--kpi-h:240px;grid-template-columns:repeat(2,1fr)}
  .prof-meter{grid-column:1/-1}
  .kpi-snap{grid-column:1/-1;height:auto}
  .row-mid,.row-bot{grid-template-columns:1fr}

  /* Header wraps: filter bar drops to its own row below the title */
  .main{grid-template-rows:auto auto auto auto}
  .row-hdr{flex-wrap:wrap;min-height:74px;padding:10px 18px}
  .hdr-right{order:3;width:100%;justify-content:flex-end;margin-top:8px}
  .top-center-img{display:none}
}

/* ── Mobile: sidebar becomes an off-canvas drawer, filter = one button ── */
@media(max-width:680px){
  :root{--sidebar-width:0px}
  .side{width:min(86vw,300px);transform:translateX(-100%);transition:transform var(--dur-transition) var(--ease);z-index:100}
  .side.open{transform:translateX(0);box-shadow:var(--shadow-card)}
  .drawer-close{display:block}

  .main{margin-left:0;padding:10px;grid-template-rows:auto auto auto auto}

  /* Header acts as the mobile bar: title + single Filter control */
  .row-hdr{min-height:60px;padding:10px 14px}
  .top-center-img{display:none}
  .hdr-filter,.top-icon{display:none}
  .filter-btn{display:inline-flex}
  .hdr-title{font-size:var(--text-lg);letter-spacing:3px}
  .hdr-sub{font-size:var(--text-sm)}

  /* Everything stacks single-column, in priority order (DOM order) */
  .row-kpi{--kpi-h:auto;grid-template-columns:1fr}
  .kpi{height:auto;min-height:118px;padding:16px 12px}
  .kpi-chart{height:auto;min-height:220px}
  .prof-meter{grid-column:1/-1;height:auto}
  .kpi-snap{grid-column:1/-1;height:auto}
  .pf-gauge-svg{max-width:300px}
  .row-mid,.row-bot{grid-template-columns:1fr}

  /* Quick links become a vertical list of full-width buttons */
  .res-grid{grid-template-columns:1fr}
  .res-card{flex-direction:row;justify-content:flex-start;gap:12px;padding:14px 16px;text-align:left}
}

/* ===== Header back-link ===== */
.hdr-back{font-family:var(--f-label);font-size:var(--text-xs);letter-spacing:2px;text-transform:uppercase;color:var(--gold-mid);text-decoration:none;border:1px solid var(--border);border-radius:var(--r);padding:6px 12px;transition:all var(--dur-hover) var(--ease);white-space:nowrap}
.hdr-back:hover{color:var(--gold-bright);border-color:var(--border-strong);background:var(--gold-alpha-5)}

/* ===== Roll Analytics row ===== */
.row-analytics{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row-analytics .span2{grid-column:1 / -1}
.an-cap{font-family:var(--f-body);font-size:var(--text-sm);color:var(--text-3);line-height:1.5;margin-top:10px;font-style:italic}
.an-cap em{color:var(--text-2);font-style:italic}.an-cap strong{color:var(--gold-pale);font-weight:500}
.analytics-empty .an-empty{color:var(--text-3);font-family:var(--f-label);font-size:var(--text-md);letter-spacing:1px;text-align:center;padding:44px 16px}

/* ===== Luck Leaderboard ===== */
.luck-scroll{overflow-x:auto;scrollbar-width:thin;scrollbar-color:var(--gold-mid) transparent}
.luck-tbl{width:100%;border-collapse:collapse}
.luck-tbl th{font-family:var(--f-label);font-size:var(--text-2xs);letter-spacing:1.5px;text-transform:uppercase;color:var(--gold-mid);text-align:left;padding:0 8px 8px;border-bottom:1px solid var(--border)}
.luck-tbl th.num,.luck-tbl td.num{text-align:right}
.luck-tbl td{font-family:var(--f-body);font-size:13px;color:var(--text-2);padding:7px 8px;border-bottom:1px solid var(--gold-alpha-5);white-space:nowrap}
.luck-tbl td:first-child{color:var(--text-1)}
.luck-tbl tr.lucky td:first-child{color:var(--gold-pale)}
.luck-tbl tr.cursed td:first-child{color:var(--danger)}
.luck-tbl .lk-foot td{border-bottom:none;border-top:1px solid var(--border);color:var(--text-1);font-weight:500;padding-top:9px}
.rpill{display:inline-block;font-family:var(--f-display);font-size:11px;padding:1px 8px;border-radius:10px;background:var(--gold-alpha-8);color:var(--text-2)}
.rpill.up{color:var(--success);background:rgba(74,158,110,.12)}
.rpill.dn{color:var(--danger);background:rgba(180,74,74,.12)}
.rpill.ev{color:var(--gold);background:var(--gold-alpha-10)}

/* ===== Records & Reckonings ===== */
.rec-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.rec-card{background:var(--gold-alpha-3);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.rec-card.lucky{border-color:rgba(74,158,110,.3);background:rgba(74,158,110,.05)}
.rec-card.cursed{border-color:rgba(180,74,74,.28);background:rgba(180,74,74,.05)}
.rec-tag{font-family:var(--f-label);font-size:var(--text-2xs);letter-spacing:1.5px;text-transform:uppercase;color:var(--gold-mid)}
.rec-title{font-family:var(--f-display);font-size:15px;color:var(--gold-pale);letter-spacing:.5px}
.rec-big{font-family:var(--f-display);font-size:30px;font-weight:500;color:var(--text-1);line-height:1.05}
.rec-big.up{color:var(--success)}.rec-big.dn{color:var(--danger)}
.rec-who{font-family:var(--f-label);font-size:var(--text-xs);letter-spacing:1px;color:var(--text-2)}
.rec-note{font-family:var(--f-body);font-size:11px;color:var(--text-3);line-height:1.45;margin-top:2px}
.rec-split{display:flex;gap:14px}.rec-sh{flex:1}.rec-split .rec-big{font-size:24px}

/* ===== Signatures & Hall of Fame ===== */
.sh-wrap{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:560px){.sh-wrap{grid-template-columns:1fr}}
.sh-h{font-family:var(--f-label);font-size:var(--text-2xs);letter-spacing:1.5px;text-transform:uppercase;color:var(--gold-mid);margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.sig-list,.hof-list{list-style:none;display:flex;flex-direction:column;gap:6px}
.sig-list li{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:4px 0;border-bottom:1px solid var(--gold-alpha-5)}
.sig-ch{font-family:var(--f-body);font-size:13px;color:var(--text-1);font-weight:500}
.sig-rt{display:flex;align-items:baseline;gap:8px}
.sig-mv{font-family:var(--f-body);font-size:12px;color:var(--text-2)}
.sig-ct{font-family:var(--f-display);font-size:12px;color:var(--gold);background:var(--bg-card-inner);border-radius:8px;padding:1px 7px}
.hof-list li{display:grid;grid-template-columns:24px 38px 1fr;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--gold-alpha-5)}
.hof-rk{font-family:var(--f-deco);font-size:13px;color:var(--gold-mid);text-align:center}
.hof-dm{font-family:var(--f-display);font-size:18px;color:var(--gold-pale);text-align:right}
.hof-ds{font-family:var(--f-body);font-size:11px;color:var(--text-3);line-height:1.3}
.hof-ds b{color:var(--text-1);font-weight:500}

/* ===== d20 distribution ===== */
.dist-wrap{display:flex;flex-direction:column}
</style>
</head>
