<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Session &middot; Sky Is The Limit &middot; Rectrix Caedere</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=Cinzel+Decorative:wght@400;700&family=Raleway:wght@300;400;500&family=Alegreya+Sans+SC:wght@400;500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<!-- Single source of truth for tokens. This page used to carry its own :root
     block, which AUDIT.md §5 flagged as the thing to remove. -->
<link rel="stylesheet" href="/tokens.css">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<link rel="stylesheet" href="/assets/session-layout.css">
</head>
<body>

<!-- Layout, chrome and renderers live in /assets/session-layout.{css,js}, shared
     with every other campaign. This page only says where SKITL's data comes from. -->
<div id="session"></div>

<script src="/assets/session-layout.js"></script>
<script>
var SB=SessionLayout.SB,HDRS=SessionLayout.HDRS;

/* Content comes from Supabase, never from the vault repo. This page used to fetch
   01-Sessions/*.md out of a public sitl_vault and render it, which meant the
   published page WAS the working vault note -- above-table chatter and the DM's
   personal detail included. `public_sessions` + `public_session_panels` are the
   curated boundary: a row reaches this page only if someone marked it published,
   per panel. Do NOT reintroduce a fallback to the raw note. */
var PUBSESS=SB+'/rest/v1/public_sessions?select=id,session_label,session_date,title,region,waypoint,arc,recording,body_md&published=eq.true&order=session_sort';

/* PC colours. Kit is green by Taylor's call (2026-09-29); it has to stay clear
   of Blarg's olive, so Kit takes a cooler jade and Blarg keeps the warm olive.
   Binks/Ormic was #7FA6A0, too dim against the card at this size, and brighter
   also separates him from Kit now that both sit in the green-teal range. */
var PC={'Kit Aluri':'#4FC58C','Binks Stonevein':'#78D6E0','Ormic':'#78D6E0','Aeolus':'#A084D8','Blarg':'#8FA85F','Amanita de’Champignon':'#D084BC',"Amanita de'Champignon":'#D084BC','Darby Stonefeather':'#D08A63'};
var ROSTER=['Kit Aluri','Binks Stonevein','Aeolus','Blarg','Amanita de’Champignon','Darby Stonefeather'];
var DISPO={'Ilvara':'enemy','Ilvara Mizzrym':'enemy','Shoor':'enemy','Shoor Vandree':'enemy','Jorlan':'enemy','Jorlan Duskryn':'enemy','Asha':'enemy','Black Pudding':'enemy','Gelatinous Cube':'enemy','Gray Ooze':'enemy','Wererat':'enemy','Lolth':'enemy','Topsy':'friendly','Turvy':'friendly','Stool':'friendly','Glabbagool':'friendly','Derendil':'friendly','Roxanne':'friendly','Roxy':'friendly','Clementine':'friendly','Eldeth':'friendly','Psilofyr':'friendly','Naos':'friendly','Echo':'friendly','Indigo':'friendly','Jimjar':'friendly','Hemeth':'friendly','Selûne':'friendly'};

/* public_sessions.recording is TEXT holding one of two shapes, both keyed by
   session number so no filename is maintained by hand:
     "S14.mp3"                                    single part
     '[{"lbl":"Pt 1","url":"S25-pt1.mp3"}, ...]'  multi-part, or a part marked lost
   A malformed value yields null and the player hides itself, with the reason on
   the console rather than swallowed. */
function parseRec(v){
  if(!v)return null;
  var s=String(v).trim();
  if(s.charAt(0)!=='[')return s;
  try{var a=JSON.parse(s);if(Array.isArray(a))return a;console.warn('session: recording JSON is not an array:',s);return null;}
  catch(e){console.warn('session: recording is not valid JSON:',s,e);return null;}
}

async function load(n){
  var sessions;
  try{
    var r=await fetch(PUBSESS,{headers:HDRS});
    if(!r.ok)throw new Error('HTTP '+r.status);
    sessions=await r.json();
  }catch(e){ throw new Error('Could not reach the session archive.'); }
  var idx=-1;
  for(var i=0;i<sessions.length;i++){ if(String(sessions[i].session_label)===String(n)){idx=i;break;} }
  if(idx===-1)throw new Error('Session “'+n+'” is not published.');
  var s=sessions[idx];

  var panels=[];
  try{
    var pr=await fetch(SB+'/rest/v1/public_session_panels?select=panel_key,kind,body_md,items&session_id=eq.'+s.id,{headers:HDRS});
    if(pr.ok)panels=await pr.json();
  }catch(e){ /* panels are additive; the page still renders its header and POV */ }
  var byKey={}; panels.forEach(function(p){byKey[p.panel_key]=p;});

  var tags=[];
  if(byKey.initiative)tags.push('⚔ Combat');
  var q=byKey.quests;
  if(q&&q.items){
    var done=q.items.filter(function(x){return x.done;}).length;
    if(done)tags.push('✓ '+done+' quest'+(done>1?'s':'')+' done');
  }

  return {
    sessions:sessions.map(function(x){return {label:x.session_label,title:x.title};}),idx:idx,
    label:s.session_label,title:s.title,date:s.session_date,
    where:[['Region',s.region],['Waypoint',s.waypoint],['Arc',s.arc]],
    recording:parseRec(s.recording),
    /* The published roster is the source of truth for who was at the table. */
    present:byKey.roster?(byKey.roster.items||[]).map(function(x){return String(x.name||'').trim();}):null,
    tags:tags,
    pov:s.body_md?{byline:'The Devil You Know',md:s.body_md}:null,
    panels:byKey
  };
}

function boot(){
  SessionLayout.mount({
    campaign:'Sky Is The Limit',home:'/sky-is-the-limit/',
    archive:{href:'/sky-is-the-limit/archive.html',label:'The Descent'},
    povLabel:'Character POV',
    /* Only S21 onward have a journal body. */
    povEmpty:'<p class="muted">No in-character journal has been cleared for publication here. '
      +'The journal runs from <a href="session.html?n=21">Session 21</a> onward.</p>',
    rollView:'skitl_session_rolls',
    recBase:'https://pub-33596be843004e7282ae8a9069ae9b82.r2.dev/Recordings/sitl/',
    roster:ROSTER,pcColors:PC,dispo:DISPO,
    charHref:function(name){return '/sky-is-the-limit/character.html?c='+encodeURIComponent(name);},
    /* Order and labels for the left nav. */
    nav:[
      ['narrative','Narrative Summary'],
      ['scenes','Scenes & Timeline'],
      ['themes','Themes / Beats'],
      ['quests','Quests & Objectives'],
      ['setting','Session Setting'],
      ['party','Party Structure'],
      ['reputation','Reputation'],
      ['patterns','Patterns & Implications'],
      ['continuity','Continuity Flags'],
      ['encounters','Encounters'],
      ['enc_summary','Encounter Summary'],
      ['initiative','Initiative'],
      ['rolllog','Roll Log']
    ],
    load:load
  });
}
if(typeof marked!=='undefined')boot();
else window.addEventListener('load',boot);
</script>
</body>
</html>
