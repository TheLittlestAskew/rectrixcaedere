<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Character — Sky Is The Limit · Rectrix Caedere</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cinzel+Decorative:wght@400;700&family=Raleway:wght@300;400;500;600&family=Alegreya+Sans+SC:wght@400;500;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/marked@13.0.3/marked.min.js"></script>
    <style>
      :root {
        --navy: #050a0e;
        --card: #0d141c;
        --smoked: #162230;
        --deep: #111a24;
        --gold: #c7a369;
        --gold-bright: #da9565;
        --gold-pale: #e8c690;
        --copper: #8c5d3f;
        --copperdk: #68442f;
        --amber: #af755a;
        --coral: #b7634d;
        --info: #6b8aad;
        --success: #4a9e6e;
        --mauve: #9c7fa0;
        --teal: #5e9c92;
        --text: #e8e4dc;
        --text2: #9a9590;
        --cream: #f4ebdd;
        --good: #7ccf9e;
        --bad: #e29a86;
        --warn: #d9a55b;
        --border: rgba(199, 163, 105, 0.22);
        --border-strong: rgba(199, 163, 105, 0.5);
        --fd: "Cinzel Decorative", "Cinzel", serif;
        --fc: "Cinzel", serif;
        --fb: "Raleway", system-ui, sans-serif;
        --fl: "Alegreya Sans SC", "Raleway", sans-serif;
        --fs: "EB Garamond", serif;
        --accent: #c7a369;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        background: var(--navy);
        color: var(--text);
        font-family: var(--fb);
        line-height: 1.55;
        background-image:
          radial-gradient(
            1100px 520px at 50% -8%,
            rgba(199, 163, 105, 0.07),
            transparent 60%
          ),
          radial-gradient(
            1px 1px at 20% 30%,
            rgba(232, 198, 144, 0.5),
            transparent
          ),
          radial-gradient(
            1px 1px at 70% 18%,
            rgba(232, 198, 144, 0.35),
            transparent
          ),
          radial-gradient(
            1px 1px at 85% 60%,
            rgba(232, 198, 144, 0.3),
            transparent
          ),
          radial-gradient(
            1px 1px at 35% 75%,
            rgba(232, 198, 144, 0.3),
            transparent
          );
      }
      a {
        color: var(--gold-pale);
        text-decoration: none;
      }
      button {
        font: inherit;
        color: inherit;
      }

      .frame {
        position: relative;
        max-width: 1320px;
        margin: 0 auto;
        padding: clamp(16px, 2.2vw, 28px) clamp(14px, 2.4vw, 32px) 60px;
      }
      .frame::before,
      .frame::after {
        content: "";
        position: absolute;
        width: 34px;
        height: 34px;
        pointer-events: none;
      }
      .frame::before {
        top: 8px;
        left: 8px;
        border-top: 1px solid var(--border-strong);
        border-left: 1px solid var(--border-strong);
      }
      .frame::after {
        bottom: 8px;
        right: 8px;
        border-bottom: 1px solid var(--border-strong);
        border-right: 1px solid var(--border-strong);
      }
      .crumb {
        font-family: var(--fl);
        letter-spacing: 0.18em;
        text-transform: uppercase;
        font-size: 11px;
        color: var(--text2);
        margin-bottom: 18px;
      }
      .crumb a {
        color: var(--text2);
      }
      .crumb a:hover {
        color: var(--gold-pale);
      }
      .crumb .sep {
        color: var(--copper);
        margin: 0 8px;
      }

      /* party switcher */
      .navwrap {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 22px;
      }
      .backbtn {
        font-family: var(--fl);
        letter-spacing: 0.1em;
        text-transform: uppercase;
        font-size: 12px;
        color: var(--gold-pale);
        border: 1px solid var(--border-strong);
        border-radius: 7px;
        padding: 8px 14px;
        white-space: nowrap;
      }
      .backbtn:hover {
        background: rgba(199, 163, 105, 0.1);
      }
      .navchev {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 34px;
        height: 34px;
        border-radius: 7px;
        border: 1px solid var(--border);
        color: var(--gold-pale);
        font-size: 20px;
        flex: 0 0 auto;
      }
      .navchev:hover {
        background: rgba(199, 163, 105, 0.1);
      }
      .jump {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        flex: 1 1 auto;
        padding: 2px;
        scrollbar-width: thin;
      }
      .pcchip {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 4px 13px 4px 4px;
        border: 1px solid var(--border);
        border-radius: 999px;
        color: var(--text2);
        white-space: nowrap;
        flex: 0 0 auto;
      }
      .pcchip:hover {
        border-color: var(--border-strong);
        color: var(--gold-pale);
      }
      .pcchip img {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        object-fit: cover;
        object-position: 50% 18%;
        border: 1px solid var(--copperdk);
        background: var(--smoked);
      }
      .pcchip .nm {
        font-family: var(--fl);
        letter-spacing: 0.07em;
        text-transform: uppercase;
        font-size: 12px;
      }
      .pcchip.cur {
        border-color: var(--accent);
        background: rgba(199, 163, 105, 0.13);
        color: var(--gold-pale);
        box-shadow: 0 0 0 1px var(--accent) inset;
      }

      /* shared panel */
      .panel {
        border: 1px solid var(--border);
        border-radius: 10px;
        background: linear-gradient(180deg, var(--deep), rgba(13, 20, 28, 0.6));
        position: relative;
        min-width: 0;
      }
      .panel::before {
        content: "";
        position: absolute;
        top: -1px;
        left: 18px;
        right: 18px;
        height: 1px;
        background: linear-gradient(
          90deg,
          transparent,
          var(--accent),
          transparent
        );
        opacity: 0.7;
      }
      .ph {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 13px 18px 11px;
        border-bottom: 1px solid var(--border);
      }
      .ph h2 {
        margin: 0;
        font-family: var(--fc);
        font-weight: 500;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        font-size: 12px;
        color: var(--gold-pale);
        display: flex;
        align-items: center;
        gap: 9px;
      }
      .ph h2 .star {
        color: var(--copper);
      }
      .ph .meta {
        margin-left: auto;
        font-family: var(--fl);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-size: 11px;
        color: var(--text2);
        white-space: nowrap;
      }
      .pb {
        padding: 12px 18px 16px;
      }
      .span {
        grid-column: 1/-1;
      }

      /* hero */
      .hero {
        display: grid;
        grid-template-columns: clamp(150px, 15vw, 190px) minmax(0, 1fr) minmax(
            300px,
            30%
          );
        gap: clamp(16px, 2.2vw, 28px);
        align-items: stretch;
      }
      .portrait .fr {
        padding: 7px;
        border: 1px solid var(--border-strong);
        border-radius: 12px;
        background: linear-gradient(
          180deg,
          rgba(199, 163, 105, 0.08),
          rgba(13, 20, 28, 0.4)
        );
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.55);
      }
      .portrait img {
        width: 100%;
        display: block;
        border-radius: 7px;
        border: 1px solid var(--copperdk);
        background: var(--smoked);
      }
      .ident {
        min-width: 0;
        display: flex;
        flex-direction: column;
      }
      .eyebrow {
        font-family: var(--fl);
        letter-spacing: 0.26em;
        text-transform: uppercase;
        font-size: 11px;
        color: var(--accent);
        margin-bottom: 6px;
      }
      .ident h1 {
        font-family: var(--fd);
        font-weight: 700;
        font-size: clamp(32px, 4.4vw, 54px);
        line-height: 1;
        margin: 0;
        color: var(--cream);
      }
      .subtitle {
        font-family: var(--fl);
        font-weight: 500;
        letter-spacing: 0.07em;
        font-size: clamp(13px, 1.4vw, 16px);
        color: var(--gold);
        margin: 8px 0 0;
      }
      .badges {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
        margin: 12px 0 0;
      }
      .badge {
        font-family: var(--fl);
        letter-spacing: 0.06em;
        font-size: 11px;
        text-transform: uppercase;
        padding: 4px 10px;
        border-radius: 6px;
        border: 1px solid currentColor;
        background: rgba(0, 0, 0, 0.18);
      }
      .b-active {
        color: var(--good);
      }
      .b-pc {
        color: #8fb4d6;
      }
      .b-lvl {
        color: var(--gold-pale);
      }
      .b-status {
        color: #d29a82;
      }
      .facts {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 1px;
        margin-top: 16px;
        border: 1px solid var(--border);
        border-radius: 8px;
        overflow: hidden;
        background: var(--deep);
      }
      .fact {
        background: var(--deep);
        outline: 1px solid var(--border);
        padding: 8px 12px;
        min-width: 0;
      }
      .fact .k {
        font-family: var(--fl);
        letter-spacing: 0.1em;
        text-transform: uppercase;
        font-size: 10px;
        color: var(--text2);
      }
      .fact .v {
        font-size: 13.5px;
        color: var(--text);
        line-height: 1.35;
        margin-top: 2px;
        display: -webkit-box;
        -webkit-line-clamp: 4;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .epigraph {
        margin-top: auto;
        padding-top: 14px;
      }
      .epigraph p {
        margin: 0;
        font-family: var(--fs);
        font-style: italic;
        font-size: 18px;
        line-height: 1.4;
        color: var(--cream);
        border-left: 2px solid var(--accent);
        padding: 2px 0 2px 14px;
      }
      .epigraph .src {
        font-family: var(--fl);
        font-style: normal;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        font-size: 10px;
        color: var(--gold);
        margin-left: 8px;
      }

      /* roll widget */
      .rolls .pb {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .tiles {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
      }
      .tile {
        text-align: center;
        padding: 10px 6px;
        border-radius: 8px;
        background: rgba(22, 34, 48, 0.55);
        border: 1px solid var(--border);
      }
      .tile .v {
        font-family: var(--fc);
        font-size: 24px;
        font-weight: 500;
        color: var(--gold-pale);
        line-height: 1;
      }
      .tile.up .v {
        color: var(--good);
      }
      .tile.dn .v {
        color: var(--bad);
      }
      .tile .l {
        font-family: var(--fl);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-size: 10px;
        color: var(--text2);
        margin-top: 5px;
      }
      .tile .x {
        font-size: 11px;
        color: var(--text2);
        margin-top: 2px;
      }
      .chart svg {
        width: 100%;
        height: auto;
        display: block;
      }
      .chart .cap {
        display: flex;
        justify-content: space-between;
        font-family: var(--fl);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-size: 10px;
        color: var(--text2);
        margin-top: 4px;
      }
      .legend {
        display: flex;
        gap: 12px;
        font-size: 11px;
        color: var(--text2);
        flex-wrap: wrap;
      }
      .legend i {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        margin-right: 5px;
        vertical-align: 0;
      }
      .unavail {
        font-size: 13px;
        color: var(--text2);
        font-style: italic;
      }

      /* pulse strip */
      .pulse {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        gap: 10px;
        margin-top: 20px;
      }
      .pulse button {
        all: unset;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        gap: 3px;
        padding: 11px 14px;
        border: 1px solid var(--border);
        border-radius: 9px;
        background: rgba(17, 26, 36, 0.7);
        transition:
          border-color 0.15s,
          background 0.15s;
      }
      .pulse button:hover,
      .pulse button:focus-visible {
        border-color: var(--border-strong);
        background: rgba(199, 163, 105, 0.07);
      }
      .pulse .n {
        font-family: var(--fc);
        font-size: 22px;
        color: var(--gold-pale);
        line-height: 1;
      }
      .pulse .t {
        font-family: var(--fl);
        letter-spacing: 0.1em;
        text-transform: uppercase;
        font-size: 10.5px;
        color: var(--text2);
      }
      .pulse .n.warn {
        color: var(--warn);
      }

      /* tabs + era bar */
      .dock {
        position: sticky;
        top: 0;
        z-index: 20;
        margin: 26px calc(-1 * clamp(14px, 2.4vw, 32px)) 0;
        padding: 0 clamp(14px, 2.4vw, 32px);
        background: rgba(5, 10, 14, 0.92);
        backdrop-filter: blur(8px);
        border-bottom: 1px solid var(--border);
      }
      .tabbar {
        display: flex;
        gap: 2px;
        overflow-x: auto;
        scrollbar-width: none;
      }
      .tab {
        font-family: var(--fl);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        font-size: 13px;
        color: var(--text2);
        background: none;
        border: none;
        border-bottom: 2px solid transparent;
        padding: 13px 14px;
        cursor: pointer;
        white-space: nowrap;
      }
      .tab:hover {
        color: var(--gold-pale);
      }
      .tab.active {
        color: var(--gold-pale);
        border-bottom-color: var(--accent);
      }
      .tab .c {
        font-size: 11px;
        color: var(--copper);
        margin-left: 5px;
      }
      .era {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 8px 0 10px;
        flex-wrap: wrap;
        border-top: 1px solid rgba(199, 163, 105, 0.1);
      }
      .era .lab {
        font-family: var(--fl);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        font-size: 10.5px;
        color: var(--text2);
        margin-right: 4px;
      }
      .seg {
        font-family: var(--fl);
        letter-spacing: 0.06em;
        font-size: 12px;
        padding: 4px 11px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: none;
        color: var(--text2);
        cursor: pointer;
      }
      .seg:hover {
        color: var(--gold-pale);
        border-color: var(--border-strong);
      }
      .seg.on {
        color: var(--navy);
        background: var(--gold-pale);
        border-color: var(--gold-pale);
      }
      .era .hint {
        margin-left: auto;
        font-size: 11px;
        color: var(--text2);
        font-style: italic;
      }
      .tabpanel {
        display: none;
        padding-top: 22px;
      }
      .tabpanel.active {
        display: block;
      }

      /* dashboard grids */
      .dash {
        display: grid;
        grid-template-columns: minmax(0, 2fr) minmax(280px, 1fr);
        gap: 18px;
        align-items: start;
      }
      .col {
        display: flex;
        flex-direction: column;
        gap: 18px;
        min-width: 0;
      }
      .two {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
        align-items: stretch;
      }
      .two > .panel {
        display: flex;
        flex-direction: column;
      }
      .two > .panel > .pb {
        flex: 1;
      }
      .cards {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
        gap: 14px;
      }

      /* entry lists */
      .elist {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .ent {
        border-bottom: 1px solid rgba(199, 163, 105, 0.1);
      }
      .ent:last-child {
        border-bottom: none;
      }
      .ent > details > summary,
      .ent > .row {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        gap: 10px;
        align-items: baseline;
        padding: 8px 0;
        list-style: none;
        cursor: default;
      }
      .ent > details > summary {
        cursor: pointer;
      }
      .ent > details > summary::-webkit-details-marker {
        display: none;
      }
      .ent > details > summary .hd::after {
        content: " +";
        color: var(--copper);
        font-family: var(--fl);
      }
      .ent > details[open] > summary .hd::after {
        content: " \2212";
      }
      .hd {
        font-size: 14.5px;
        color: var(--text);
        line-height: 1.45;
      }
      .hd strong {
        color: var(--gold-pale);
        font-weight: 500;
      }
      .eb {
        padding: 0 0 12px 0;
        margin-left: 50px;
        font-family: var(--fs);
        font-size: 16.5px;
        line-height: 1.6;
        color: #d9d4ca;
      }
      .eb p {
        margin: 0 0 8px;
      }
      .eb p:last-child {
        margin: 0;
      }
      .eb strong {
        color: var(--gold-pale);
        font-weight: 500;
      }
      .sp {
        font-family: var(--fl);
        font-size: 11px;
        letter-spacing: 0.04em;
        color: var(--gold);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 1px 6px;
        min-width: 40px;
        text-align: center;
        white-space: nowrap;
      }
      .sp.none {
        color: rgba(154, 149, 144, 0.6);
        border-style: dashed;
      }
      .flags {
        display: inline-flex;
        gap: 4px;
      }
      .fl {
        font-family: var(--fl);
        font-size: 10px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        padding: 1px 6px;
        border-radius: 4px;
        white-space: nowrap;
      }
      .fl.canon {
        color: var(--navy);
        background: var(--gold-pale);
      }
      .fl.lock {
        color: #f2c3b6;
        background: rgba(183, 99, 77, 0.3);
        border: 1px solid rgba(183, 99, 77, 0.6);
      }
      .fl.open {
        color: var(--warn);
        border: 1px solid rgba(217, 165, 91, 0.5);
      }
      .fl.ok {
        color: var(--good);
        border: 1px solid rgba(124, 207, 158, 0.4);
      }
      .fl.win {
        color: var(--gold-pale);
        border: 1px solid var(--border-strong);
      }
      .ent.canon .hd {
        color: var(--cream);
      }
      .subhead {
        font-family: var(--fc);
        font-size: 11px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--amber);
        margin: 14px 0 4px;
      }
      .subhead:first-child {
        margin-top: 2px;
      }
      .empty {
        font-size: 13px;
        color: var(--text2);
        font-style: italic;
        padding: 8px 0;
        display: none;
      }
      .empty.show {
        display: block;
      }
      .note {
        font-family: var(--fs);
        font-size: 15.5px;
        line-height: 1.55;
        color: #d9d4ca;
        border-left: 2px solid var(--warn);
        background: rgba(217, 165, 91, 0.06);
        padding: 8px 12px;
        border-radius: 0 6px 6px 0;
        margin: 8px 0;
      }
      .note strong {
        color: var(--gold-pale);
        font-weight: 500;
      }
      .sec {
        font-family: var(--fl);
        font-size: 10px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--text2);
        white-space: nowrap;
      }

      /* mini relationship roster */
      .roster {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .mini {
        display: flex;
        gap: 10px;
        align-items: center;
        cursor: pointer;
        padding: 6px;
        border-radius: 8px;
        border: 1px solid transparent;
      }
      .mini:hover {
        border-color: var(--border);
        background: rgba(199, 163, 105, 0.05);
      }
      .av {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        flex: 0 0 auto;
        border: 1px solid var(--copperdk);
        background: var(--smoked);
        object-fit: cover;
        object-position: 50% 18%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: var(--fc);
        color: var(--gold);
        font-size: 15px;
      }
      .mini .nm {
        font-family: var(--fl);
        letter-spacing: 0.05em;
        font-size: 13px;
        color: var(--gold-pale);
      }
      .mini .ln {
        font-size: 12.5px;
        color: var(--text2);
        line-height: 1.35;

              cur = { kind: "note", text: t, sub: sub };
            }
            return;
          }
          if (/^[-*]\s/.test(ln)) {
            close();
            cur = { kind: "item", text: ln.replace(/^[-*]\s+/, ""), sub: sub };
            return;
          }
          if (!ln.trim()) {
            if (cur && cur.kind === "note") close();
            return;
          }
          if (/^\s+\S/.test(ln) && cur && cur.kind === "item") {
            cur.text += "\n\n" + ln.trim();
            return;
          }
          if (/^---+$/.test(ln.trim())) return;
          close();
          cur = { kind: "para", text: ln.trim(), sub: sub };
        });
        close();
        return { items: items, table: table };
      }

      /* One vault bullet -> {flags, ss, head, body}. Headline = leading bold phrase, else first sentence. */
      function toEntry(it) {
        var f = takeFlags(it.text),
          t = f.text;
        var ss = sessNums(it.text);
        t = t.replace(/^\(S[\d.]+(?:[–\-]S?[\d.]+)?\)\s*/, "");
        t = t.replace(/\s+[—–-]\s+\[\[Session[^\]]*\]\]\.?\s*$/, "");
        var paras = t.split(/\n\n/),
          p = paras[0].trim(),
          more = paras.slice(1).join("\n\n"),
          head,
          body = "";
        var m = /^\*\*([^*]+?)\*\*\s*([:.—–-]\s*)?/.exec(p);
        if (m && m[1].length <= 220) {
          head = m[1].replace(/[:.]\s*$/, "");
          body = p.slice(m[0].length).replace(/^[:.—–-]\s*/, "");
        } else if (plain(p).length <= 170) {
          head = p;
        } else {
          var cut = -1,
            re = /[.!?](?=\s)|\s[—–]\s|:\s/g,
            mm;
          while ((mm = re.exec(p))) {
            if (mm.index >= 24 && mm.index <= 170) {
              cut = mm.index + mm[0].length;
              break;
            }
            if (mm.index > 170) break;
          }
          if (cut > 0) {
            head = p
              .slice(0, cut)
              .replace(/\s[—–]\s$|[:]\s$/, "")
              .trim();
            body = p.slice(cut).trim();
          } else {
            var sp = p.lastIndexOf(" ", 140);
            sp = sp > 40 ? sp : 140;
            head = p.slice(0, sp) + "…";
            body = "…" + p.slice(sp);
          }
        }
        head = head.replace(/^S\d{1,2}(?:\.5)?:\s*/, "");
        if (more) body = (body ? body + "\n\n" : "") + more;
        return {
          flags: f.keys,
          ss: ss,
          head: head,
          body: body.trim(),
          sub: it.sub,
          kind: it.kind,
        };
      }

      function entryHtml(e, secLabel) {
        var attrs =
          ' data-ss="' +
          e.ss.join(",") +
          '" class="ent' +
          (e.flags.indexOf("canon") >= 0 ? " canon" : "") +
          '"';
        var top =
          spill(e.ss) +
          '<span class="hd">' +
          inl(e.head) +
          "</span>" +
          '<span class="tagcol">' +
          (secLabel ? '<span class="sec">' + zesc(secLabel) + "</span> " : "") +
          flagPills(e.flags) +
          "</span>";
        if (e.body)
          return (
            "<li" +
            attrs +
            "><details><summary>" +
            top +
            '</summary><div class="eb">' +
            blk(e.body) +
            "</div></details></li>"
          );
        return "<li" + attrs + '><div class="row">' + top + "</div></li>";
      }

      /* Render a whole vault section as an entry list (sub-headings kept, notes as callouts). */
      function entryList(sec) {
        var parsed = parseItems(sec),
          html = "",
          open = false;
        function ensure() {
          if (!open) {
            html += '<ul class="elist">';
            open = true;
          }
        }
        function shut() {
          if (open) {
            html += "</ul>";
            open = false;
          }
        }
        parsed.items.forEach(function (it) {
          if (it.kind === "sub") {
            shut();
            html += '<div class="subhead">' + inl(it.text) + "</div>";
            return;
          }
          if (it.kind === "note") {
            shut();
            var f = takeFlags(it.text);
            html +=
              '<div class="note" data-ss="' +
              sessNums(it.text).join(",") +
              '">' +
              flagPills(f.keys) +
              " " +
              blk(f.text).replace(/^<p>|<\/p>\s*$/g, "") +
              "</div>";
            return;
          }
          ensure();
          html += entryHtml(toEntry(it));
        });
        shut();
        return (
          html + '<div class="empty">Nothing recorded in this range.</div>'
        );
      }

      function panel(title, inner, meta, cls, id) {
        return (
          '<section class="panel' +
          (cls ? " " + cls : "") +
          '"' +
          (id ? ' id="' + id + '"' : "") +
          '><div class="ph"><h2><span class="star">&#10022;</span>' +
          zesc(title) +
          "</h2>" +
          (meta ? '<span class="meta">' + meta + "</span>" : "") +
          '</div><div class="pb">' +
          inner +
          "</div></section>"
        );
      }

      /* ---------- key events (session timeline) ---------- */
      function sessionTitle(link) {
        var inner = (/\[\[([^\]|]+)/.exec(link) || [])[1] || link;
        var t =
          inner
            .split(/\s[—–-]\s/)
            .slice(1)
            .join(" — ") || inner.replace(/^SITL_\d+_\d+_/, "");
        return t
          .replace(/^\d{6}_/, "")
          .replace(/_/g, " ")
          .replace(/\s{2,}/g, " ")
          .trim();
      }
      function parseEvents(body) {
        var map = {},
          order = [];
        function slot(n) {
          var k = String(n);
          if (!map[k]) {
            map[k] = {
              n: n,
              title: "",
              beats: [],
              notes: [],
              flags: [],
              gap: false,
            };
            order.push(k);
          }
          return map[k];
        }
        function addFlags(s, keys) {
          keys.forEach(function (k) {
            if (s.flags.indexOf(k) < 0) s.flags.push(k);
          });
        }
        var ke = parseItems(section(body, /key events/i));
        ke.items.forEach(function (it) {
          if (it.kind !== "item") return;
          var m = /^(?:\S+\s+)?\*\*(.+?)\*\*:?\s*/.exec(it.text);
          var lead = m ? m[1] : "",
            ns = sessNums(lead);
          if (!ns.length) return;
          var f = takeFlags(it.text);
          var rest = f.text.replace(/^\*\*(.+?)\*\*:?\s*/, "");
          if (ns.length > 1 && /not\s+(written|propagated)/i.test(it.text)) {
            var g = slot(ns[0]);
            g.gap = true;
            g.span = ns;
            g.notes.push(rest);
            addFlags(g, f.keys);
            return;
          }
          var s = slot(ns[0]);
          s.title = s.title || sessionTitle(lead);
          rest.split(/\n\n/).forEach(function (b) {
            if (b.trim()) s.beats.push(b.trim());
          });
          addFlags(s, f.keys);
        });
        /* "### S15 Key Events" blocks can sit anywhere in the sheet, including under Key Quotes. */
        var re = /^###\s+S(\d{1,2}(?:\.5)?)\s+Key Events.*$/gm,
          m2;
        while ((m2 = re.exec(body))) {
          var after = body.slice(m2.index + m2[0].length),
            stop = after.search(/^##/m),
            blockTxt = stop === -1 ? after : after.slice(0, stop);
          var s = slot(parseFloat(m2[1]));
          if (!s.title) {
            var tl = /\[\[([^\]]+)\]\]/.exec(m2[0]);
            if (tl) s.title = sessionTitle("[[" + tl[1] + "]]");
          }
          parseItems(blockTxt).items.forEach(function (it) {
            var f = takeFlags(it.text);
            addFlags(s, f.keys);
            if (it.kind === "note") s.notes.push(f.text);
            else if (it.kind !== "sub")
              s.beats.push((it.kind === "item" ? "- " : "") + f.text);
          });
        }
        return order
          .map(function (k) {
            return map[k];
          })
          .sort(function (a, b) {
            return a.n - b.n;
          });
      }
      /* Bullets from "### SNN Key Events" blocks must not leak into the quote board. */
      function stripEventBlocks(sec) {
        return (sec || "").replace(
          /^###\s+S\d{1,2}(?:\.5)?\s+Key Events[\s\S]*?(?=^###|$(?![\s\S]))/gm,
          "",
        );
      }

      /* ---------- quotes ---------- */
      function parseQuotes(body) {
        var q = stripEventBlocks(section(body, /key quotes/i));
        return parseItems(q)
          .items.filter(function (it) {
            return it.kind === "item";
          })
          .map(function (it) {
            var l = it.text;
            var tag = (/\[([^\]\[]+)\]\s*(?:[—–-].*)?$/.exec(l) || [])[1] || "";
            var qt = /^["“]([\s\S]+?)["”](?=\s*(?:[—–-]|\[|$))/.exec(l);
            var text = qt
              ? qt[1]
              : l
                  .replace(/\s+[—–]\s+S\d[\s\S]*$/, "")
                  .replace(/^["“]|["”]$/g, "");
            var after = qt ? l.slice(qt[0].length) : l.slice(text.length);
            var src = after
              .replace(/\[[^\]\[]+\]/, "")
              .replace(/^\s*[—–-]\s*/, "")
              .trim();
            var tags = tag
              .split("/")
              .map(function (x) {
                return x.trim();
              })
              .filter(function (x) {
                return x && !/^(sic|inaudible)/i.test(x);
              });
            return { text: text, src: src, tags: tags, ss: sessNums(src) };
          });
      }
      function tagKey(t) {
        t = t.toLowerCase();
        if (/defin/.test(t)) return "defining";
        if (/poign/.test(t)) return "poignant";
        if (/funny/.test(t)) return "funny";
        if (/banter/.test(t)) return "banter";
        if (/important/.test(t)) return "important";
        return "serious";
      }
      function quoteHtml(q) {
        return (
          '<div class="quote t-' +
          tagKey(q.tags[0] || "") +
          '" data-ss="' +
          q.ss.join(",") +
          '" data-tags="' +
          zesc(q.tags.map(tagKey).join(" ")) +
          '" data-txt="' +
          zesc(plain(q.text + " " + q.src).toLowerCase()) +
          '">' +
          '<div class="q">&ldquo;' +
          inl(q.text) +
          '&rdquo;</div><div class="m"><span class="s">' +
          inl(q.src) +
          "</span>" +
          '<span class="qt">' +
          q.tags
            .map(function (t) {
              return '<span class="qtag">' + zesc(t) + "</span>";
            })
            .join("") +
          "</span></div></div>"
        );
      }

      /* ---------- relationships ---------- */
      function parseRels(body) {
        return parseItems(section(body, /relationships/i))
          .items.filter(function (it) {
            return it.kind === "item";
          })
          .map(function (it) {
            var f = takeFlags(it.text),
              m = /^\*\*(.+?)\*\*:?\s*/.exec(f.text);
            var who = m ? plain(m[1]).replace(/:$/, "") : "",
              txt = m ? f.text.slice(m[0].length) : f.text;
            var pcKey = null;
            Object.keys(PCS).forEach(function (k) {
              if (PCS[k].name.toLowerCase() === who.toLowerCase()) pcKey = k;
            });
            return {
              who: who || "Unnamed",
              txt: txt,
              ss: sessNums(it.text),
              flags: f.keys,
              pc: pcKey,
            };
          });
      }
      function avatar(r) {
        return r.pc
          ? '<img class="av" src="/assets/img/' + PCS[r.pc].img + '" alt="">'
          : '<span class="av">' +
              zesc((r.who[0] || "?").toUpperCase()) +

      /* ---------- inventory ---------- */
      var LANES = [
        ["attuned", "Attuned"],
        ["equipped", "Equipped"],
        ["carried", "Carried"],
        ["borrowed", "Held, not owned"],
        ["boon", "Feats & boons"],
        ["pending", "Unconfirmed"],
      ];
      function parseTable(rows) {
        rows = rows.filter(function (r) {
          return !/^\s*\|\s*:?-{2,}/.test(r);
        });
        if (rows.length < 2) return [];
        function cells(r) {
          return r
            .trim()
            .replace(/^\||\|$/g, "")
            .split("|")
            .map(function (c) {
              return c.trim();
            });
        }
        var hdr = cells(rows[0]).map(function (h) {
          return h.toLowerCase();
        });
        return rows.slice(1).map(function (r) {
          var c = cells(r),
            o = {};
          hdr.forEach(function (h, i) {
            o[h] = c[i] || "";
          });
          return o;
        });
      }
      function classify(item, status) {
        var s = plain(status).toLowerCase(),
          n = plain(item).toLowerCase();
        if (/held, not owned|borrowed/.test(s) || /borrowed/.test(n))
          return "borrowed";
        if (/\bfeat\b|boon/.test(n)) return "boon";
        if (/^tbd|assumed acquired|confirm with dm/.test(s)) return "pending";
        if (/attuned/.test(s)) return "attuned";
        if (
          /^equipped|^worn|equipped\./.test(s) ||
          /^\**equipped/.test(status.toLowerCase())
        )
          return "equipped";
        return "carried";
      }
      function itemTags(item, status) {
        var t = [],
          s = plain(status);
        var bolds = status.match(/\*\*([^*]{3,40}?)\.?\*\*/g) || [];
        bolds.forEach(function (b) {
          b = b.replace(/\*/g, "").replace(/\.$/, "");
          if (/item$|^homebrew|^growth|^iconic/i.test(b)) t.push(["mag", b]);
        });
        if (
          /homebrew/i.test(s) &&
          !t.some(function (x) {
            return /homebrew/i.test(x[1]);
          })
        )
          t.push(["mag", "Homebrew"]);
        if (/degraded|destroyed/i.test(s)) t.push(["bad", "Damaged"]);
        if (/\+\d/.test(plain(item)))
          t.push(["", (/\+\d/.exec(plain(item)) || [""])[0]]);
        return t;
      }

      /* ---------- gallery ---------- */
      function galleryBoard(body) {
        var g = section(body, /gallery/i),
          imgs = [];
        if (g) {
          var re = /!\[([^\]]*)\]\(([^)\s]+)(?:\s+"[^"]*")?\)/g,

          while ((m = re.exec(g))) imgs.push({ alt: m[1], url: m[2] });

        return (

      /* ---------- rolls ---------- */
      async function rollStats(name, sessions) {
        try {
          var url =
            SB +
            "/rest/v1/skitl_session_rolls?character=eq." +
            encodeURIComponent(name) +
            "&select=session_date,dice_notation,individual_values&limit=10000";
          var r = await fetch(url, {
            headers: { apikey: AK, Authorization: "Bearer " + AK },
          });
          if (!r.ok) return null;
          var rows = await r.json();
          function iv(v) {
            if (typeof v === "string") {
              try {
                v = JSON.parse(v);
              } catch (e) {
                return null;
              }
            }
            return Array.isArray(v) ? v : null;
          }
          var dates = sessions.map(function (s) {
            return { n: parseFloat(s.n), t: Date.parse(s.d + "T12:00:00Z") };
          });
          function toSess(d) {
            var t = Date.parse(d + "T12:00:00Z"),
              best = null,
              bd = 1e15;
            dates.forEach(function (s) {
              var dd = Math.abs(s.t - t);
              if (dd < bd) {
                bd = dd;
                best = s.n;
              }
            });
            return bd <= 2 * 864e5 ? best : null;
          }
          var per = {},
            tot = { rolls: rows.length, d20: 0, n20: 0, n1: 0 };
          rows.forEach(function (x) {
            var sn = x.session_date ? toSess(x.session_date) : null,
              p = null;
            if (sn != null) {
              p = per[sn] || (per[sn] = { rolls: 0, n20: 0, n1: 0 });
              p.rolls++;
            }
            if (/d20/.test(x.dice_notation || "")) {
              var a = iv(x.individual_values);
              tot.d20++;
              if (a) {
                if (a.indexOf(20) >= 0) {
                  tot.n20++;
                  if (p) p.n20++;
                }
                if (a.indexOf(1) >= 0) {
                  tot.n1++;
                  if (p) p.n1++;
                }
              }
            }
          });
          return { tot: tot, per: per };
        } catch (e) {
          console.error("[character] roll stats failed", e);
          return null;
        }
      }
      function rollChart(per, sessions) {
        var ns = sessions.map(function (s) {
            return parseFloat(s.n);
          }),
          W = 320,
          H = 92,
          pad = 4,
          bw = (W - pad * 2) / ns.length;
        var max = Math.max.apply(
          null,
          ns
            .map(function (n) {
              return per[n] ? per[n].rolls : 0;
            })
            .concat([1]),
        );
        var bars = ns
          .map(function (n, i) {
            var p = per[n] || { rolls: 0, n20: 0, n1: 0 },
              h = Math.round((p.rolls / max) * (H - 26)),
              x = pad + i * bw;
            var tip =
              sLabel(n) +
              " · " +
              p.rolls +
              " rolls · " +
              p.n20 +
              " nat 20 · " +
              p.n1 +
              " nat 1";
            return (
              "<g><title>" +
              tip +
              '</title><rect x="' +
              (x + 1).toFixed(1) +
              '" y="' +
              (H - 16 - h) +
              '" width="' +
              (bw - 2).toFixed(1) +
              '" height="' +
              Math.max(h, p.rolls ? 2 : 0) +
              '" rx="1.5" fill="var(--accent)" opacity="' +
              (p.rolls ? 0.75 : 0) +
              '"/>' +
              '<rect x="' +
              (x + 1).toFixed(1) +
              '" y="' +
              (H - 16 - h - 10) +
              '" width="' +
              (bw - 2).toFixed(1) +
              '" height="' +
              (h + 26) +
              '" fill="transparent"/>' +
              (p.n20
                ? '<circle cx="' +
                  (x + bw / 2).toFixed(1) +
                  '" cy="' +
                  (H - 16 - h - 5) +
                  '" r="2.4" fill="var(--good)"/>'
                : "") +
              (p.n1
                ? '<circle cx="' +
                  (x + bw / 2).toFixed(1) +
                  '" cy="' +
                  (H - 8) +
                  '" r="2.4" fill="var(--bad)"/>'
                : "") +
              "</g>"
            );
          })
          .join("");
        return (
          '<div class="chart"><svg viewBox="0 0 ' +
          W +
          " " +
          H +
          '" role="img" aria-label="Rolls per session"><line x1="0" x2="' +
          W +
          '" y1="' +
          (H - 15.5) +
          '" y2="' +
          (H - 15.5) +
          '" stroke="rgba(199,163,105,.25)"/>' +
          bars +
          "</svg>" +
          '<div class="cap"><span>' +
          sLabel(ns[0]) +
          "</span><span>Rolls per session</span><span>" +
          sLabel(ns[ns.length - 1]) +
          "</span></div></div>" +
          '<div class="legend"><span><i style="background:var(--good)"></i>Had a nat 20</span><span><i style="background:var(--bad)"></i>Had a nat 1</span><span>Hover a bar for counts</span></div>'
        );
      }

      /* ---------- era filter ---------- */
      function applyEra(lo, hi) {
        document.querySelectorAll("[data-ss]").forEach(function (el) {
          var ss = el.getAttribute("data-ss"),
            show;
          if (lo == null) show = true;
          else if (!ss) show = false;
          else
            show = ss.split(",").some(function (x) {
              x = parseFloat(x);
              return x >= lo && x <= hi;
            });
          el.dataset.era = show ? "1" : "0";
          el.style.display = show && el.dataset.q !== "0" ? "" : "none";
        });
        document.querySelectorAll(".heat button").forEach(function (b) {
          var n = parseFloat(b.dataset.n);
          b.classList.toggle("dim", lo != null && !(n >= lo && n <= hi));
        });
        document.querySelectorAll(".elist").forEach(function (ul) {
          var any = [].some.call(ul.children, function (li) {
            return li.style.display !== "none";
          });
          var em = ul.nextElementSibling;
          if (em && em.classList.contains("empty"))
            em.classList.toggle("show", !any);
        });
      }

        var lvlNum = (/^(\d+)/.exec(lvl) || [])[1];

        /* parse everything once */
        var events = parseEvents(body),
          quotes = parseQuotes(body),
          rels = parseRels(body);
        var invParsed = parseItems(section(body, /inventory|loot/i)),
          inv = parseTable(invParsed.table).map(function (r) {
            var item = r.item || r.name || "",
              status = r.status || r.notes || "",
              acq = r["session acquired"] || r.acquired || "";
            var f = takeFlags(status);
            return {
              item: item,
              status: f.text,
              acq: acq,
              lane: classify(item, f.text),
              tags: itemTags(item, f.text),
              flags: f.keys,
              ss: sessNums(acq + " " + status),

          });
        var SECTIONS = [
          ["Appearance", /description|appearance/i],
          ["Backstory", /backstory/i],
          ["Personality", /personality/i],
          ["Features", /abilities|class features/i],
          ["Conditions", /conditions/i],
          ["Relationships", /relationships/i],
        ];
        var allEntries = [];
        SECTIONS.forEach(function (s) {
          parseItems(section(body, s[1])).items.forEach(function (it) {

        var latestN = events.length

              .filter(function (e) {

        var recentNs = events
          .filter(function (e) {

          .map(function (e) {

          });

        /* ---------- header ---------- */
        var slugs = Object.keys(PCS),
          idx = slugs.indexOf(slug),
          prev = slugs[(idx - 1 + slugs.length) % slugs.length],
          next = slugs[(idx + 1) % slugs.length];
        var chips = slugs
          .map(function (s) {
            var p = PCS[s],

            return (
              '<a class="pcchip' +

              '" alt=""><span class="nm">' +

          .join("");
        var badges = "";
        if (/party/i.test(fm("affiliation")))

          badges += '<span class="badge b-pc">Player Character</span>';
        if (lvlNum)

        if (statusF)
          badges += '<span class="badge b-status" title="' + zesc(plain(statusF)) + '">' + zesc(plain(short(statusF, 36))) + "</span>";
        /* Frontmatter sometimes carries a whole vault note; the hero shows the lead clause, full text on hover. */
        function short(v, max) {
          var t = takeFlags(zwl(v || "")).text.trim();
          if (t.length <= max) return t;
          var lead = t.split(/\s[\u2014\u2013]\s|;\s/)[0];
          if (lead.length < 3) lead = t;
          return lead.length > max ? lead.slice(0, lead.lastIndexOf(" ", max)) + "\u2026" : lead;
        }
        function fact(k, v) {

        }
        var facts =
          fact("Class", classF) +
          fact("Background", bg) +
          fact("Level", lvl) +
          fact("Player", playerF) +
          fact("Location", locF) +
          fact("First seen", firstF);
        var ep =
          quotes.filter(function (q) {
            return q.tags.some(function (t) {
              return /poign/i.test(t);
            });
          })[0] ||
          quotes.filter(function (q) {

            });

        var epHtml = ep

        var nCanon =

        var pulse = [
          [

          ["overview", nOpen, "Open threads", "warn"],
          ["rel", rels.length, "Relationships", ""],

          ["quotes", quotes.length, "Quotes", ""],

        content.innerHTML =
          '<div class="navwrap"><a class="backbtn" href="/sky-is-the-limit/">&#8592; The Party</a>' +
          '<a class="navchev" href="character.html?pc=' +

          '" aria-label="Previous character">&#8249;</a><div class="jump">' +
          chips +
          "</div>" +
          '<a class="navchev" href="character.html?pc=' +
          next +
          '" aria-label="Next character">&#8250;</a></div>' +
          '<div class="hero">' +
          '<div class="portrait"><div class="fr"><img src="/assets/img/' +
          pc.img +
          '" alt="' +
          zesc(pc.name) +
          '"></div></div>' +
          '<div class="ident"><div class="eyebrow">Sky Is The Limit &#10022; ' +

          "</div><h1>" +
          zesc(pc.name) +
          "</h1>" +
          '<div class="badges">' +
          badges +
          '</div><div class="facts">' +
          facts +
          "</div>" +
          epHtml +
          "</div>" +
          panel(
            "Roll Record",
            '<div class="tiles" id="rolltiles"><div class="tile"><div class="v">&hellip;</div><div class="l">rolls</div></div><div class="tile up"><div class="v">&hellip;</div><div class="l">nat 20</div></div><div class="tile dn"><div class="v">&hellip;</div><div class="l">nat 1</div></div></div><div id="rollchart"></div>',
            "D&amp;D Beyond",
            "rolls",
          ) +
          "</div>" +
          '<div class="pulse">' +
          pulse
            .map(function (p) {
              return (
                '<button data-go="' +
                p[0] +
                '"><span class="n ' +
                p[3] +
                '">' +
                p[1] +
                '</span><span class="t">' +
                p[2] +
                "</span></button>"
              );
            })
            .join("") +
          "</div>" +
          '<div class="dock"><div class="tabbar" id="tabbar" role="tablist"></div>' +
          '<div class="era" id="era"><span class="lab">Sessions</span></div></div>' +
          '<div id="tabpanels"></div>' +
          '<footer>Rectrix Caedere <span class="dot">&#10022;</span> Sky Is The Limit <span class="dot">&#10022;</span> <a href="/sky-is-the-limit/archive.html">The Descent</a></footer>';

        /* ---------- overview ---------- */
        var recent = allEntries.filter(function (e) {
          return e.ss.some(function (n) {

        var canon = allEntries.filter(function (e) {

        var partyRels = rels

        var featQ = quotes

        var condSec = section(body, /conditions/i);
        var overview =
          '<div class="dash"><div class="col">' +
          (recent.length

                '<ul class="elist">' +

                  '</ul><div class="empty">Nothing recorded in this range.</div>',

            : "") +
          (canon.length
            ? panel(
                "Canon Highlights",

            : "") +
          '<div class="two">' +
          panel(
            "Appearance",

          "</div>" +
          panel(
            "Personality",

          "</div></div>";

        /* ---------- sheet ---------- */
        var featItems = parseItems(section(body, /abilities|class features/i)),

            (e.body ? '<div class="tx">' + blk(e.body) + "</div>" : "") +

        var sheet =
          '<div class="col">' +

                  return (

              "</div>" +
              '<p class="pendnote">Live stats (scores, AC, HP, saves, skills, attacks) sync from D&amp;D Beyond once the sheet is public. Empty on purpose until real data is wired.</p>',
            "awaiting sync",
          ) +
          panel(
            "Features & Traits",
            featHtml || '<p class="unavail">No features recorded.</p>',
            featItems.items.filter(function (i) {
              return i.kind === "item";
            }).length + " entries",
          ) +
          "</div>";

        /* ---------- story ---------- */
        var byN = {};
        events.forEach(function (e) {
          byN[e.n] = e;
        });
        var allNs = sessions.map(function (s) {
          return parseFloat(s.n);
        });
        events.forEach(function (e) {
          if (allNs.indexOf(e.n) < 0) allNs.push(e.n);
        });
        allNs.sort(function (a, b) {
          return a - b;
        });
        var maxLen = Math.max.apply(
          null,
          events
            .map(function (e) {
              return e.beats.join(" ").length;
            })
            .concat([1]),
        );
        var dateOf = {};
        sessions.forEach(function (s) {
          dateOf[parseFloat(s.n)] = s.d;
        });
        var heat =
          '<div class="heat">' +
          allNs
            .map(function (n) {
              var e = byN[n],

                  : 0;
              return (
                '<button data-n="' +
                n +
                '" class="' +
                (!e || e.gap ? "gap" : "") +
                '" title="' +
                sLabel(n) +
                (e && e.title ? " — " + zesc(e.title) : "") +
                (e && e.gap ? " (not written up)" : "") +
                '" style="' +
                (a
                  ? "background:color-mix(in srgb,var(--accent) " +
                    Math.round(a * 100) +
                    "%,transparent)"
                  : "") +
                '">' +
                String(n).replace(/^(\d)$/, "0$1") +
                "</button>"
              );
            })
            .join("") +
          "</div>";
        function fmtDate(d) {
          if (!d) return "";
          var t = new Date(d + "T12:00:00Z");
          return t.toLocaleDateString("en-US", {
            month: "short",
            day: "numeric",
            year: "2-digit",
            timeZone: "UTC",
          });
        }
        var tl =
          '<div class="tl">' +
          events
            .slice()
            .reverse()
            .map(function (e) {
              var big =
                e.flags.indexOf("canon") >= 0 ||
                e.beats.join(" ").length > maxLen * 0.5;
              var all = e.beats.join(" "),
                compact = all.length <= 420,
                lead = e.beats.length ? toEntry({ text: e.beats[0], kind: "item" }).head : "";
              var notes = e.notes
                .map(function (n) {
                  return (
                    '<div class="note">' +
                    blk(n).replace(/^<p>|<\/p>\s*$/g, "") +
                    "</div>"
                  );
                })
                .join("");
              return (
                '<div class="sess' +
                (big ? " big" : "") +
                (e.gap ? " gapsess" : "") +
                '" id="sess-' +
                String(e.n).replace(".", "-") +
                '" data-ss="' +
                e.n +
                '">' +
                '<div class="node"><div class="num">' +
                String(e.n).replace(/^(\d)$/, "0$1") +
                '</div><div class="dt">' +
                fmtDate(dateOf[e.n]) +
                "</div></div>" +
                '<div class="scard"><h3>' +
                (e.gap ? sRange(e.span || [e.n]) + " not written up" : zesc(e.title || sLabel(e.n))) +
                " " +
                flagPills(e.flags) +
                "</h3>" +
                notes +
                (compact
                  ? '<div class="beat">' + e.beats.map(blk).join("") + "</div>"
                  : '<p class="lead">' + inl(lead) + "</p>" +
                    "<details><summary>Read the session \u00b7 " +
                    Math.max(1, Math.round(all.split(/\s+/).length / 230)) +
                    " min</summary>" +
                    '<div class="beat">' + e.beats.map(blk).join("") + "</div></details>") +
                "</div></div>"
              );
            })
            .join("") +
          "</div>";
        var story =
          panel(
            "Session Heat",
            heat,
            "darker = more happened to " + zesc(pc.name.split(" ")[0]),
          ) + tl;

        /* ---------- relationships ---------- */
        function relCard(r) {

            '<div class="rcard' +

            '"><div class="rtop">' +

            '</div><div class="ty">' +
            (r.pc ? "Party" : "Ally / NPC") +

            '<div class="tx"><p>' +
            inl(r.txt) +
            "</p></div>" +
            (r.ss.length
              ? '<div class="ss">' +
                r.ss
                  .map(function (n) {
                    return '<span class="sp">' + sLabel(n) + "</span>";
                  })
                  .join("") +
                " " +
                flagPills(r.flags) +
                "</div>"
              : "") +
            "</div>"
          );
        }
        var pRels = rels.filter(function (r) {
            return r.pc;
          }),

          });
        var relHtml =
          (pRels.length
            ? '<div class="rgroup">The Party</div><div class="cards">' +

            (oRels.length
              ? '<div class="rgroup">Everyone Else</div><div class="cards">' +
                oRels.map(relCard).join("") +
                "</div>"
              : "") || '<p class="unavail">No relationships recorded.</p>';

        /* ---------- inventory ---------- */
        var invHtml =
          '<div class="invsum">' +
          LANES.map(function (l) {

          }).join("") +
          "</div>";
        invParsed.items.forEach(function (it) {

            invHtml +=
              '<div class="note" data-ss="' +
              sessNums(it.text).join(",") +
              '">' +
              flagPills(f.keys) +

              inl(f.text) +
              "</div>";
          }
        });
        LANES.forEach(function (l) {
          var items = inv.filter(function (i) {
            return i.lane === l[0];
          });

          invHtml +=
            '<div class="lane"><div class="rgroup">' +
            l[1] +
            '</div><div class="cards">' +
            items
              .map(function (i) {
                return (
                  '<div class="item" data-ss="' +
                  i.ss.join(",") +
                  '"><div class="nm">' +
                  inl(i.item) +
                  '</div><div class="src">Acquired ' +
                  inl(i.acq) +
                  "</div>" +
                  (i.tags.length || i.flags.length
                    ? '<div class="tags">' +

                        .map(function (t) {
                          return (
                            '<span class="tg ' +
                            t[0] +
                            '">' +

                            "</span>"

                        })
                        .join("") +
                      flagPills(i.flags) +
                      "</div>"
                    : "") +
                  '<div class="tx">' +

                  "</div></div>"
                );
              })
              .join("") +
            "</div></div>";
        });
        if (!inv.length)
          invHtml = '<p class="unavail">No inventory recorded.</p>';

        /* ---------- quotes ---------- */
        var tagCounts = {};
        quotes.forEach(function (q) {
          q.tags.forEach(function (t) {

          });

        var qTools =
          '<div class="qtools"><input class="qsearch" id="qsearch" type="search" placeholder="Search quotes&hellip;" aria-label="Search quotes">' +
          '<button class="seg on" data-qt="">All ' +

          Object.keys(tagCounts)

            })
            .map(function (k) {

                '<button class="seg" data-qt="' +

              );
            })
            .join("") +
          "</div>";
        var quoteTab =
          qTools +
          '<div class="qgrid">' +
          quotes.map(quoteHtml).join("") +
          "</div>";

        var TABS = [
          { id: "overview", label: "Overview", html: overview },
          { id: "sheet", label: "Character Sheet", html: sheet },
          {
            id: "story",

            c: events.filter(function (e) {
              return !e.gap;
            }).length,

          },
          { id: "rel", label: "Relationships", c: rels.length, html: relHtml },

        document.getElementById("tabbar").innerHTML = TABS.map(function (t, i) {
          return (

            '">' +
            t.label +
            (t.c ? '<span class="c">' + t.c + "</span>" : "") +

        document.getElementById("tabpanels").innerHTML = TABS.map(

            );

        function showTab(id) {
          document.querySelectorAll(".tab").forEach(function (x) {
            x.classList.toggle("active", x.dataset.t === id);
          });
          document.querySelectorAll(".tabpanel").forEach(function (x) {
            x.classList.toggle("active", x.id === "tp-" + id);
          });
          try {
            history.replaceState(null, "", "#" + id);
          } catch (e) {}
        }
        document
          .getElementById("tabbar")
          .addEventListener("click", function (ev) {
            var b = ev.target.closest(".tab");
            if (b) showTab(b.dataset.t);
          });
        document.addEventListener("click", function (ev) {
          var g = ev.target.closest("[data-go]");
          if (!g) return;
          ev.preventDefault();
          showTab(g.dataset.go);
          document
            .querySelector(".dock")
            .scrollIntoView({ behavior: "smooth" });
        });
        var hash = location.hash.slice(1);
        if (
          TABS.some(function (t) {
            return t.id === hash;
          })
        )
          showTab(hash);

        /* era bar */
        var eras = [
          ["All", null, null],
          ["S01–10", 1, 10],
          ["S11–20", 11, 20],
          ["S21+", 21, 99],
        ];
        if (latestN != null)
          eras.push([
            "Latest (" + sLabel(recentNs[0] || latestN) + "+)",
            recentNs[0] || latestN,
            99,
          ]);
        var eraEl = document.getElementById("era");
        eraEl.innerHTML +=
          eras
            .map(function (e, i) {
              return (
                '<button class="seg' +
                (i ? "" : " on") +
                '" data-lo="' +
                (e[1] == null ? "" : e[1]) +
                '" data-hi="' +
                (e[2] == null ? "" : e[2]) +
                '">' +
                e[0] +
                "</button>"
              );
            })
            .join("") +
          '<span class="hint">Filters every tab. Lines with no session tag show under All.</span>';
        eraEl.addEventListener("click", function (ev) {
          var b = ev.target.closest(".seg");
          if (!b) return;
          eraEl.querySelectorAll(".seg").forEach(function (x) {
            x.classList.toggle("on", x === b);
          });
          applyEra(
            b.dataset.lo === "" ? null : parseFloat(b.dataset.lo),
            b.dataset.hi === "" ? null : parseFloat(b.dataset.hi),
          );
        });

        /* heat strip jumps */
        document.querySelectorAll(".heat button").forEach(function (b) {
          b.addEventListener("click", function () {
            var el = document.getElementById(
              "sess-" + b.dataset.n.replace(".", "-"),
            );
            if (el) {
              el.scrollIntoView({ behavior: "smooth", block: "start" });
            }
          });
        });

        /* quote filters (combine with era via data-q) */
        var qTag = "",
          qText = "";
        function applyQ() {
          document.querySelectorAll("#tp-quotes .quote").forEach(function (el) {
            var ok =
              (!qTag ||
                (" " + el.dataset.tags + " ").indexOf(" " + qTag + " ") >= 0) &&
              (!qText || el.dataset.txt.indexOf(qText) >= 0);
            el.dataset.q = ok ? "1" : "0";
            el.style.display = ok && el.dataset.era !== "0" ? "" : "none";
          });
        }
        document
          .querySelector("#tp-quotes .qtools")
          .addEventListener("click", function (ev) {
            var b = ev.target.closest(".seg");
            if (!b) return;
            qTag = b.dataset.qt;
            this.querySelectorAll(".seg").forEach(function (x) {
              x.classList.toggle("on", x === b);
            });
            applyQ();
          });
        document
          .getElementById("qsearch")
          .addEventListener("input", function () {
            qText = this.value.trim().toLowerCase();
            applyQ();
          });

        /* gallery lightbox */
        var lb = document.createElement("div");
        lb.className = "lightbox";
        lb.innerHTML = '<img alt="">';
        document.body.appendChild(lb);
        lb.addEventListener("click", function () {
          lb.classList.remove("open");
        });
        document.addEventListener("click", function (e) {
          var t = e.target;
          if (t && t.classList && t.classList.contains("galimg")) {
            lb.firstChild.src = t.src;
            lb.classList.add("open");
          }
        });
        document.addEventListener("keydown", function (e) {
          if (e.key === "Escape") lb.classList.remove("open");
        });

        /* rolls */
        var st = await rollStats(pc.name, sessions),
          tilesEl = document.getElementById("rolltiles"),
          chartEl = document.getElementById("rollchart");
        if (!st) {
          tilesEl.innerHTML =
            '<p class="unavail" style="grid-column:1/-1">Roll archive unavailable right now.</p>';
          return;
        }
        function pct(a, b) {
          return b ? ((100 * a) / b).toFixed(1) + "% of d20s" : "";
        }
        tilesEl.innerHTML =
          '<div class="tile"><div class="v">' +
          st.tot.rolls +
          '</div><div class="l">rolls</div><div class="x">' +
          st.tot.d20 +
          " d20</div></div>" +
          '<div class="tile up"><div class="v">' +
          st.tot.n20 +
          '</div><div class="l">nat 20</div><div class="x">' +
          pct(st.tot.n20, st.tot.d20) +
          "</div></div>" +
          '<div class="tile dn"><div class="v">' +
          st.tot.n1 +
          '</div><div class="l">nat 1</div><div class="x">' +
          pct(st.tot.n1, st.tot.d20) +
          "</div></div>";
        if (sessions.length) chartEl.innerHTML = rollChart(st.per, sessions);
      }
      if (typeof marked !== "undefined") {
        init();
      } else {
        window.addEventListener("load", init);
      }
    </script>
  </body>
</html>
