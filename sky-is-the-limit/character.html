<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Character — Sky Is The Limit · Rectrix Caedere</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cinzel+Decorative:wght@400;700&family=Raleway:wght@300;400;500;600&family=Alegreya+Sans+SC:wght@400;500;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked@13.0.3/marked.min.js"></script>
<style>
:root{
  --navy:#050A0E;--card:#0D141C;--smoked:#162230;--deep:#111A24;
  --gold:#C7A369;--gold-bright:#DA9565;--gold-pale:#E8C690;--copper:#8C5D3F;--copperdk:#68442F;
  --amber:#AF755A;--coral:#B7634D;--info:#6B8AAD;--success:#4A9E6E;--mauve:#9C7FA0;--teal:#5E9C92;
  --text:#E8E4DC;--text2:#9A9590;--cream:#F4EBDD;--ink:#2C2418;--ink2:#6B543A;
  --border:rgba(199,163,105,.25);--border-strong:rgba(199,163,105,.5);--glow:rgba(199,163,105,.3);
  --fd:'Cinzel Decorative','Cinzel',serif;--fc:'Cinzel',serif;
  --fb:'Raleway',system-ui,sans-serif;--fl:'Alegreya Sans SC','Raleway',sans-serif;--fs:'EB Garamond',serif;
  --accent:#C7A369;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--navy);color:var(--text);font-family:var(--fb);line-height:1.6;
  background-image:
    radial-gradient(1100px 520px at 50% -8%,rgba(199,163,105,.07),transparent 60%),
    radial-gradient(1px 1px at 20% 30%,rgba(232,198,144,.5),transparent),
    radial-gradient(1px 1px at 70% 18%,rgba(232,198,144,.35),transparent),
    radial-gradient(1px 1px at 85% 60%,rgba(232,198,144,.3),transparent),
    radial-gradient(1px 1px at 35% 75%,rgba(232,198,144,.3),transparent);}
a{color:var(--gold-pale);text-decoration:none}

.frame{position:relative;max-width:1180px;margin:0 auto;padding:clamp(20px,3vw,40px) clamp(16px,3vw,40px) 60px}
.frame::before,.frame::after{content:'';position:absolute;width:34px;height:34px;pointer-events:none}
.frame::before{top:8px;left:8px;border-top:1px solid var(--border-strong);border-left:1px solid var(--border-strong)}
.frame::after{bottom:8px;right:8px;border-bottom:1px solid var(--border-strong);border-right:1px solid var(--border-strong)}

.crumb{font-family:var(--fl);letter-spacing:.18em;text-transform:uppercase;font-size:11px;color:var(--text2);margin-bottom:22px}
.crumb a{color:var(--text2)}.crumb a:hover{color:var(--gold-pale)}
.crumb .sep{color:var(--copper);margin:0 8px}

.hero{display:grid;grid-template-columns:clamp(190px,22vw,250px) 1fr clamp(270px,26vw,320px);
  gap:clamp(18px,2.6vw,34px);align-items:start}
.portrait{position:relative}
.portrait .fr{padding:8px;border:1px solid var(--border-strong);border-radius:12px;
  background:linear-gradient(180deg,rgba(199,163,105,.08),rgba(13,20,28,.4));
  box-shadow:0 12px 40px rgba(0,0,0,.55)}
.portrait img{width:100%;display:block;border-radius:7px;border:1px solid var(--copperdk);background:var(--smoked)}
.portrait .plate{margin-top:10px;text-align:center;font-family:var(--fc);font-weight:500;letter-spacing:.22em;
  text-transform:uppercase;font-size:13px;color:var(--gold-pale);padding:7px 6px;
  border:1px solid var(--border);border-radius:6px;background:rgba(22,34,48,.6)}

.ident{min-width:0}
.eyebrow{font-family:var(--fl);letter-spacing:.26em;text-transform:uppercase;font-size:11px;color:var(--accent);margin-bottom:8px}
.ident h1{font-family:var(--fd);font-weight:700;font-size:clamp(34px,5.4vw,62px);line-height:1.02;margin:0;color:var(--cream)}
.subtitle{font-family:var(--fl);font-weight:500;letter-spacing:.08em;font-size:clamp(14px,1.6vw,18px);color:var(--gold);margin:8px 0 0}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 0}
.badge{display:inline-flex;align-items:center;gap:6px;font-family:var(--fl);letter-spacing:.06em;font-size:12px;
  text-transform:uppercase;padding:5px 12px;border-radius:6px;border:1px solid currentColor;background:rgba(0,0,0,.18)}
.b-active{color:#7CCF9E}.b-pc{color:#8FB4D6}.b-lvl{color:var(--gold-pale)}.b-status{color:#D29A82}
.epigraph{margin:20px 0 0;padding:16px 22px;border:1px solid var(--border);border-radius:8px;
  background:linear-gradient(180deg,rgba(244,235,221,.05),rgba(244,235,221,.02));position:relative}
.epigraph::before,.epigraph::after{content:'';position:absolute;top:50%;width:18px;height:1px;background:linear-gradient(90deg,transparent,var(--copper))}
.epigraph::before{left:0}.epigraph::after{right:0;background:linear-gradient(270deg,transparent,var(--copper))}
.epigraph p{margin:0;font-family:var(--fs);font-style:italic;font-size:18px;line-height:1.5;color:var(--cream);text-align:center}
.epigraph .src{display:block;margin-top:8px;font-family:var(--fl);font-style:normal;letter-spacing:.1em;
  text-transform:uppercase;font-size:11px;color:var(--gold)}

.panel{border:1px solid var(--border);border-radius:10px;background:linear-gradient(180deg,var(--deep),rgba(13,20,28,.55));
  padding:16px 18px;margin-bottom:16px}
.panel h3{display:flex;align-items:center;gap:10px;margin:0 0 12px;font-family:var(--fc);font-weight:500;
  letter-spacing:.16em;text-transform:uppercase;font-size:12px;color:var(--gold-pale)}
.panel h3 .star{color:var(--copper)}
.panel h3::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--border-strong),transparent)}
.prof{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;font-size:14px}
.prof dt{font-family:var(--fl);letter-spacing:.06em;text-transform:uppercase;font-size:11px;color:var(--text2);padding-top:2px}
.prof dd{margin:0;color:var(--text);text-align:right;font-family:var(--fb)}
.rollrec{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{text-align:center;padding:12px 6px;border-radius:8px;background:rgba(22,34,48,.5);border:1px solid var(--border)}
.tile .v{font-family:var(--fc);font-size:24px;font-weight:600;color:var(--gold-pale);line-height:1}
.tile.up .v{color:#7CCF9E}.tile.dn .v{color:#E29A86}
.tile .l{font-family:var(--fl);letter-spacing:.08em;text-transform:uppercase;font-size:10px;color:var(--text2);margin-top:6px}

.tabbar{display:flex;flex-wrap:wrap;gap:4px;margin:clamp(28px,4vw,44px) 0 0;border-bottom:1px solid var(--border)}
.tab{font-family:var(--fl);letter-spacing:.12em;text-transform:uppercase;font-size:13px;color:var(--text2);
  background:none;border:none;border-bottom:2px solid transparent;padding:12px 16px;cursor:pointer;transition:color .2s}
.tab:hover{color:var(--gold-pale)}
.tab.active{color:var(--gold-pale);border-bottom-color:var(--gold)}
.tabpanel{display:none;padding-top:26px}
.tabpanel.active{display:block}

.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px;align-items:start}
.pcard{background:var(--cream);border-radius:10px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.4);border:1px solid var(--copperdk)}
.pcard.span{grid-column:1/-1}
.pcard h2{margin:0;font-family:var(--fc);font-weight:600;letter-spacing:.12em;text-transform:uppercase;font-size:13px;
  color:#6B4322;padding:14px 20px 12px;display:flex;align-items:center;gap:10px;
  border-bottom:1px solid rgba(108,67,34,.22);background:linear-gradient(180deg,rgba(199,163,105,.14),transparent)}
.pcard h2 .star{color:var(--copper)}
.pbody{padding:16px 20px 20px;font-family:var(--fs);font-size:17px;line-height:1.62;color:var(--ink)}
.pbody p{margin:0 0 12px}.pbody p:last-child{margin-bottom:0}
.pbody ul,.pbody ol{margin:0 0 12px;padding-left:20px}.pbody li{margin:4px 0}
.pbody strong{color:#6B4322;font-weight:600}.pbody em{font-style:italic}
.pbody h3{font-family:var(--fc);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:12px;color:var(--copper);margin:18px 0 7px}
.pbody a{color:#7a4a22;border-bottom:1px dotted rgba(108,67,34,.5)}
.pbody blockquote{margin:0 0 12px;padding:6px 14px;border-left:3px solid var(--copper);background:rgba(108,67,34,.06);border-radius:0 5px 5px 0}
.tbl-wrap{overflow-x:auto;margin:0 0 12px;border:1px solid rgba(108,67,34,.25);border-radius:6px}
.pbody table{width:100%;border-collapse:collapse;font-family:var(--fb);font-size:13.5px;color:var(--ink)}
.pbody th,.pbody td{text-align:left;padding:8px 11px;border-bottom:1px solid rgba(108,67,34,.18)}
.pbody th{font-family:var(--fl);letter-spacing:.06em;text-transform:uppercase;font-size:11px;color:#6B4322;background:rgba(199,163,105,.16)}
.pbody tr:last-child td{border-bottom:none}

.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.quote{background:var(--cream);border-radius:8px;border:1px solid var(--copperdk);border-left:4px solid var(--copper);
  padding:13px 16px;box-shadow:0 6px 18px rgba(0,0,0,.3)}
.quote .q{font-family:var(--fs);font-size:16px;line-height:1.45;color:var(--ink)}
.quote .m{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:9px}
.quote .s{font-family:var(--fl);letter-spacing:.08em;text-transform:uppercase;font-size:10px;color:var(--ink2)}
.qtag{font-family:var(--fl);letter-spacing:.06em;text-transform:uppercase;font-size:10px;padding:2px 8px;border-radius:4px;background:rgba(108,67,34,.14);color:#6B4322}
.t-funny{border-left-color:#C7A369}.t-serious{border-left-color:#8C5D3F}.t-poignant{border-left-color:#9C7FA0}
.t-defining{border-left-color:#B7634D}.t-banter{border-left-color:#5E9C92}.t-dm{border-left-color:#6B8AAD}

.pending{text-align:center;padding:40px 24px}
.pending .mk{font-family:var(--fd);font-size:30px;color:var(--copper);letter-spacing:.1em}
.pending h2{border:none;background:none;justify-content:center;color:#6B4322;margin:14px 0 8px}
.pending p{font-family:var(--fs);font-size:16px;color:var(--ink2);max-width:460px;margin:0 auto}
.pending .stub{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;max-width:520px;margin:22px auto 0}
.pending .stub .s{background:rgba(108,67,34,.08);border:1px dashed rgba(108,67,34,.3);border-radius:7px;padding:14px 4px}
.pending .stub .s .lab{font-family:var(--fl);letter-spacing:.06em;font-size:11px;color:var(--ink2)}
.pending .stub .s .dash{font-family:var(--fc);font-size:22px;color:rgba(108,67,34,.4);margin-top:4px}

.err{margin-top:40px;padding:24px;border:1px solid var(--border-strong);border-radius:12px;background:var(--card);text-align:center;font-family:var(--fs);font-size:18px}
footer{margin-top:54px;padding-top:22px;border-top:1px solid var(--border);text-align:center;
  font-family:var(--fl);letter-spacing:.14em;text-transform:uppercase;font-size:11px;color:var(--text2)}
footer .dot{color:var(--accent);margin:0 8px}
@media(max-width:820px){.hero{grid-template-columns:1fr}.portrait{max-width:280px;margin:0 auto}.ident{text-align:center}
  .badges{justify-content:center}.epigraph::before,.epigraph::after{display:none}}
</style>
</head>
<body>
<div class="frame">
  <div class="crumb"><a href="/sky-is-the-limit/">Character Archive</a><span class="sep">&#10022;</span><span id="crumbname">&hellip;</span></div>
  <div id="content"></div>
</div>

<script>
var SB='https://vtrtyagltwdrbastpppl.supabase.co';
var AK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ0cnR5YWdsdHdkcmJhc3RwcHBsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYzNTY5NTAsImV4cCI6MjA5MTkzMjk1MH0.hnpwjHGIqiUN_VmmIkOAAFGGCKsyYgl7AO3FW5vDIeM';
var VR='https://raw.githubusercontent.com/TheLittlestAskew/sitl_vault/main/03-Characters/PCs';

var PCS={
  'kit-aluri':            {file:'Kit Aluri.md',              name:'Kit Aluri',              img:'Kit-card.webp',    accent:'#B98A56'},
  'binks-stonevein':      {file:'Binks Stonevein.md',        name:'Binks Stonevein',        img:'Binks-card.webp',  accent:'#7FA6A0'},
  'aeolus':               {file:'Aeolus.md',                 name:'Aeolus',                 img:'Aeolus-card.webp', accent:'#8B6BB5'},
  'blarg':                {file:'Blarg.md',                  name:'Blarg',                  img:'Blarg-card.webp',  accent:'#6E8E5A'},
  'amanita-dechampignon': {file:"Amanita de'Champignon.md",  name:"Amanita de'Champignon",  img:'Amanita-card.webp',accent:'#B56BA0'},
  'darby-stonefeather':   {file:'Darby Stonefeather.md',     name:'Darby Stonefeather',     img:'Darby-card.webp',  accent:'#AF755A'}
};

var SHOW_INNER_LIFE=false, SHOW_POV_JOURNAL=false;

function wrapTables(h){return h.replace(/<table>/g,'<div class="tbl-wrap"><table>').replace(/<\/table>/g,'</table></div>');}
function zbase(x){x=String(x).split('/').pop();return x.replace(/#.*/,'').trim();}
function zwl(s){return (s||'').replace(/!\[\[[^\]]*\]\]/g,'').replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g,function(m,a,b){return b||zbase(a);});}
function zmd(t){if(!t)return'';return wrapTables(marked.parse(zwl(t)));}
function zesc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function zsw(s){return (s||'').replace(/\[\[([^\]|]+)\|([^\]]+)\]\]/g,'$2').replace(/\[\[([^\]]+)\]\]/g,function(m,a){return zbase(a);});}
var STOP2=/^## /m;
function findHeading(body,re){var hs=body.match(/^##[^#\n].*$/mg)||[];for(var i=0;i<hs.length;i++){if(re.test(hs[i].replace(/^##\s*/,'').trim()))return hs[i];}return null;}
function section(body,re){var h=findHeading(body,re);if(!h)return'';var i=body.indexOf(h);var rest=body.slice(i+h.length);var n=rest.search(STOP2);return (n===-1?rest:rest.slice(0,n)).trim();}
function makeFm(raw){var fmText=(/^---\n([\s\S]*?)\n---/.exec(raw)||[null,''])[1];
  return function(k){var m=new RegExp('^'+k+':\\s*(.*)$','mi').exec(fmText);return m?m[1].trim().replace(/^"|"$/g,''):'';};}

async function rollStats(name){
  try{
    var url=SB+'/rest/v1/sitl_session_rolls?character=eq.'+encodeURIComponent(name)+'&select=dice_notation,individual_values&limit=6000';
    var r=await fetch(url,{headers:{apikey:AK,Authorization:'Bearer '+AK}});
    if(!r.ok)return null;var rows=await r.json();
    function iv(v){if(v==null)return null;if(typeof v==='string'){try{v=JSON.parse(v);}catch(e){return null;}}return Array.isArray(v)?v:null;}
    var total=rows.length,n20=0,n1=0;
    rows.forEach(function(x){if(/d20/.test(x.dice_notation||'')){var a=iv(x.individual_values);if(a){if(a.indexOf(20)>=0)n20++;if(a.indexOf(1)>=0)n1++;}}});
    return {total:total,n20:n20,n1:n1};
  }catch(e){return null;}
}

function pickEpigraph(body){
  var q=section(body,/key quotes/i);if(!q)return null;
  var lines=q.split('\n').filter(function(l){return /^\s*[-*]\s/.test(l);});
  if(!lines.length)return null;
  function parse(l){l=l.replace(/^\s*[-*]\s*/,'');
    var tag=(/\[([^\]]+)\]\s*$/.exec(l)||[])[1]||'';
    l=l.replace(/\[[^\]]+\]\s*$/,'').trim();
    var sm=/[\u2014-]\s*(S\d+[^"\u201d]*)$/.exec(l);var src=sm?sm[1].trim():'';
    var qt=/^["\u201c]([\s\S]+?)["\u201d]/.exec(l);var text=qt?qt[1]:l.replace(/\s*[\u2014-].*$/,'').replace(/^["\u201c]|["\u201d]$/g,'');
    return {text:text,src:src,tag:tag};}
  var arr=lines.map(parse);
  function byTag(rx){for(var i=0;i<arr.length;i++)if(rx.test(arr[i].tag))return arr[i];return null;}
  return byTag(/poignant/i)||byTag(/defining/i)||arr[0];
}

function tagClass(t){t=(t||'').toLowerCase();
  if(/defining/.test(t))return't-defining';if(/poignant/.test(t))return't-poignant';
  if(/funny/.test(t))return't-funny';if(/banter/.test(t))return't-banter';
  if(/dm/.test(t))return't-dm';return't-serious';}

function quoteBoard(body){
  var q=section(body,/key quotes/i);if(!q)return'<p>No quotes recorded.</p>';
  var lines=q.split('\n').filter(function(l){return /^\s*[-*]\s/.test(l);});
  if(!lines.length)return zmd(q);
  return '<div class="qgrid">'+lines.map(function(l){
    l=l.replace(/^\s*[-*]\s*/,'');
    var tag=(/\[([^\]]+)\]\s*$/.exec(l)||[])[1]||'';
    l=l.replace(/\[[^\]]+\]\s*$/,'').trim();
    var sm=/[\u2014-]\s*(S\d+[^"\u201d]*)$/.exec(l);var src=sm?sm[1].trim():'';
    var qt=/^["\u201c]([\s\S]+?)["\u201d]/.exec(l);var text=qt?qt[1]:l.replace(/\s*[\u2014-].*$/,'');
    return '<div class="quote '+tagClass(tag)+'"><div class="q">&ldquo;'+zesc(zsw(text))+'&rdquo;</div>'+
      '<div class="m"><span class="s">'+zesc(zsw(src))+'</span>'+(tag?'<span class="qtag">'+zesc(tag)+'</span>':'')+'</div></div>';
  }).join('')+'</div>';
}

function panel(title,inner,span){return '<div class="pcard'+(span?' span':'')+'"><h2><span class="star">&#10022;</span>'+zesc(title)+'</h2><div class="pbody">'+inner+'</div></div>';}
function vaultPanel(body,re,title){var c=section(body,re);if(!c)return'';return panel(title,zmd(c),false);}

async function init(){
  var content=document.getElementById('content');
  var slug=(new URLSearchParams(location.search).get('pc')||'').toLowerCase().trim();
  var pc=PCS[slug];
  if(!pc){content.innerHTML='<div class="err">Unknown character. <a href="/sky-is-the-limit/">Back to The Party</a></div>';return;}
  document.documentElement.style.setProperty('--accent',pc.accent);
  document.getElementById('crumbname').textContent=pc.name;
  document.title=pc.name+' — Sky Is The Limit · Rectrix Caedere';

  var raw;
  try{var resp=await fetch(VR+'/'+encodeURIComponent(pc.file)+'?t='+Date.now());if(!resp.ok)throw 0;raw=await resp.text();}
  catch(e){content.innerHTML='<div class="err">Failed to load character notes. <a href="/sky-is-the-limit/">Back to The Party</a></div>';return;}

  var fm=makeFm(raw);
  var body=raw.replace(/^---\s*\n[\s\S]*?\n---\s*\n/,'');
  var lvl=((/\*\*Level:\*\*\s*(.+)/i.exec(body)||[])[1]||'').replace(/\*+/g,'').trim();
  var bg =((/\*\*Background:\*\*\s*(.+)/i.exec(body)||[])[1]||'').replace(/\*+/g,'').trim();
  var raceF=fm('race'),classF=fm('class'),statusF=fm('status'),playerF=fm('player'),locF=fm('location'),firstF=zsw(fm('first_appearance'));

  var subtitle=[raceF,classF.replace(/\s*multiclass/i,''),bg].filter(Boolean).join(' \u2022 ');
  var lvlNum=(/level\s*(\d+)/i.exec(lvl)||[])[1];

  var badges='';
  if(/party/i.test(fm('affiliation')))badges+='<span class="badge b-active">Active Party</span>';
  if(/pc/i.test(fm('type')))badges+='<span class="badge b-pc">Player Character</span>';
  if(lvlNum)badges+='<span class="badge b-lvl">Level '+lvlNum+'</span>';
  if(statusF)badges+='<span class="badge b-status">'+zesc(statusF)+'</span>';

  var ep=pickEpigraph(body),epHtml='';
  if(ep&&ep.text)epHtml='<div class="epigraph"><p>&ldquo;'+zesc(zsw(ep.text))+'&rdquo;'+
    (ep.src?'<span class="src">'+zesc(zsw(ep.src))+'</span>':'')+'</p></div>';

  function r(l,v){v=(v||'').trim();return v?'<dt>'+l+'</dt><dd>'+zesc(zsw(v))+'</dd>':'';}
  var quick='<dl class="prof">'+r('Race',raceF)+r('Class',classF)+r('Background',bg)+
    (lvl?'<dt>Level</dt><dd>'+zesc(lvl)+'</dd>':'')+r('Status',statusF)+r('Player',playerF)+
    r('Location',locF)+(firstF?'<dt>First seen</dt><dd>'+zesc(firstF)+'</dd>':'')+'</dl>';

  content.innerHTML=
    '<div class="hero">'+
      '<div class="portrait"><div class="fr"><img src="/assets/img/'+pc.img+'" alt="'+zesc(pc.name)+'"></div>'+
        '<div class="plate">'+zesc(pc.name)+'</div></div>'+
      '<div class="ident"><div class="eyebrow">Sky Is The Limit &#10022; The Party</div>'+
        '<h1>'+zesc(pc.name)+'</h1>'+
        (subtitle?'<div class="subtitle">'+zesc(zsw(subtitle))+'</div>':'')+
        '<div class="badges">'+badges+'</div>'+epHtml+'</div>'+
      '<div class="aside">'+
        '<div class="panel"><h3><span class="star">&#10022;</span> Quick Profile</h3>'+quick+'</div>'+
        '<div class="panel"><h3><span class="star">&#10022;</span> Roll Record</h3><div class="rollrec" id="rollrec">'+
          '<div class="tile"><div class="v">&hellip;</div><div class="l">rolls</div></div>'+
          '<div class="tile up"><div class="v">&hellip;</div><div class="l">nat 20</div></div>'+
          '<div class="tile dn"><div class="v">&hellip;</div><div class="l">nat 1</div></div></div></div>'+
      '</div>'+
    '</div>'+
    '<div class="tabbar" id="tabbar"></div><div id="tabpanels"></div>'+
    '<footer>Rectrix Caedere <span class="dot">&#10022;</span> Sky Is The Limit <span class="dot">&#10022;</span> <a href="/sky-is-the-limit/archive.html">The Descent</a></footer>';

  var overview=
    vaultPanel(body,/description|appearance/i,'Appearance')+
    vaultPanel(body,/backstory/i,'Backstory')+
    vaultPanel(body,/personality/i,'Personality')+
    vaultPanel(body,/conditions/i,'Conditions')+
    vaultPanel(body,/abilities|class features/i,'Features & Traits');

  var sheet='<div class="pcard span"><div class="pending">'+
    '<div class="mk">&#9876;</div><h2>Character Sheet</h2>'+
    '<p>Live mechanical stats &mdash; ability scores, AC, hit points, saves, skills, and attacks &mdash; sync from D&amp;D Beyond once the sheet is public. Nothing here is placeholder; it stays empty until real data is wired.</p>'+
    '<div class="stub">'+['STR','DEX','CON','INT','WIS','CHA'].map(function(a){return '<div class="s"><div class="lab">'+a+'</div><div class="dash">&mdash;</div></div>';}).join('')+'</div>'+
    '</div></div>';

  var story=vaultPanel(body,/key events/i,'Key Events')||'<div class="pcard span"><div class="pbody">No events recorded.</div></div>';
  var rel=vaultPanel(body,/relationships/i,'Relationships')||'<div class="pcard span"><div class="pbody">No relationships recorded.</div></div>';
  var inv=vaultPanel(body,/inventory|loot/i,'Inventory & Loot')||'<div class="pcard span"><div class="pbody">No inventory recorded.</div></div>';
  var quotes='<div class="pcard span"><h2><span class="star">&#10022;</span> Quote Board</h2><div class="pbody">'+quoteBoard(body)+'</div></div>';

  var TABS=[
    {id:'overview',label:'Overview',html:'<div class="pgrid">'+overview+'</div>'},
    {id:'sheet',label:'Character Sheet',html:'<div class="pgrid">'+sheet+'</div>'},
    {id:'story',label:'Story',html:'<div class="pgrid">'+story+'</div>'},
    {id:'rel',label:'Relationships',html:'<div class="pgrid">'+rel+'</div>'},
    {id:'inv',label:'Inventory',html:'<div class="pgrid">'+inv+'</div>'},
    {id:'quotes',label:'Quotes',html:'<div class="pgrid">'+quotes+'</div>'}
  ];
  document.getElementById('tabbar').innerHTML=TABS.map(function(t,i){return '<button class="tab'+(i===0?' active':'')+'" data-t="'+t.id+'">'+t.label+'</button>';}).join('');
  document.getElementById('tabpanels').innerHTML=TABS.map(function(t,i){return '<div class="tabpanel'+(i===0?' active':'')+'" id="tp-'+t.id+'">'+t.html+'</div>';}).join('');
  document.querySelectorAll('.tab').forEach(function(b){b.addEventListener('click',function(){
    document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('active');});
    document.querySelectorAll('.tabpanel').forEach(function(x){x.classList.remove('active');});
    b.classList.add('active');document.getElementById('tp-'+b.dataset.t).classList.add('active');});});

  var st=await rollStats(pc.name);
  if(st){document.getElementById('rollrec').innerHTML=
    '<div class="tile"><div class="v">'+st.total+'</div><div class="l">rolls</div></div>'+
    '<div class="tile up"><div class="v">'+st.n20+'</div><div class="l">nat 20</div></div>'+
    '<div class="tile dn"><div class="v">'+st.n1+'</div><div class="l">nat 1</div></div>';}
}

if(typeof marked!=='undefined'){init();}else{window.addEventListener('load',init);}
</script>
</body>
</html>
