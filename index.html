
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rectrix Caedere</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prop-types/15.8.1/prop-types.min.js"></script>
<script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=Cinzel+Decorative:wght@400&family=Raleway:wght@300;400;500&family=Alegreya+Sans+SC:wght@400;500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg-void);color:var(--text-1);font-family:var(--f-body);font-size:var(--text-lg);line-height:1.5;min-height:100vh;-webkit-font-smoothing:antialiased}
.shell{display:flex;min-height:100vh}

/* ── Sidebar ── */
.side{width:var(--sidebar-width);min-height:100vh;background:linear-gradient(180deg,var(--bg-sidebar-top),var(--bg-sidebar-bottom));position:fixed;left:0;top:0;bottom:0;z-index:100;display:flex;flex-direction:column;overflow-y:auto}
.side-brand{padding:28px 16px 20px;text-align:center;position:relative}
.side-brand::after{content:'';position:absolute;bottom:0;left:16px;right:16px;height:1px;background:linear-gradient(90deg,transparent,var(--gold-mid),transparent)}
.side-logo-img{display:block;width:100%;max-width:190px;height:auto;margin:0 auto;filter:drop-shadow(0 0 14px var(--gold-alpha-30))}
.side-section{font-family:var(--f-label);font-size:var(--text-2xs);letter-spacing:3px;text-transform:uppercase;color:var(--gold-mid);padding:18px 16px 8px;display:flex;align-items:center;gap:6px}
.side-section::before,.side-section::after{content:'\2726';font-size:5px;opacity:.4}
.camp-list{list-style:none}
.camp-list button{display:flex;align-items:center;width:100%;padding:9px 16px;background:none;border:none;color:var(--text-2);font-family:var(--f-body);font-size:var(--text-md);cursor:pointer;transition:all var(--dur-hover) var(--ease);text-align:left;position:relative}
.camp-list button:hover{color:var(--text-1);background:var(--gold-alpha-5)}
.camp-list button.on{color:var(--gold-bright);background:linear-gradient(90deg,var(--gold-alpha-10),transparent);font-weight:500}
.camp-list button.on::before{content:'';position:absolute;left:0;top:4px;bottom:4px;width:2px;background:linear-gradient(180deg,var(--gold-bright),var(--gold-mid));border-radius:0 2px 2px 0}
.camp-list .ct{margin-left:auto;font-size:var(--text-xs);font-family:var(--f-label);color:var(--text-3)}
.camp-list button.off{opacity:.45;cursor:default;font-style:italic;color:var(--text-3);letter-spacing:.5px}
.side-div{height:1px;margin:8px 16px;background:linear-gradient(90deg,transparent,var(--border),transparent)}
.side-nav{list-style:none;margin-top:auto;padding:0 0 20px}
.side-nav button{display:flex;align-items:center;gap:8px;width:100%;padding:8px 16px;background:none;border:none;color:var(--text-3);font-family:var(--f-label);font-size:var(--text-xs);letter-spacing:1.5px;cursor:pointer;transition:all var(--dur-hover) var(--ease);text-transform:uppercase}
.side-nav button:hover{color:var(--text-2)}.side-nav button.on{color:var(--gold-bright)}
.side-nav .ni{width:13px;height:13px;opacity:.45}.side-nav button.on .ni{opacity:.9}

/* ── Main 4-row grid ── */
.main{flex:1;margin-left:var(--sidebar-width);display:grid;grid-template-rows:74px 260px 302px 229px;gap:12px;padding:9px 12px 24px;align-content:start}

/* ── Row 1: Header ── */
.row-hdr{position:relative;background:linear-gradient(180deg,var(--gold-alpha-4),transparent);border:1px solid var(--border);border-radius:var(--r);display:flex;align-items:center;justify-content:space-between;padding:0 24px;overflow:hidden}
.row-hdr::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent 5%,var(--gold-mid) 30%,var(--gold) 50%,var(--gold-mid) 70%,transparent 95%);opacity:.35;pointer-events:none}
.hdr-title{font-family:var(--f-deco);font-size:var(--text-xl);color:var(--gold-pale);letter-spacing:6px;text-transform:uppercase}
.hdr-sub{font-family:var(--f-serif);font-style:italic;font-size:var(--text-base);color:var(--text-3);margin-top:2px}
.top-center-img{position:absolute;left:50%;transform:translateX(-50%);width:38%;max-width:480px;min-width:220px;height:auto;pointer-events:none;user-select:none}
.hdr-right{display:flex;align-items:center;gap:10px;position:relative;z-index:1}
.hdr-filter{font-family:var(--f-label);font-size:var(--text-xs);letter-spacing:1.5px;color:var(--text-3);border:1px solid var(--border);border-radius:12px;padding:4px 12px;text-transform:uppercase;white-space:nowrap}
.top-icon{width:32px;height:32px;border:1px solid var(--border);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--gold-mid);transition:all var(--dur-enter) var(--ease);cursor:pointer}
.top-icon:hover{border-color:var(--border-strong);color:var(--gold-bright)}

/* ── Row sub-grids ── */
.row-kpi{display:grid;grid-template-columns:repeat(4,190px) 1fr;gap:14px}
.row-mid{display:grid;grid-template-columns:371px 325px 306px 1fr;gap:12px}
.row-bot{display:grid;grid-template-columns:423px 338px 1fr;gap:12px}

/* ── Panel base ── */
.panel{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r-lg);position:relative;overflow:hidden}
.panel:hover{border-color:var(--border-strong);box-shadow:var(--shadow-glow)}
.panel::before{content:'';position:absolute;inset:3px;border:1px solid var(--gold-alpha-6);border-radius:8px;pointer-events:none;z-index:0}
.panel::after{content:'';position:absolute;top:0;left:15%;right:15%;height:1px;background:linear-gradient(90deg,transparent,var(--panel-accent,var(--gold-bright)),transparent);opacity:.3;pointer-events:none}

/* ── Corner flourishes ── */
.cf{position:absolute;width:32px;height:32px;color:var(--gold-mid);opacity:.25;pointer-events:none;z-index:1}
.cf.c-tl{top:4px;left:4px}.cf.c-tr{top:4px;right:4px;transform:scaleX(-1)}.cf.c-bl{bottom:4px;left:4px;transform:scaleY(-1)}.cf.c-br{bottom:4px;right:4px;transform:scale(-1)}

/* ── KPI cards ── */
.kpi{padding:16px 20px 64px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;text-align:center;transition:all var(--dur-enter) var(--ease)}
.kpi:hover{transform:translateY(-2px);box-shadow:var(--shadow-hover)}
.kpi .kl{font-family:var(--f-label);font-size:var(--text-2xs);letter-spacing:2px;text-transform:uppercase;color:var(--text-3);margin-bottom:6px}
.kpi .kv{font-family:var(--f-display);font-size:var(--text-3xl);font-weight:500;color:var(--text-1);line-height:1;letter-spacing:1px}
.kpi .ks{font-family:var(--f-body);font-size:var(--text-xs);color:var(--text-2);margin-top:6px;font-weight:300}
.kpi.n20{--panel-accent:var(--success)}.kpi.n20 .kv{color:var(--success)}
.kpi.n1{--panel-accent:var(--danger)}.kpi.n1 .kv{color:var(--danger)}

/* ── Chart / content panels ── */
.cp{padding:14px 16px 10px}
.ph{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.ph h3{font-family:var(--f-display);font-size:var(--text-base);font-weight:500;color:var(--text-1);letter-spacing:2px;text-transform:uppercase}
.ph .star{color:var(--gold-mid);font-size:9px;opacity:.6;flex-shrink:0}
.ph .psub{font-family:var(--f-serif);font-style:italic;font-size:var(--text-xs);color:var(--text-3);margin-left:auto;white-space:nowrap}

/* ── Tooltip ── */
.ctt{background:var(--bg-card-inner)!important;border:1px solid var(--border-strong)!important;border-radius:var(--r)!important;padding:10px 14px!important;box-shadow:var(--shadow-card)}
.ctt .tl2{font-family:var(--f-label);font-size:var(--text-2xs);color:var(--gold-bright);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:3px}
.ctt .tv{font-family:var(--f-display);font-size:var(--text-lg);color:var(--text-1);font-weight:500}

/* ── Character table ── */
.char-tbl{width:100%;border-collapse:collapse}
.char-tbl th{font-family:var(--f-label);font-size:var(--text-2xs);letter-spacing:1.5px;text-transform:uppercase;color:var(--text-3);padding:5px 8px;border-bottom:1px solid var(--border);text-align:left}
.char-tbl td{font-family:var(--f-body);font-size:var(--text-sm);color:var(--text-2);padding:6px 8px;border-bottom:1px solid var(--gold-alpha-5)}
.char-tbl td:first-child{color:var(--text-1)}.char-tbl .up{color:var(--success)}.char-tbl .dn{color:var(--danger)}

/* ── Activity feed ── */
.feed{list-style:none;display:flex;flex-direction:column;gap:5px;overflow-y:auto;max-height:218px;scrollbar-width:none}
.feed::-webkit-scrollbar{display:none}
.feed li{padding:6px 10px;background:var(--gold-alpha-3);border-radius:var(--r);border-left:2px solid var(--border)}
.feed .ft{font-family:var(--f-body);font-size:var(--text-sm);color:var(--text-1);line-height:1.35}
.feed .fm{font-family:var(--f-label);font-size:var(--text-2xs);letter-spacing:1px;color:var(--text-3);margin-top:2px}

/* ── Campaign snapshot ── */
.snap-sigil{display:flex;justify-content:center;margin:0 0 8px}
.snap-status{list-style:none;display:flex;flex-direction:column;gap:4px}
.snap-status li{display:flex;align-items:baseline;gap:8px;padding:4px 0;border-bottom:1px solid var(--gold-alpha-5)}
.snap-status .sk{font-family:var(--f-label);font-size:var(--text-2xs);letter-spacing:1.5px;text-transform:uppercase;color:var(--text-3);min-width:88px;flex-shrink:0}
.snap-status .sv{color:var(--text-2);font-family:var(--f-body);font-size:var(--text-sm)}

/* ── Session list ── */
.sess-list{list-style:none;display:flex;flex-direction:column;gap:6px}
.sess-list li{display:grid;grid-template-columns:44px 1fr auto;gap:8px;align-items:center;padding:7px 10px;border-radius:var(--r);background:var(--gold-alpha-3);border-left:2px solid var(--border)}
.sess-list .sd{font-family:var(--f-label);font-size:var(--text-2xs);color:var(--text-3);letter-spacing:1px}
.sess-list .sn{font-family:var(--f-body);font-size:var(--text-sm);color:var(--text-1)}
.sess-list .sl{font-size:var(--text-xs);color:var(--text-3);margin-top:2px}
.sess-list .sr{font-family:var(--f-label);font-size:var(--text-2xs);letter-spacing:1px;padding:2px 7px;border-radius:8px;border:1px solid;white-space:nowrap}
.sr.win{color:var(--success);border-color:var(--success)}.sr.part{color:var(--warn);border-color:var(--warn)}.sr.fail{color:var(--danger);border-color:var(--danger)}

/* ── Quote board ── */
.quote-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;height:calc(100% - 28px);padding:4px 12px}
.quote-body{font-family:var(--f-serif);font-style:italic;font-size:var(--text-xl);color:var(--text-1);line-height:1.5;text-align:center}
.quote-attr{font-family:var(--f-label);font-size:var(--text-xs);letter-spacing:2px;text-transform:uppercase;color:var(--gold-mid);text-align:center;margin-top:10px}

/* ── Resource cards ── */
.res-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.res-card{background:var(--bg-card-inner);border:1px solid var(--border);border-radius:var(--r-lg);padding:12px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;transition:all var(--dur-hover) var(--ease);cursor:pointer}
.res-card:hover{border-color:var(--border-strong);background:var(--gold-alpha-5)}
.res-card .rn{font-family:var(--f-label);font-size:var(--text-xs);letter-spacing:1.5px;text-transform:uppercase;color:var(--text-1)}
.res-card .rs{font-family:var(--f-body);font-size:var(--text-2xs);color:var(--text-3)}
.res-card .ri{color:var(--gold-mid);opacity:.7}

/* ── Recharts overrides ── */
.recharts-cartesian-axis-tick-value{fill:var(--text-3)!important;font-family:var(--f-label)!important;font-size:var(--text-2xs)!important}
.recharts-cartesian-grid line{stroke:var(--gold-alpha-5)!important}
.recharts-legend-item-text{color:var(--text-2)!important;font-family:var(--f-label)!important;font-size:var(--text-xs)!important}

/* ── Animations ── */
@keyframes fu{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.ai{animation:fu var(--dur-appear) var(--ease) both}
.d1{animation-delay:.05s}.d2{animation-delay:.1s}.d3{animation-delay:.15s}.d4{animation-delay:.2s}.d5{animation-delay:.25s}.d6{animation-delay:.35s}.d7{animation-delay:.45s}.d8{animation-delay:.55s}

/* ── Fixed overlays ── */
#nav-frame{position:fixed;left:0;top:0;width:var(--sidebar-width);height:100vh;object-fit:fill;pointer-events:none;user-select:none;z-index:102}

/* ── Responsive ── */
@media(max-width:1400px){
  .main{grid-template-rows:74px auto auto auto}
  .row-kpi{grid-template-columns:repeat(2,1fr)}
  .row-kpi .kpi-chart{grid-column:1/-1;min-height:220px}
  .row-mid{grid-template-columns:1fr 1fr}
  .row-bot{grid-template-columns:1fr 1fr}
}
@media(max-width:860px){
  .side{display:none}
  .main{margin-left:0;padding:12px;grid-template-rows:auto auto auto auto}
  .row-kpi,.row-mid,.row-bot{grid-template-columns:1fr}
  .row-kpi .kpi-chart{grid-column:1}
}
</style>
</head>
<body><div id="root"></div>
<img id="nav-frame" src="https://raw.githubusercontent.com/TheLittlestAskew/rectrixcaedere/main/.design/rc/imgs/navbarborder.png" alt="" aria-hidden="true">
<svg id="grain" aria-hidden="true" focusable="false" style="position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;opacity:.035;z-index:9999;mix-blend-mode:overlay"><filter id="gf"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="4" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(#gf)"/></svg>
<script src="app.js"></script>
</body>
</html>
