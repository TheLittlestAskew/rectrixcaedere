<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Map of Artemesia — Where the Flowers Forget · Rectrix Caedere</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@400;500&family=Lora:ital@0;1&family=Raleway:wght@400;500;600&family=Alegreya+Sans+SC:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#050A0E;--card:#0D141C;--smoked:#162230;
  --gold:#C7A369;--gold-bright:#DA9565;--gold-pale:#E8C690;
  --amber:#AF755A;--copper:#8C5D3F;--coral:#B7634D;
  --violet:#9B7FD4;--violet-deep:#6B4FA0;
  --text:#E8E4DC;--text2:#9A9590;--muted:#5E5A55;--vellum:#F5EFE2;
  --border:rgba(199,163,105,.25);--border-strong:rgba(199,163,105,.45);--glow:rgba(199,163,105,.30);
  --fd:'Cinzel Decorative','Cinzel',serif;--fdisp:'Cinzel',serif;
  --fb:'Raleway',system-ui,sans-serif;--fl:'Alegreya Sans SC','Raleway',sans-serif;--fs:'Lora',serif;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--fb);color:var(--text);background:var(--navy);min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;z-index:-1;background:radial-gradient(120% 80% at 50% 0%,#0e1620,#070d14 60%,#050509)}
.back{position:fixed;top:20px;left:22px;z-index:30;font-family:var(--fl);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold-pale);text-decoration:none;border:1px solid var(--border);border-radius:3px;padding:9px 16px;background:rgba(13,20,28,.6);backdrop-filter:blur(4px);transition:border-color .35s,color .35s,box-shadow .4s}
.back:hover{border-color:var(--gold);box-shadow:0 0 22px -8px var(--glow)}
.subnav{position:fixed;top:20px;right:22px;z-index:30}
.subnav a{font-family:var(--fl);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-pale);text-decoration:none;border:1px solid var(--border);border-radius:3px;padding:9px 14px;background:rgba(13,20,28,.6);backdrop-filter:blur(4px)}

.defs{position:absolute;width:0;height:0;overflow:hidden}

header{max-width:1040px;margin:0 auto;padding:44px 22px 4px;text-align:center}
.eyebrow{font-family:var(--fl);font-size:12px;letter-spacing:.32em;text-transform:uppercase;color:var(--gold);margin-bottom:12px}
.eyebrow::before,.eyebrow::after{content:'';display:inline-block;width:28px;height:1px;vertical-align:middle;margin:0 11px;background:linear-gradient(90deg,transparent,var(--copper))}
h1{font-family:var(--fd);font-weight:700;color:var(--vellum);font-size:clamp(26px,4.6vw,44px);line-height:1.05;margin:0}
.sub{font-family:var(--fs);font-style:italic;font-size:15px;color:var(--gold-pale);margin:14px auto 0;max-width:540px;line-height:1.55}

.stage{position:relative;max-width:1340px;margin:18px auto 8px;padding:0 16px}
.mapwrap{position:relative;width:100%;aspect-ratio:980/735;border-radius:14px;overflow:hidden;border:1px solid var(--border-strong);background:#0a1019;box-shadow:0 0 70px -26px var(--glow)}
.mapimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.markers{position:absolute;inset:0;z-index:6;opacity:0;transition:opacity .9s ease}
.markers .pt{position:absolute;transform:translate(-50%,-50%)}

.ping{position:relative;width:0;height:0}
.ping .dot{position:absolute;left:0;top:0;width:9px;height:9px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,#fff,var(--gold-bright) 60%,var(--copper));box-shadow:0 0 10px 2px var(--glow);z-index:3}
.ping .ring{position:absolute;left:0;top:0;width:14px;height:14px;border-radius:50%;border:1.5px solid var(--gold-bright);transform:translate(-50%,-50%);opacity:0;animation:ping 2.4s ease-out infinite;z-index:2}
.ping .ring.r2{animation-delay:1.2s}
@keyframes ping{0%{opacity:.75;width:14px;height:14px}100%{opacity:0;width:74px;height:74px}}
.ping .shadow{position:absolute;left:0;top:0;width:18px;height:6px;border-radius:50%;background:rgba(0,0,0,.5);transform:translateX(-50%);filter:blur(1px);animation:pinshadow 2.8s ease-in-out infinite;z-index:1}
.ping .pinwrap{position:absolute;left:0;bottom:7px;transform:translateX(-50%);animation:pinfloat 2.8s ease-in-out infinite;z-index:4}
.ping .pinwrap svg{display:block;width:36px;height:48px;filter:drop-shadow(0 7px 6px rgba(0,0,0,.55))}
@keyframes pinfloat{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-9px)}}
@keyframes pinshadow{0%,100%{transform:translateX(-50%) scaleX(1);opacity:.5}50%{transform:translateX(-50%) scaleX(.7);opacity:.3}}
.ping .label{position:absolute;left:24px;top:0;transform:translateY(-50%);white-space:nowrap;font-family:var(--fl);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-pale);background:rgba(7,13,20,.82);border:1px solid var(--border);border-radius:4px;padding:5px 10px;z-index:5}
.ping .label b{display:block;font-size:9px;letter-spacing:.2em;color:var(--copper)}

.bud{position:relative;width:30px;height:30px;cursor:pointer;background:none;border:none;padding:0;display:grid;place-items:center}
.bud svg{width:26px;height:26px;filter:drop-shadow(0 0 6px rgba(199,163,105,.5));transition:transform .35s ease}
.bud:hover svg,.bud[aria-expanded="true"] svg{transform:scale(1.2)}
.bud .pulse{position:absolute;left:50%;top:50%;width:30px;height:30px;border-radius:50%;transform:translate(-50%,-50%);border:1px solid var(--gold);opacity:0;animation:budpulse 3s ease-out infinite}
@keyframes budpulse{0%{opacity:.5;width:18px;height:18px}100%{opacity:0;width:56px;height:56px}}

.pop{position:absolute;z-index:12;min-width:236px;max-width:288px;left:50%;transform:translate(-50%,12px);background:linear-gradient(180deg,rgba(22,34,48,.98),rgba(13,20,28,.99));border:1px solid var(--border-strong);border-radius:11px;padding:14px 15px 13px;box-shadow:0 18px 50px -18px rgba(0,0,0,.85);opacity:0;visibility:hidden;transition:opacity .25s ease,transform .25s ease}
.pop.open{opacity:1;visibility:visible;transform:translate(-50%,16px)}
.pop::before{content:'';position:absolute;top:-7px;left:50%;transform:translateX(-50%) rotate(45deg);width:12px;height:12px;background:rgba(22,34,48,.98);border-left:1px solid var(--border-strong);border-top:1px solid var(--border-strong)}
.pop .loc{font-family:var(--fl);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--copper);margin-bottom:2px}
.pop .pn{font-family:var(--fdisp);font-size:16px;color:var(--vellum);margin-bottom:9px}
.pop a.sess{display:block;text-decoration:none;border:1px solid var(--border);border-radius:7px;padding:9px 11px;margin-top:7px;background:rgba(13,20,28,.6);transition:border-color .25s,background .25s}
.pop a.sess:hover{border-color:var(--gold);background:rgba(199,163,105,.08)}
.pop a.sess .st{font-family:var(--fs);font-size:13.5px;color:var(--text);line-height:1.25}
.pop a.sess .sd{font-family:var(--fl);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--text2);margin-top:3px}
.pop a.sess .go{float:right;color:var(--gold-pale);font-size:12px}

/* ── intro: the tarot card turns on its side, widens to the map, then becomes the map ── */
.reveal{position:absolute;inset:0;z-index:14;display:grid;place-items:center;overflow:hidden;border-radius:14px;
  background:radial-gradient(120% 95% at 50% 30%,#111a25,#070d14 72%)}
.reveal.gone{opacity:0;pointer-events:none;transition:opacity .6s ease}
.reveal-card{height:82%;width:auto;aspect-ratio:440/703;object-fit:cover;border-radius:12px;
  box-shadow:0 22px 70px rgba(0,0,0,.7);outline:1px solid var(--border-strong);outline-offset:-1px;
  transform-origin:center center;will-change:transform;backface-visibility:hidden}

.legend{max-width:1340px;margin:8px auto 0;padding:0 18px;display:flex;flex-wrap:wrap;gap:14px;justify-content:center;font-family:var(--fl);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--text2)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend .dot{width:9px;height:9px;border-radius:50%}
footer{text-align:center;padding:26px 20px 56px;font-family:var(--fl);font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
footer a{color:var(--gold-pale);text-decoration:none;border-bottom:1px solid var(--border)}
footer .d{color:var(--copper);margin:0 8px}
@media(prefers-reduced-motion:reduce){.reveal{display:none}.markers{opacity:1}.ping .ring,.bud .pulse{animation:none;opacity:0}}
</style>
</head>
<body>
<a class="back" href="/where-the-flowers-forget/">&#8592;&nbsp;&nbsp;Where the Flowers Forget</a>
<nav class="subnav"><a href="/dashboard.html?c=4">Roll Dashboard</a></nav>

<header>
  <div class="eyebrow">The Record</div>
  <h1>The Story Across Artemesia</h1>
  <p class="sub">The flowers bloom, then forget &mdash; and the map remembers. Pick a bloom to open what happened there.</p>
</header>

<div class="stage">
  <div class="mapwrap" id="mapwrap">
    <img class="mapimg" src="/assets/img/Artemesia_Map.webp" alt="Map of Artemesia">
    <div class="markers" id="markers"></div>
    <div class="reveal" id="reveal" aria-hidden="true">
      <img class="reveal-card" id="revealCard" src="/assets/img/wtff_tarot_face.webp" alt="" decoding="async" draggable="false">
    </div>
  </div>
  <div class="legend">
    <span><span class="dot" style="background:var(--gold-bright)"></span> You are here</span>
    <span><span class="dot" style="background:var(--copper)"></span> Event bloom (click)</span>
    <span><span class="dot" style="background:var(--gold)"></span> Path travelled</span>
  </div>
</div>

<footer>Rectrix Caedere <span class="d">&#10022;</span> Where the Flowers Forget <span class="d">&#10022;</span> <a href="/where-the-flowers-forget/">The Uprooters</a></footer>

<script>
var reduce = window.matchMedia('(prefers-reduced-motion:reduce)').matches;

/* ====================== CONFIG ====================== */
var CONFIG = {
  party: 'rhusatatiam',
  path: ['rhusatatiam'],
  locations: {
    zelkova:     { x:42, y:71, name:'Zelkova City',      region:'The Burn' },
    mouthfeeds:  { x:86, y:53, name:'Mouth that Feeds',  region:'Liriope River Net' },
    rhusatatiam: { x:33, y:50, name:'Rhusatatiam',       region:'Rhus Valley' },
    galiummajor: { x:77, y:33, name:'Galium Major',      region:'The Bloom' },
    willowhaven: { x:54, y:26, name:'Willow Haven',      region:'Salvia Forest' }
  },
  events: [
    { at:'rhusatatiam', sessions:[
      { n:'01', title:'Winds in the East', date:'06/14/2026', href:'/where-the-flowers-forget/session.html?n=01' }
    ]}
  ]
};
/* =================================================== */

var mapwrap=document.getElementById('mapwrap');
var markers=document.getElementById('markers');
var reveal=document.getElementById('reveal');
var revealCard=document.getElementById('revealCard');
var L=CONFIG.locations;
function place(el,key){var p=L[key];el.style.left=p.x+'%';el.style.top=p.y+'%';}

/* path polyline */
if(CONFIG.path.length>1){
  var ns='http://www.w3.org/2000/svg';
  var svg=document.createElementNS(ns,'svg');
  svg.setAttribute('viewBox','0 0 100 100');svg.setAttribute('preserveAspectRatio','none');
  svg.style.cssText='position:absolute;inset:0;width:100%;height:100%;z-index:5;pointer-events:none';
  var pts=CONFIG.path.map(function(k){return L[k].x+','+L[k].y;}).join(' ');
  var pl=document.createElementNS(ns,'polyline');
  pl.setAttribute('points',pts);pl.setAttribute('fill','none');pl.setAttribute('stroke','#C7A369');
  pl.setAttribute('stroke-width','0.6');pl.setAttribute('stroke-dasharray','2 2');pl.setAttribute('opacity','0.85');
  svg.appendChild(pl);mapwrap.insertBefore(svg,markers);
}

/* you-are-here ping */
var ping=document.createElement('div');ping.className='pt';
ping.innerHTML='<div class="ping">'
  +'<div class="ring"></div><div class="ring r2"></div>'
  +'<div class="shadow"></div><div class="dot"></div>'
  +'<div class="pinwrap"><svg viewBox="0 0 24 32"><defs><linearGradient id="pg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E8C690"/><stop offset="0.55" stop-color="#DA9565"/><stop offset="1" stop-color="#8C5D3F"/></linearGradient></defs>'
  +'<path d="M12 1 C6 1 2.2 5 2.2 10.6 C2.2 17.6 12 31 12 31 C12 31 21.8 17.6 21.8 10.6 C21.8 5 18 1 12 1 Z" fill="url(#pg)" stroke="#5E3E26" stroke-width="1"/>'
  +'<circle cx="12" cy="10.6" r="4" fill="#0a1019"/><circle cx="12" cy="10.6" r="4" fill="none" stroke="#E8C690" stroke-width="0.7" opacity="0.55"/></svg></div>'
  +'<div class="label">'+L[CONFIG.party].name+'<b>Party is here</b></div>'
  +'</div>';
place(ping,CONFIG.party);markers.appendChild(ping);

/* event buds */
var budFlower='<svg viewBox="0 0 24 24"><g><circle cx="12" cy="12" r="2.6" fill="#DA9565"/>'+
  '<path d="M12 9.4C12 5.6 13.7 3.4 12 1 10.3 3.4 12 5.6 12 9.4Z" fill="#C7A369"/>'+
  '<path d="M14.6 12C18.4 12 20.6 13.7 23 12 20.6 10.3 18.4 12 14.6 12Z" fill="#AF755A"/>'+
  '<path d="M12 14.6C12 18.4 10.3 20.6 12 23 13.7 20.6 12 18.4 12 14.6Z" fill="#C7A369"/>'+
  '<path d="M9.4 12C5.6 12 3.4 10.3 1 12 3.4 13.7 5.6 12 9.4 12Z" fill="#AF755A"/></g></svg>';

var openPop=null;
CONFIG.events.forEach(function(ev){
  var pt=document.createElement('div');pt.className='pt';
  var btn=document.createElement('button');
  btn.className='bud';btn.setAttribute('aria-expanded','false');btn.setAttribute('aria-label','Events at '+L[ev.at].name);
  btn.innerHTML='<span class="pulse"></span>'+budFlower;
  var pop=document.createElement('div');pop.className='pop';
  pop.innerHTML='<div class="loc">'+L[ev.at].region+'</div><div class="pn">'+L[ev.at].name+'</div>'+
    ev.sessions.map(function(s){return '<a class="sess" href="'+s.href+'"><span class="go">&#8594;</span>'+
      '<span class="st">Session '+s.n+' &mdash; '+s.title+'</span><span class="sd">'+s.date+'</span></a>';}).join('');
  btn.addEventListener('click',function(e){
    e.stopPropagation();
    var isOpen=pop.classList.contains('open');
    if(openPop){openPop.pop.classList.remove('open');openPop.btn.setAttribute('aria-expanded','false');}
    if(!isOpen){pop.classList.add('open');btn.setAttribute('aria-expanded','true');openPop={pop:pop,btn:btn};}else openPop=null;
  });
  pt.appendChild(btn);pt.appendChild(pop);place(pt,ev.at);markers.appendChild(pt);
});
document.addEventListener('click',function(){if(openPop){openPop.pop.classList.remove('open');openPop.btn.setAttribute('aria-expanded','false');openPop=null;}});

/* ── intro: card turns on its side → widens to map size → dissolves into the map ── */
function runReveal(){
  if(reduce){ if(reveal){ reveal.remove(); } markers.style.opacity='1'; return; }
  var Wm=mapwrap.clientWidth, Hm=mapwrap.clientHeight;
  var cardH=0.82*Hm;            /* displayed height of the upright card */
  var turnedW=cardH;            /* after a 90° turn the card's height becomes its width */
  var grow=(Wm/turnedW)*1.04;   /* widen until the turned card spans the map (slight overshoot = clean fill) */
  var anim=revealCard.animate([
    { transform:'rotate(0deg) scale(1)' },
    { transform:'rotate(90deg) scale(1)', offset:0.5 },
    { transform:'rotate(90deg) scale('+grow.toFixed(3)+')' }
  ], { duration:1250, easing:'cubic-bezier(.4,0,.2,1)', fill:'forwards' });
  anim.onfinish=function(){
    reveal.classList.add('gone');                       /* card + backdrop dissolve, revealing the map beneath */
    setTimeout(function(){ markers.style.opacity='1'; }, 300);
    setTimeout(function(){ if(reveal){ reveal.remove(); } }, 700);
  };
}
window.addEventListener('load',function(){ setTimeout(runReveal,200); });
</script>
</body>
</html>
