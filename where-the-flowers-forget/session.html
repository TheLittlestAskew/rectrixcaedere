<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Session — Where the Flowers Forget · Rectrix Caedere</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=Cinzel+Decorative:wght@400;700&family=Raleway:wght@300;400;500&family=Alegreya+Sans+SC:wght@400;500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/marked@13.0.3/marked.min.js"></script>
<!-- Layout, chrome and renderers are shared with every campaign. This page adds
     only its own atmosphere and says where its data comes from. -->
<link rel="stylesheet" href="/assets/session-layout.css">
<style>
body{
  background-image:
    radial-gradient(130% 80% at 50% -8%, rgba(199,163,105,.08), rgba(5,10,14,0) 42%),
    radial-gradient(120% 90% at 50% 12%, rgba(5,10,14,.12), rgba(5,10,14,.62) 55%, rgba(5,10,14,.95)),
    url('/assets/img/general_background.webp');
  background-size:cover;background-position:center 28%;background-attachment:fixed;
}
.petals{position:fixed;inset:-12% 0 0 0;pointer-events:none;z-index:1}
.petals i{position:absolute;top:-10%;width:11px;height:13px;border-radius:60% 60% 62% 38% / 70% 70% 40% 40%;background:radial-gradient(120% 120% at 30% 20%,var(--gold-pale),var(--gold-mid));opacity:0;animation:fall linear infinite}
.petals i.v{background:radial-gradient(120% 120% at 30% 20%,#cdbcef,#6B4FA0)}
@keyframes fall{0%{transform:translate3d(0,-10vh,0) scale(1);opacity:0}6%{opacity:.95}50%{transform:translate3d(calc(var(--dx,14px)*.5),52vh,0) scale(.96)}94%{opacity:.72}100%{transform:translate3d(var(--dx,14px),114vh,0) scale(.9);opacity:0}}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:80;opacity:.05;mix-blend-mode:overlay;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}
/* Lift the page above the falling petals. No transform on these: a transformed
   ancestor breaks the sticky rails. */
.topbar,#body,footer{position:relative;z-index:3}
@media(prefers-reduced-motion:reduce){.petals i{animation:none}}
</style>
</head>
<body>
<div class="petals" id="petals" aria-hidden="true"></div>
<div id="session"></div>

<script src="/assets/session-layout.js"></script>
<script>
var VR='https://raw.githubusercontent.com/TheLittlestAskew/wtff_vault/main';
var SS='01-Sessions';
var ROLLVIEW='wtff_session_rolls';
var SELF=location.pathname.split('/').pop()||'session.html';
var ROSTER=['Isla \'Bruin\' Kaplan','Artie (Art) Veyr','BE-BO (Botanical Energy Balance Operator)','Eliza Duskbloom','Tobias Wolfe','Zarna Morganach'];
/* Session list comes from the vault: Public Session Index.json, generated by
   wtff_vault/Workflows/scripts/generate_public_session_index.mjs. A new session
   note shows up here with no edit to this file. ARC below is only (a) the
   frozen fallback if that fetch fails and (b) where the hand-picked TAGS live:
   to give a session tags, add/edit its entry here. */
var INDEX=VR+'/00-Campaign-Hub/Public%20Session%20Index.json';
var ARC=[
 {n:'01',d:'2026-06-14',lbl:'June 14, 2026',t:'Winds in the East',f:SS+'/Session%2001%20%E2%80%94%20Winds%20in%20the%20East.md',tags:[{l:'\u2691 Crossover launch',c:'subdm'},{l:'\u25cf Roleplay',c:'rp'}]},
 {n:'02',d:'2026-06-28',lbl:'June 28, 2026',t:'It Follows Me, So I Followed It',f:SS+'/Session%2002%20%E2%80%94%20It%20Follows%20Me%2C%20So%20I%20Followed%20It.md',tags:[{l:'\u2691 Crossover',c:'subdm'},{l:'\u25cf Roleplay',c:'rp'}]},
 {n:'03',d:'2026-07-12',lbl:'July 12, 2026',t:'Raise a Glass to Provisional Trust',f:SS+'/Session%2003%20%E2%80%94%20Raise%20a%20Glass%20to%20Provisional%20Trust.md',tags:[{l:'\u2691 Travel',c:'travel'},{l:'\u25cf Roleplay',c:'rp'}]},
 {n:'04',d:'2026-07-26',lbl:'July 26, 2026',t:'Four Blooms, Five Petals',f:SS+'/Session%2004%20%E2%80%94%20Four%20Blooms%2C%20Five%20Petals.md',tags:[{l:'\u2694 Combat',c:'combat'},{l:'\u21e7 Level 1\u21922',c:'level'},{l:'\u26a1 Cliffhanger',c:'cliff'}]},
 {n:'05',d:'2026-08-09',lbl:'August 9, 2026',t:'The Bloody Truth',f:SS+'/Session%2005%20%E2%80%94%20The%20Bloody%20Truth.md',tags:[{l:'\u2694 Combat',c:'combat'},{l:'\u25cf Roleplay',c:'rp'}]},
 {n:'06',d:'2026-08-23',lbl:'August 23, 2026',t:'The Art of Staying Cool',f:SS+'/Session%2006%20%E2%80%94%20The%20Art%20of%20Staying%20Cool.md',tags:[{l:'\u2691 Travel',c:'travel'},{l:'\u25cf Roleplay',c:'rp'}]},
 {n:'07',d:'2026-09-20',lbl:'September 20, 2026',t:'Omission of Truth',f:SS+'/Session%2007%20%E2%80%94%20Omission%20of%20Truth.md',tags:[{l:'\u2691 Crossover',c:'subdm'},{l:'\u25cf Roleplay',c:'rp'}]}
];

function rx(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}
function sw(s){return (s||'').replace(/\[\[([^\]|]+)\|([^\]]+)\]\]/g,'$2').replace(/\[\[([^\]]+)\]\]/g,'$1');}
function wl(s){return (s||'').replace(/\[\[Session\s+(\d+(?:\.\d+)?)[^\]|]*(?:\|([^\]]+))?\]\]/g,function(m,n,d){var nn=(n.indexOf('.')<0&&n.length<2)?('0'+n):n;return '['+(d||('Session '+n))+']('+SELF+'?n='+nn+')';}).replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g,function(m,a,b){return b||a;});}
function fetchT(u){return fetch(u).then(function(r){return r.ok?r.text():null;}).catch(function(){return null;});}

/* section: matches "## Name" or "### Name"; a ## captures through ### children */
function section(md,h){
  var re=new RegExp('^(#{2,3})\\s+'+rx(h)+'\\b[^\\n]*$','mi');var m=re.exec(md);if(!m)return'';
  var lvl=m[1].length;var a=md.slice(m.index+m[0].length);
  var stop=lvl===2?/\n#{1,2}\s|\n---/:/\n#{1,3}\s|\n---/;var e=a.search(stop);
  return (e<0?a:a.slice(0,e)).trim();
}
/* A wikilink alias inside a vault table carries a pipe, usually escaped
   ([[Name\|Alias]]) and sometimes not. A bare split('|') cut those cells in two
   and shifted every column after them, so pipes inside [[...]] are shielded first. */
function tableRows(t){var rows=(t||'').split('\n').filter(function(l){return l.trim().charAt(0)==='|';});if(rows.length<2)return[];function c(r){return r.replace(/\\\|/g,'\u0000').replace(/\[\[[^\]\n]*\]\]/g,function(m){return m.replace(/\|/g,'\u0000');}).split('|').slice(1,-1).map(function(x){return x.replace(/\u0000/g,'|').trim();});}return rows.slice(2).map(c);}
function topBullets(t){return (t||'').split('\n').filter(function(l){return /^[-*]\s/.test(l);});}

function petals(){var host=document.getElementById('petals');if(!host)return;var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;var N=reduce?28:46;for(var i=0;i<N;i++){var f=document.createElement('i');if(Math.random()<0.16)f.className='v';var w=(Math.random()*7+8).toFixed(1);f.style.width=w+'px';f.style.height=(w*1.2).toFixed(1)+'px';f.style.left=(Math.random()*100).toFixed(2)+'%';if(reduce){f.style.top=(Math.random()*100).toFixed(2)+'%';f.style.opacity=(Math.random()*0.3+0.18).toFixed(2);}else{var d=(Math.random()*14+11).toFixed(1);f.style.animationDuration=d+'s';f.style.animationDelay=(-Math.random()*d).toFixed(1)+'s';f.style.setProperty('--dx',(Math.random()*80-30).toFixed(0)+'px');}host.appendChild(f);}}

function prose(t){return t?{kind:'prose',body_md:wl(t)}:null;}
function list(items){return items.length?{kind:'list',items:items}:null;}

/* ---- WtFF single-note structure ---- */
function journal(b){
  var pov=section(b,'Character POV Journal'),sub=pov;
  var jm=/###[^\n]*Journal Entry[^\n]*\n([\s\S]*)/i.exec(pov);if(jm)sub=jm[1];
  return sub.replace(/^\s*>\s*\*POV note[\s\S]*$/mi,'').trim();
}
/* Two line shapes are in the vault, and the older parser only knew the first, so
   every session written the second way published with no quotes at all:
     - *"Quote."* — Speaker (aside) — **Tag**        S01 to S04
     - "Quote." — Speaker (aside) · Tag               S05 onward */
function quoteItems(b){
  var out=[];
  section(b,'Quote Board').split('\n').forEach(function(l){
    var m=/^\s*-\s*\*?["“]([\s\S]+?)["”]\*?\s*—\s*(.+)$/.exec(l);if(!m)return;
    /* Resolve wikilinks BEFORE dropping parenthetical asides: a link target such
       as "Artie (Art) Veyr" has parentheses of its own. */
    var rest=sw(m[2]),tg=/\*\*([^*]+)\*\*\s*$/.exec(rest)||/·\s*([^·]+)$/.exec(rest);
    var sp=(tg?rest.slice(0,tg.index):rest).replace(/\([^)]*\)/g,'').replace(/—.*$/,'').trim();
    out.push({Speaker:sp,Quote:'“'+m[1].trim()+'”',Tag:tg?tg[1].trim():''});
  });
  return out;
}

/* Replace ARC with the live index, keeping each session's tags from the
   fallback. Resolves either way: a failed fetch logs and keeps the fallback. */
function loadArc(){
  return fetch(INDEX+'?t='+Date.now())
    .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
    .then(function(j){
      var ss=j&&j.sessions;
      if(!ss||!ss.length)throw new Error('index has no sessions');
      var tags={};ARC.forEach(function(a){tags[a.n]=a.tags;});
      ARC=ss.map(function(s){
        if(!s.n||!s.t||!s.d||!s.f)throw new Error('session entry missing n/t/d/f: '+JSON.stringify(s));
        return {n:s.n,d:s.d,lbl:s.lbl||s.d,t:s.t,f:s.f,tags:tags[s.n]||null};
      });
    })
    .catch(function(e){console.warn('WTFF session: could not use the live index ('+e+'); using frozen fallback.');});
}

async function load(n){
  await loadArc();
  var idx=-1,s=null;
  for(var i=0;i<ARC.length;i++){if(ARC[i].n===n||parseFloat(ARC[i].n)===parseFloat(n)){s=ARC[i];idx=i;break;}}
  if(!s)throw new Error('Unknown session “'+n+'”.');
  var md=await fetchT(VR+'/'+s.f);
  if(!md)throw new Error('Failed to load this session’s notes.');
  var b=md.replace(/^---\s*\n[\s\S]*?\n---\s*\n/,'');

  var kv={};
  tableRows(section(b,'Session Metadata')).forEach(function(r){if(r.length>=2)kv[sw(r[0]).replace(/\*\*/g,'').trim().toLowerCase()]=sw(r[1]).replace(/\*\*/g,'').trim();});

  var pov=journal(b);
  var panels={
    narrative:prose(section(b,'Narrative Summary')),
    scenes:prose(section(b,'Scene / Timeline Breakdown')),
    themes:prose(section(b,'Themes & Emotional Beats')),
    quests:prose(topBullets(section(b,'Quests / Objectives')).join('\n')),
    patterns:prose(topBullets(section(b,'Patterns')).join('\n')),
    continuity:prose(tableRows(section(b,'Continuity Flags')).map(function(r){return '- '+sw(r[1]||'')+(r[3]?' — *'+sw(r[3])+'*':'');}).join('\n')),
    npcs:list(tableRows(section(b,'NPCs')).map(function(r){return {Name:sw(r[0]||'').replace(/\*\*/g,''),Status:sw(r[1]||'')+(r[5]?' · '+sw(r[5]):'')};})),
    locations:list(tableRows(section(b,'Locations Visited')).map(function(r){return {Location:wl(r[0]||''),Notes:sw(r[1]||'')};})),
    loot:list(tableRows(section(b,'Loot & Items')).map(function(r){return {'Character/Owner':sw(r[0]||''),'Item/Artifact':wl(r[1]||''),'State/Context':sw(r[2]||'')};})),
    quotes:list(quoteItems(b)),
    /* The Word column holds phrases ("shit / shitty"), so this stays a plain
       table: the shared by-word renderer would censor and group on the phrase. */
    profanity:list(tableRows(section(b,'Profanity Record')).filter(function(r){return r[0]&&!/^\s*$/.test(r[0]);}).map(function(r){
      return {Speaker:sw(r[0]).replace(/\*\*/g,'').replace(/\s*\/.*$/,'').trim(),Word:sw(r[1]||''),Count:sw(r[2]||'')};
    }))
  };
  Object.keys(panels).forEach(function(k){if(!panels[k])delete panels[k];});

  return {
    sessions:ARC.map(function(x){return {label:x.n,title:x.t};}),idx:idx,
    label:s.n,title:s.t,date:s.d,dateLabel:s.lbl,
    where:[['Location',wl(kv['start location']||kv['location']||'')],['Party level',kv['party level']],['Type',kv['session type']]],
    tags:(s.badge?[s.badge]:[]).concat((s.tags||[]).map(function(t){return t.l;})),
    pov:pov?{byline:s.t,md:wl(pov)}:null,
    panels:panels
  };
}

function boot(){
  petals();
  SessionLayout.mount({
    campaign:'Where the Flowers Forget',home:'/where-the-flowers-forget/',
    archive:{href:'/where-the-flowers-forget/archive.html',label:'The Map of Artemesia'},
    povLabel:'Bruin’s Account · “Trust your nose”',
    rollView:ROLLVIEW,rollSummary:true,recBase:'',
    roster:ROSTER,
    nav:[
      ['narrative','Narrative Summary'],
      ['scenes','Scenes & Timeline'],
      ['themes','Themes / Beats'],
      ['quests','Quests & Objectives'],
      ['patterns','Patterns & Implications'],
      ['continuity','Continuity Flags'],
      ['rolllog','Roll Log']
    ],
    load:load
  });
}
if(typeof marked!=='undefined'){document.addEventListener('DOMContentLoaded',boot);}else{window.addEventListener('load',boot);}
</script>
</body>
</html>
