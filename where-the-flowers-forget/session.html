function wl(s){return (s||'').replace(/\[\[Session\s+(\d+(?:\.\d+)?)[^\]|]*(?:\|([^\]]+))?\]\]/g,function(m,n,d){var nn=(n.indexOf('.')<0&&n.length<2)?('0'+n):n;return '['+(d||('Session '+n))+']('+SELF+'?n='+nn+')';}).replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g,function(m,a,b){return b||a;});}
function md2(t){if(!t)return'';return marked.parse(wl(t)).replace(/<table>/g,'<div class="tbl-wrap"><table>').replace(/<\/table>/g,'</table></div>');}
function fetchT(u){return fetch(u).then(function(r){return r.ok?r.text():null;}).catch(function(){return null;});}

/* section: matches "## Name" or "### Name"; a ## captures through ### children */
function section(md,h){
  var re=new RegExp('^(#{2,3})\\s+'+rx(h)+'\\b[^\\n]*$','mi');var m=re.exec(md);if(!m)return'';
  var lvl=m[1].length;var a=md.slice(m.index+m[0].length);
  var stop=lvl===2?/\n#{1,2}\s|\n---/:/\n#{1,3}\s|\n---/;var e=a.search(stop);
  return (e<0?a:a.slice(0,e)).trim();
}
function tableRows(t){var rows=(t||'').split('\n').filter(function(l){return l.trim().charAt(0)==='|';});if(rows.length<2)return[];function c(r){return r.split('|').slice(1,-1).map(function(x){return x.trim();});}return rows.slice(2).map(c);}
function topBullets(t){return (t||'').split('\n').filter(function(l){return /^[-*]\s/.test(l);});}
function iv(v){if(v==null)return null;if(typeof v==='string'){try{v=JSON.parse(v);}catch(e){return null;}}return Array.isArray(v)?v:null;}

var MOD={};
function modal(k){var m=MOD[k];if(!m)return;document.getElementById('m-eyebrow').textContent=m.eb||'';document.getElementById('m-title').textContent=m.t||'';var b=document.getElementById('m-body');b.className=(k==='pov'?'pov':'');b.innerHTML=m.h||'';b.scrollTop=0;document.getElementById('overlay').classList.add('open');document.body.style.overflow='hidden';}
function mclose(){document.getElementById('overlay').classList.remove('open');document.body.style.overflow='';}
document.addEventListener('keydown',function(e){if(e.key==='Escape')mclose();});
function hide(id){var e=document.getElementById(id);if(e)e.style.display='none';}

function petals(){var host=document.getElementById('petals');if(!host)return;var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;var N=reduce?28:46;for(var i=0;i<N;i++){var f=document.createElement('i');if(Math.random()<0.16)f.className='v';var w=(Math.random()*7+8).toFixed(1);f.style.width=w+'px';f.style.height=(w*1.2).toFixed(1)+'px';f.style.left=(Math.random()*100).toFixed(2)+'%';if(reduce){f.style.top=(Math.random()*100).toFixed(2)+'%';f.style.opacity=(Math.random()*0.3+0.18).toFixed(2);}else{var d=(Math.random()*14+11).toFixed(1);f.style.animationDuration=d+'s';f.style.animationDelay=(-Math.random()*d).toFixed(1)+'s';f.style.setProperty('--dx',(Math.random()*80-30).toFixed(0)+'px');}host.appendChild(f);}}

/* ---- renderers (WtFF single-note structure) ---- */
function renderHero(b,s){
  var pov=section(b,'Character POV Journal');var sub=pov;
  var jm=/###[^\n]*Journal Entry[^\n]*\n([\s\S]*)/i.exec(pov);if(jm)sub=jm[1];
  sub=sub.replace(/^\s*>\s*\*POV note[\s\S]*$/mi,'').trim();
  if(!sub){hide('z-hero');return;}
  var full=md2(sub);document.getElementById('z-byline').textContent=s.t;
  var firstP=(full.match(/<p>[\s\S]*?<\/p>/)||[full])[0];
  document.getElementById('z-pov').innerHTML=firstP;
  MOD.pov={eb:'Bruin\u2019s account',t:s.t,h:full};
  document.getElementById('z-hero').style.display='';
}
function renderMeta(b,s){
  var rows=tableRows(section(b,'Session Metadata')),kv={};
  rows.forEach(function(r){if(r.length>=2)kv[sw(r[0]).replace(/\*\*/g,'').trim().toLowerCase()]=sw(r[1]).replace(/\*\*/g,'').trim();});
  var html='';
  var loc=kv['start location']||kv['location']||'';
  if(loc)html+='<dt>Location</dt><dd>'+md2(loc).replace(/^<p>|<\/p>\s*$/g,'')+'</dd>';
  html+='<dt>Date</dt><dd>'+esc(s.lbl)+'</dd>';
  if(kv['party level'])html+='<dt>Party level</dt><dd>'+esc(kv['party level'])+'</dd>';
  if(kv['session type'])html+='<dt>Type</dt><dd>'+esc(kv['session type'])+'</dd>';
  document.getElementById('z-meta').innerHTML=html;
  document.getElementById('z-party').innerHTML=ROSTER.map(function(nm){return '<span class="chip">'+esc(nm.replace(/\u2018|\u2019|'/g,'').split(' ')[0])+'</span>';}).join('');
}
function renderQuests(b){
  var items=topBullets(section(b,'Quests / Objectives'));
  if(!items.length){hide('z-quests-card');return;}
  document.getElementById('z-quests').innerHTML=items.map(function(q){return '<div class="thread"><div class="t">'+md2(q.replace(/^[-*]\s/,'')).replace(/^<p>|<\/p>\s*$/g,'')+'</div></div>';}).join('');
}
function renderNarr(b){
  var sum=section(b,'Narrative Summary');
  document.getElementById('z-narr').innerHTML=md2(sum)||'<p class="muted">&mdash;</p>';
  MOD.narr={eb:'The record',t:'Narrative summary',h:md2(sum)};
}
function renderNpcs(b){
  var rows=tableRows(section(b,'NPCs'));
  if(!rows.length){hide('z-npcs-card');return;}
  document.getElementById('z-npcs').innerHTML=rows.map(function(r){return '<div class="npc"><div><span class="nm">'+esc(sw(r[0]||'').replace(/\*\*/g,''))+'</span><span class="m">'+esc(sw(r[1]||''))+(r[5]?' \u00b7 '+esc(sw(r[5])):'')+'</span></div></div>';}).join('');
}
function renderLocs(b){
  var rows=tableRows(section(b,'Locations Visited'));
  if(!rows.length){hide('z-locs-card');return;}
  document.getElementById('z-locs').innerHTML=rows.map(function(r){return '<div class="loot"><div class="it">'+md2(r[0]||'').replace(/^<p>|<\/p>\s*$/g,'')+'</div><div class="o">'+esc(sw(r[1]||''))+'</div></div>';}).join('');
}
function renderLoot(b){
  var rows=tableRows(section(b,'Loot & Items'));
  if(!rows.length){hide('z-loot-card');return;}
  document.getElementById('z-loot').innerHTML=rows.map(function(r){return '<div class="loot"><div class="it">'+md2(r[1]||'').replace(/^<p>|<\/p>\s*$/g,'')+'</div><div class="o">'+esc(sw(r[0]||''))+(r[2]?' \u00b7 '+esc(sw(r[2])):'')+'</div></div>';}).join('');
}
function renderQuotes(b){
  var block=section(b,'Quote Board');var lines=block.split('\n').filter(function(l){return /^\s*-\s/.test(l);});
  var out=[];lines.forEach(function(l){
    var qm=/\*[\"\u201c]([\s\S]+?)[\"\u201d]\*/.exec(l);if(!qm)return;
    var rest=l.slice(qm.index+qm[0].length);var tag='';var tg=/\*\*([^*]+)\*\*\s*$/.exec(rest);if(tg)tag=tg[1];
    var sp=rest.replace(/\*\*[^*]+\*\*\s*$/,'').replace(/^\s*\u2014\s*/,'').replace(/\([^)]*\)/g,'');
    sp=sw(sp).replace(/\u2014.*$/,'').replace(/[\u2014-]\s*$/,'').trim();
    out.push({tx:qm[1].trim(),sp:sp,tag:tag.trim()});
  });
  if(!out.length){hide('z-quotes-card');return;}
  function qh(q){return '<blockquote class="q">\u201c'+esc(q.tx)+'\u201d<cite>\u2014 '+esc(q.sp)+(q.tag?' \u00b7 '+esc(q.tag):'')+'</cite></blockquote>';}
  document.getElementById('z-quotes').innerHTML=out.slice(0,5).map(qh).join('');
  if(out.length>5){MOD.quotes={eb:'Verbatim',t:'Quote board',h:out.map(qh).join('')};document.getElementById('z-quotes').insertAdjacentHTML('beforeend','<button class="more" onclick="modal(\'quotes\')">See all '+out.length+' quotes</button>');}
}
function renderProf(b){
  var rows=tableRows(section(b,'Profanity Record'));
  rows=rows.filter(function(r){return r[0]&&!/^\s*$/.test(r[0]);});
  if(!rows.length){hide('z-prof-card');return;}
  document.getElementById('z-prof').innerHTML=rows.map(function(r){
    var who=sw(r[0]).replace(/\*\*/g,'').replace(/\s*\/.*$/,'').trim();var word=sw(r[1]||'');var freq=sw(r[2]||'');
    return '<div class="word"><span class="w">'+esc(who)+'</span><span class="n" title="'+esc(freq)+'">'+esc(word)+'</span></div>';
  }).join('');
}
function renderArch(b){
  var pat=topBullets(section(b,'Patterns'));
  if(pat.length)document.getElementById('z-arch').innerHTML='<ul>'+pat.map(function(x){return '<li>'+md2(x.replace(/^[-*]\s/,'')).replace(/^<p>|<\/p>\s*$/g,'')+'</li>';}).join('')+'</ul>';
  else hide('z-arch-card');
  var rows=tableRows(section(b,'Continuity Flags'));
  if(rows.length)document.getElementById('z-flags').innerHTML='<ul>'+rows.map(function(r){return '<li>'+esc(sw(r[1]||''))+(r[3]?' <span class="muted">\u2014 '+esc(sw(r[3]))+'</span>':'')+'</li>';}).join('')+'</ul>';
  else hide('z-flags-card');
}
function renderLogs(date){
  fetch(SB+'/rest/v1/'+ROLLVIEW+'?session_date=eq.'+date+'&select=character,action,roll_type,dice_notation,modifier,total,individual_values,roll_id,timestamp_unix&order=timestamp_unix.asc&limit=2000',{headers:{apikey:AK,Authorization:'Bearer '+AK}})
  .then(function(r){return r.ok?r.json():[];}).then(function(rows){
    var order=[],g={},n20=0,n1=0,dmg=0,hits=[],init=[];
    rows.forEach(function(x){if(!g[x.roll_id]){g[x.roll_id]=[];order.push(x.roll_id);}g[x.roll_id].push(x);
      if(/^1d20/.test(x.dice_notation||'')){var a=iv(x.individual_values);if(a&&a.length){if(a[0]===20)n20++;if(a[0]===1)n1++;}}
      if(x.roll_type==='damage')dmg+=(x.total||0);
      if(/initiative/i.test(x.roll_type||'')||/initiative/i.test(x.action||''))init.push({c:x.character,t:x.total});});
    var body=order.map(function(id){var grp=g[id],pr=null;for(var i=0;i<grp.length;i++){if(grp[i].roll_type!=='damage'){pr=grp[i];break;}}if(!pr)pr=grp[0];
      var dm=grp.filter(function(x){return x.roll_type==='damage';}).map(function(x){return x.total;});
      if(dm.length)dm.forEach(function(v){hits.push({c:pr.character,v:v});});
      var cls='';if(/d20/.test(pr.dice_notation||'')){var a=iv(pr.individual_values);if(a){if(a.indexOf(20)>=0)cls='up';else if(a.indexOf(1)>=0)cls='dn';}}
      var res=esc(String(pr.total))+(dm.length?' <span class="muted">/ '+esc(dm.join(', '))+' dmg</span>':'');
      return '<tr><td>'+esc(pr.character||'\u2014')+'</td><td>'+esc(pr.action||'\u2014')+'</td><td>'+esc(pr.roll_type||'')+'</td><td><span class="'+cls+'">'+res+'</span></td></tr>';
    }).join('');
    document.getElementById('z-rolllog').innerHTML=body||'<tr><td colspan="4" class="muted">No rolls synced yet \u2014 this campaign\u2019s D&amp;D Beyond game is not live in the archive.</td></tr>';
    document.getElementById('z-encsum').innerHTML=
      '<div class="s"><div class="v">'+rows.length+'</div><div class="l">Rolls</div></div>'+
      '<div class="s"><div class="v up">'+n20+'</div><div class="l">Nat 20</div></div>'+
      '<div class="s"><div class="v dn">'+n1+'</div><div class="l">Nat 1</div></div>'+
      '<div class="s"><div class="v">'+dmg+'</div><div class="l">Damage dealt</div></div>';
    document.getElementById('z-init').innerHTML=init.length?init.sort(function(a,b){return b.t-a.t;}).map(function(x){return '<div class="loot"><div class="it">'+esc(x.c||'\u2014')+' <strong style="color:var(--gold-pale);float:right">'+x.t+'</strong></div></div>';}).join(''):'<div class="muted">No initiative rolls logged.</div>';
    hits.sort(function(a,b){return b.v-a.v;});
    document.getElementById('z-hits').innerHTML=hits.length?hits.slice(0,5).map(function(x){return '<div class="loot"><div class="it">'+esc(x.c||'\u2014')+' <strong style="color:var(--coral);float:right">'+x.v+'</strong></div></div>';}).join(''):'<div class="muted">No damage logged.</div>';
  }).catch(function(){document.getElementById('z-rolllog').innerHTML='<tr><td colspan="4" class="muted">Roll log unavailable.</td></tr>';});
}

function init(){
  petals();
  var n=getN();
  if(!n){document.getElementById('body').innerHTML='<div class="err">No session specified. <a href="'+ARCHIVE+'">Go to the map</a></div>';return;}
  var idx=-1,s=null;
  for(var i=0;i<ARC.length;i++){if(ARC[i].n===n||parseFloat(ARC[i].n)===parseFloat(n)){s=ARC[i];idx=i;break;}}
  if(!s){document.getElementById('body').innerHTML='<div class="err">Unknown session \u201c'+esc(n)+'\u201d. <a href="'+ARCHIVE+'">Go to the map</a></div>';return;}
  document.title='Session '+s.n+' \u00b7 '+s.t+' \u2014 Where the Flowers Forget';
  document.getElementById('snum').textContent='Where the Flowers Forget \u00b7 Session '+s.n;
  var tEl=document.getElementById('stitle');tEl.innerHTML=esc(s.t)+(s.badge?' <span class="fbadge">'+esc(s.badge)+'</span>':'');
  document.getElementById('sdate').textContent=s.lbl;
  if(s.tags)document.getElementById('stags').innerHTML=s.tags.map(function(t){return '<span class="tag '+t.c+'">'+t.l+'</span>';}).join('');
  var pv,nx2;
  if(idx>0){var p=ARC[idx-1];pv='<a href="'+SELF+'?n='+p.n+'"><span class="l">&larr; Session '+p.n+'</span><span class="tt">'+esc(p.t)+'</span></a>';}else pv='<a class="disabled"><span class="l">&larr; Previous</span><span class="tt">\u2014</span></a>';
  if(idx<ARC.length-1){var nn=ARC[idx+1];nx2='<a href="'+SELF+'?n='+nn.n+'"><span class="l">Session '+nn.n+' &rarr;</span><span class="tt">'+esc(nn.t)+'</span></a>';}else nx2='<a class="disabled"><span class="l">Next &rarr;</span><span class="tt">\u2014</span></a>';
  document.getElementById('snav').innerHTML=pv+nx2;
  document.getElementById('body').innerHTML=document.getElementById('tpl').innerHTML;

  // stat pills (rolls) — graceful when view/game not live
  fetch(SB+'/rest/v1/'+ROLLVIEW+'?session_date=eq.'+s.d+'&select=dice_notation,individual_values&limit=2000',{headers:{apikey:AK,Authorization:'Bearer '+AK}})
   .then(function(r){return r.ok?r.json():[];}).then(function(rows){var t=rows.length,n20=0,n1=0;rows.forEach(function(r){if(/^1d20/.test(r.dice_notation||'')){var a=iv(r.individual_values);if(a&&a.length){if(a[0]===20)n20++;if(a[0]===1)n1++;}}});document.getElementById('spills').innerHTML=t?('<span class="pill">'+t+' rolls</span><span class="pill up">nat\u202f20 \u00d7\u202f'+n20+'</span><span class="pill dn">nat\u202f1 \u00d7\u202f'+n1+'</span>'):'<span class="pill">roll archive pending</span>';}).catch(function(){});
  renderLogs(s.d);

  fetchT(VR+'/'+s.f).then(function(md){
    if(!md){document.getElementById('body').innerHTML='<div class="err">Failed to load this session\u2019s notes. <a href="'+ARCHIVE+'">Back to the map</a></div>';return;}
    var bodyMd=md.replace(/^---\s*\n[\s\S]*?\n---\s*\n/,'');
    renderHero(bodyMd,s);renderMeta(bodyMd,s);renderQuests(bodyMd);renderNarr(bodyMd);
    renderNpcs(bodyMd);renderLocs(bodyMd);renderLoot(bodyMd);renderQuotes(bodyMd);
    renderProf(bodyMd);renderArch(bodyMd);
  });
}
if(typeof marked!=='undefined'){document.addEventListener('DOMContentLoaded',init);}else{window.addEventListener('load',init);}
</script>

<div class="overlay" id="overlay" onclick="if(event.target===this)mclose()">
  <div class="modal"><button class="mclose" onclick="mclose()" aria-label="Close">&times;</button>
    <div class="mhead"><div class="eyebrow2" id="m-eyebrow"></div><h3 id="m-title"></h3><div class="mrule"></div></div>
    <div id="m-body"></div>
  </div>
</div>
