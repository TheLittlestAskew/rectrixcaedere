function tags(md){
  var t=[];
  if(!/no\s+(?:traditional\s+)?combat|no\s+initiative\s+(?:was\s+)?rolled/i.test(md)) t.push({lbl:'\u2694\u00a0\u00a0Combat',cls:'combat'});
  var qs=md.match(/(?:##|###|\*\*)[^\n]*\bQuests?\b[^\n]*\n([\s\S]+?)(?=\n##|\n---|\n\n\*\*[A-Z])/i);
  var qC=qs?qs[1]:md;
  var nq=(qC.match(/^\s*[-*]\s*\*\*[^*\n]*\bNew\b[^*\n]*:\s*\*\*/gim)||[]).length;
  if(nq>0) t.push({lbl:'\u2726\u00a0\u00a0New Quest'+(nq>1?'\u00a0\u00d7'+nq:''),cls:'questnew'});
  var dq=(qC.match(/^\s*[-*]\s*\*\*[^*\n]*Completed[^*\n]*:\s*\*\*/gim)||[]).length;
  if(dq>0) t.push({lbl:'\u2713\u00a0\u00a0Quest Done'+(dq>1?'\u00a0\u00d7'+dq:''),cls:'questdone'});
  if(!/no\s+level[\s\-]?up/i.test(md)&&/leveled\s+up|levels?\s+up|level[\s\-]?up\s+(?:triggered|achieved|this|at)|milestone\s+level|reach(?:ed|es)?\s+level\s+\d|\*\*\d+\s*[\u2192>\-]+\s*\d+\*\*/i.test(md)) t.push({lbl:'\u21e7\u00a0\u00a0Level Up',cls:'levelup'});
  if(/(?:party|the\s+party|pcs?)\s+split|split\s+(?:the\s+)?party|split\s+up|split\s+in[t]?o\s+(?:two|three|multiple|sub|small)/i.test(md)) t.push({lbl:'\u29C9\u00a0\u00a0Party Split',cls:'split'});
  return t;
}

var SELF=location.pathname.split('/').pop()||'session.html';
var STOP3=/^#{2,3} /m, STOP2=/^## /m;
function zblock(md,h,stop){var re=new RegExp('^#{2,3}[^\n]*'+h.replace(/[.*+?^${}()|[\]\\\/]/g,'\\$&')+'[^\n]*$','mi');var m=re.exec(md);if(!m)return'';var rest=md.slice(m.index+m[0].length);var n=rest.search(stop);return (n===-1?rest:rest.slice(0,n)).trim();}
/* A wikilink alias inside a vault table carries a pipe, usually escaped
   ([[Name\|Alias]]) and sometimes not. A bare split('|') cut those cells in two
   and shifted every column after them, so pipes inside [[...]] are shielded first. */
function ztable(t){var rows=t.split(/\n/).filter(function(l){return l.trim().charAt(0)==='|';});if(rows.length<2)return{head:[],body:[]};function c(r){return r.replace(/\\\|/g,'\u0000').replace(/\[\[[^\]\n]*\]\]/g,function(m){return m.replace(/\|/g,'\u0000');}).split('|').slice(1,-1).map(function(x){return x.replace(/\u0000/g,'|').trim();});}return{head:c(rows[0]),body:rows.slice(2).map(c)};}
function zsw(s){return (s||'').replace(/\[\[([^\]|]+)\|([^\]]+)\]\]/g,'$2').replace(/\[\[([^\]]+)\]\]/g,'$1');}
function zwl(s){return (s||'').replace(/\[\[PP_(\d+)_[^\]|]*?(?:\|([^\]]+))?\]\]/g,function(m,n,d){return '['+(d||'Session '+n)+']('+SELF+'?n='+n+')';}).replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g,function(m,a,b){return b||a;});}
function zfix(s){if(!s)return s;if(s===s.toUpperCase()&&/[A-Z]/.test(s)){return s.toLowerCase().split(' ').map(function(w){return w?w.charAt(0).toUpperCase()+w.slice(1):w;}).join(' ');}return s;}
var ZPC={Orphie:'#C7A369',Ogre:'#AF755A',Rin:'#4A9E9E',Sanis:'#8B6BB5',Varis:'#6B8AAD'};
var ZGUEST=['Chandra','Teferi'];
var ZP2C={Taylor:'Orphie',Chet:'Ogre',Rachel:'Rin',Gabe:'Sanis',Vincent:'Varis',Vince:'Varis',Chris:'DM'};
var ZDISP={'Nicol Bolas':'enemy','Vraska':'enemy','Eternals':'enemy','Domri':'enemy','Bolas':'enemy','Ral Zarek':'friendly','Tomik':'friendly','Niv-Mizzet':'friendly','Kaya Cassir':'neutral','Szadek':'neutral'};

function prose(t){return t?{kind:'prose',body_md:zwl(t)}:null;}
function list(items){return items.length?{kind:'list',items:items}:null;}
/* A section the note wrote as a table becomes rows; one written as a paragraph stays prose. */
function tableOrProse(block,toItem){var t=ztable(block);return t.body.length?list(t.body.map(toItem)):prose(block);}

async function load(n){
  var idx=-1,s=null;
  for(var i=0;i<ARC.length;i++){if(ARC[i].n===n){s=ARC[i];idx=i;break;}}
  if(!s)throw new Error('Unknown session “'+n+'”.');
  var raw;
  try{
    var resp=await fetch(VR+'/'+s.f);
    if(!resp.ok)throw new Error('HTTP '+resp.status);
    raw=await resp.text();
  }catch(e){ throw new Error('Failed to load session notes.'); }

  var fmText=(/^---\n([\s\S]*?)\n---/.exec(raw)||[null,''])[1];
  function fm(k){var m=new RegExp('^'+k+':\\s*(.*)$','m').exec(fmText);return m?m[1].trim().replace(/^"|"$/g,''):'';}
  function fmArr(k){var v=fm(k);if(/^\[.*\]$/.test(v)){return v.slice(1,-1).split(',').map(function(x){return x.trim().replace(/^"|"$/g,'');}).filter(Boolean);}return [];}
  var body=raw.replace(/^---\s*\n[\s\S]*?\n---\s*\n/,'');

  // POV
  var pov=zblock(body,'POV Overview',STOP2);
  var subm=/^###\s+(.+)$/m.exec(pov);
  var povBody=pov.replace(/^###\s+.+$/m,'').trim();

  // narrative (+fallback to Session Analysis minus sub-zones)
  var narr=zblock(body,'Narrative Summary',STOP3);
  if(!narr){var sa=zblock(body,'Session Analysis',STOP2);var cut=sa.search(/^###\s+(Quests|Themes|Locations|Scene|Session Setting|Reputation|Party Structure)/mi);narr=cut===-1?sa:sa.slice(0,cut).trim();}

  var party=fmArr('party_present');
  function isGuest(nm){return ZGUEST.some(function(x){return nm.toLowerCase().indexOf(x.toLowerCase())===0;});}

  var quests=zblock(body,'Quests',STOP3).split('\n').filter(function(l){return /^\s*[-*]\s/.test(l);}).map(function(q){
    var tm=/\*\*(.+?)\*\*/.exec(q);var done=/complet|✅|done|🏁/i.test(q);
    return {title:zsw(tm?tm[1]:q.replace(/^\s*[-*]\s/,'')),done:done};
  });

  // quotes (table 2026, or **SP** [tag] *"q"* 2025)
  var qB=zblock(body,'Quote Board',STOP3),qT=ztable(qB),quotes=[];
  if(qT.body.length){quotes=qT.body.map(function(r){return {Speaker:zsw(r[0]||''),Quote:'“'+zsw(r[1]||'').replace(/^"|"$/g,'')+'”',Tag:r[2]||''};});}
  else{var qre=/\*\*(.+?)\*\*\s*·\s*\[(.+?)\]\s*\n\s*\*"?([\s\S]+?)"?\*/g,qm;while((qm=qre.exec(qB))){quotes.push({Speaker:zsw(qm[1]),Quote:'“'+zsw(qm[3]).replace(/^"|"$/g,'')+'”',Tag:qm[2]});}}

  var panels={
    narrative:prose(narr),
    scenes:prose(zblock(body,'Scene / Timeline',STOP3)),
    themes:prose(zblock(body,'Themes',STOP3)),
    quests:list(quests),
    patterns:prose(zblock(body,'Patterns',STOP3)),
    continuity:prose(zblock(body,'Continuity',STOP3)),
    encounters:prose(zblock(body,'Encounters',STOP3)),
    enc_summary:prose(zblock(body,'Encounter Summary',STOP3)),
    initiative:prose(zblock(body,'Initiative',STOP3)),
    npcs:list(ztable(zblock(body,'NPCs',STOP3)).body.map(function(r){return {Name:zsw(r[0]||''),Status:zsw(r.length>5?r[5]:r[r.length-1]||'')};})),
    locations:tableOrProse(zblock(body,'Locations',STOP3),function(r){return {Location:zsw(r[0]||''),Notes:zsw(r[1]||'')};}),
    loot:tableOrProse(zblock(body,'Loot',STOP3),function(r){
      var three=r.length>=3;
      return {'Character/Owner':zsw(three?r[0]:''),'Item/Artifact':zsw((three?r[1]:r[0])||''),'State/Context':zsw((three?r[2]:r[1])||'')};
    }),
    quotes:list(quotes),
    /* Speakers are logged by player; the record shows the character instead. */
    profanity:tableOrProse(zblock(body,'Profanity',STOP3),function(r){
      var sp=(r[0]||'').replace(/\s*\(OOC\)\s*/i,'').trim();
      return {Speaker:ZP2C[sp]||sp,'Curse Word':(r[1]||'').trim(),Frequency:r[2]||'1'};
    })
  };
  Object.keys(panels).forEach(function(k){if(!panels[k])delete panels[k];});

  return {
    sessions:ARC.map(function(x){return {label:x.n,title:x.t};}),idx:idx,
    label:s.n,title:s.t,date:s.d,dateLabel:s.lbl,
    where:[['Start',zsw(fm('start_location'))],['End',zsw(fm('end_location'))]],
    recording:s.rec,
    present:party.length?party:null,guests:party.filter(isGuest),
    tags:(s.fin?['Finale']:[]).concat(tags(raw).map(function(t){return t.lbl.replace(/ +/g,' ');})),
    pov:povBody?{byline:subm?zfix(subm[1].trim()):s.t,md:zwl(povBody)}:null,
    panels:panels
  };
}

function boot(){
  SessionLayout.mount({
    campaign:'Pacts & Power',home:'/pacts-and-power/',
    archive:{href:'/pacts-and-power/archive.html',label:'The Chronicle'},
    povLabel:'Character POV · Molten Marginalia',
    rollView:'pp_session_rolls',
    recBase:'https://pub-33596be843004e7282ae8a9069ae9b82.r2.dev/Recordings/pacts_power/',
    roster:Object.keys(ZPC),pcColors:ZPC,dispo:ZDISP,
    nav:[
      ['narrative','Narrative Summary'],
      ['scenes','Scenes & Timeline'],
      ['themes','Themes / Beats'],
      ['quests','Quests & Objectives'],
      ['patterns','Patterns & Implications'],
      ['continuity','Continuity Flags'],
      ['encounters','Encounters'],
      ['enc_summary','Encounter Summary'],
      ['initiative','Initiative'],
      ['rolllog','Roll Log']
    ],
    load:load
  });
}
if(typeof marked!=='undefined'){boot();}else{window.addEventListener('load',boot);}
