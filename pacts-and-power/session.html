function getN(){var m=location.search.match(/[?&]n=([^&]+)/);return m?m[1]:null;}

function tags(md){
  var t=[];
  if(!/no\s+(?:traditional\s+)?combat|no\s+initiative\s+(?:was\s+)?rolled/i.test(md)) t.push({lbl:'\u2694\u00a0\u00a0Combat',cls:'combat'});
  var qs=md.match(/(?:##|###|\*\*)[^\n]*\bQuests?\b[^\n]*\n([\s\S]+?)(?=\n##|\n---|\n\n\*\*[A-Z])/i);
  var qC=qs?qs[1]:md;
  var nq=(qC.match(/^\s*[-*]\s*\*\*[^*\n]*\bNew\b[^*\n]*:\s*\*\*/gim)||[]).length;
  if(nq>0) t.push({lbl:'\u2726\u00a0\u00a0New Quest'+(nq>1?'\u00a0\u00d7'+nq:''),cls:'questnew'});
  var dq=(qC.match(/^\s*[-*]\s*\*\*[^*\n]*Completed[^*\n]*:\s*\*\*/gim)||[]).length;
  if(dq>0) t.push({lbl:'\u2713\u00a0\u00a0Quest Done'+(dq>1?'\u00a0\u00d7'+dq:''),cls:'questdone'});
  if(!/no\s+level[\s\-]?up/i.test(md)&&/leveled\s+up|levels?\s+up|level[\s\-]?up\s+(?:triggered|achieved|this|at)|milestone\s+level|reach(?:ed|es)?\s+level\s+\d|\*\*\d+\s*[\u2192>\-]+\s*\d+\*\*/i.test(md)) t.push({lbl:'\u21e7\u00a0\u00a0Level Up',cls:'levelup'});
  if(/(?:party|the\s+party|pcs?)\s+split|split\s+(?:the\s+)?party|split\s+up|split\s+in[t]?o\s+(?:two|three|multiple|sub|small)/i.test(md)) t.push({lbl:'\u29C9\u00a0\u00a0Party Split',cls:'split'});
  return t;
}

async function rollStats(date){
  try{
    var r=await fetch(SB+'/rest/v1/pp_session_rolls?session_date=eq.'+date+'&select=dice_notation,individual_values&limit=2000',{headers:{apikey:AK,Authorization:'Bearer '+AK}});
    if(!r.ok) return null;
    var rows=await r.json();
    var s={total:rows.length,n20:0,n1:0};
    rows.forEach(function(r){
      if(r.dice_notation&&/^1d20/.test(r.dice_notation)){
        var v=r.individual_values;
        if(typeof v==='string'){try{v=JSON.parse(v);}catch(e){}}
        if(Array.isArray(v)&&v.length){if(v[0]===20) s.n20++;if(v[0]===1) s.n1++;}
      }
    });
    return s;
  }catch(e){return null;}
}

function transformMd(md){
  md=md.replace(/^---\s*\n[\s\S]*?\n---\s*\n/,'');
  md=md.replace(/\[\[PP_(\d+)_[^\]|]*?(?:\|([^\]]+))?\]\]/g,function(m,n,disp){return '['+(disp||'Session '+n)+'](session.html?n='+n+')';});
  md=md.replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g,function(m,a,b){return b||a;});
  return md;
}

function wrapTables(html){return html.replace(/<table>/g,'<div class="tbl-wrap"><table>').replace(/<\/table>/g,'</table></div>');}

async function init(){
  var n=getN();
  if(!n){document.getElementById('body').innerHTML='<div class="err">No session specified. <a href="/pacts-and-power/archive.html">Go to the Chronicle</a></div>';return;}
  var idx=-1,s=null;
  for(var i=0;i<ARC.length;i++){if(ARC[i].n===n){s=ARC[i];idx=i;break;}}
  if(!s){document.getElementById('body').innerHTML='<div class="err">Unknown session &ldquo;'+n+'&rdquo;. <a href="/pacts-and-power/archive.html">Go to the Chronicle</a></div>';return;}
  document.title=s.n+' \u00b7 '+s.t+' \u2014 Pacts & Power';
  document.getElementById('snum').textContent='Pacts \u00b7 Power \u00b7 Session '+s.n;
  document.getElementById('stitle').innerHTML=s.t+(s.fin?' <span class="fbadge">Finale</span>':'');
  document.getElementById('sdate').textContent=s.lbl;
  var snav=document.getElementById('snav');
  var prevHtml='',nextHtml='';
  if(idx>0){var p=ARC[idx-1];prevHtml='<a href="session.html?n='+p.n+'"><span class="lbl">&larr; Session '+p.n+'</span><span class="ttl">'+p.t+'</span></a>';}
  else prevHtml='<a class="disabled"><span class="lbl">&larr; Previous</span><span class="ttl">\u2014</span></a>';
  if(idx<ARC.length-1){var nx=ARC[idx+1];nextHtml='<a href="session.html?n='+nx.n+'"><span class="lbl">Session '+nx.n+' &rarr;</span><span class="ttl">'+nx.t+'</span></a>';}
  else nextHtml='<a class="disabled"><span class="lbl">Next &rarr;</span><span class="ttl">\u2014</span></a>';
  snav.innerHTML=prevHtml+nextHtml;
  try{
    var resp=await fetch(VR+'/'+s.f);
    if(!resp.ok) throw new Error('fetch failed');
    var md=await resp.text();
    var html=wrapTables(marked.parse(transformMd(md)));
    document.getElementById('body').innerHTML=html;
    var tArr=tags(md);
    if(tArr.length){document.getElementById('stags').innerHTML=tArr.map(function(t){return '<span class="tag '+t.cls+'">'+t.lbl+'</span>';}).join('');}
    var stats=await rollStats(s.d);
    if(stats){document.getElementById('spills').innerHTML='<span class="pill">'+stats.total+' rolls</span><span class="pill up">nat\u202f20 \u00d7\u202f'+stats.n20+'</span><span class="pill dn">nat\u202f1 \u00d7\u202f'+stats.n1+'</span>';}
  }catch(e){
    document.getElementById('body').innerHTML='<div class="err">Failed to load session notes. <a href="/pacts-and-power/archive.html">Back to the Chronicle</a></div>';
  }
}

if(typeof marked!=='undefined'){init();}else{window.addEventListener('load',init);}
