function clean(s){
  return s.replace(/\[\[([^\]|]+)(?:\|[^\]]+)?\]\]/g,'$1')
           .replace(/\*\*([^*]+)\*\*/g,'$1')
           .replace(/\*([^*]+)\*/g,'$1')
           .replace(/`([^`]+)`/g,'$1')
           .replace(/^[#>|\-\s]+/gm,' ')
           .replace(/\|[^\n]*/g,'')
           .replace(/\s+/g,' ').trim();
}

function summary(md){
  var m=md.match(/###\s*Narrative\s+Summary\s*\n+([\s\S]+?)(?=\n###|\n##\s*Section|\n---)/i);
  if(!m) m=md.match(/##[^#\n]*Narrative\s+Summary[^#\n]*\n+([\s\S]+?)(?=\n##|\n---)/i);
  if(!m) m=md.match(/##[^#\n]*Summary[^#\n]*\n+([\s\S]+?)(?=\n##|\n---)/i);
  if(m){
    var txt=clean(m[1]);
    var ss=txt.match(/[A-Z][^.!?]*[.!?]+/g)||[];
    if(ss.length>=2) return ss.slice(0,2).join(' ').trim();
    return txt.slice(0,260).trim()+(txt.length>260?'\u2026':'');
  }
  var lines=md.split('\n').filter(function(l){
    return l.trim()&&!l.startsWith('#')&&!l.startsWith('|')&&!l.startsWith('-')&&!l.startsWith('>')&&l.length>30;
  });
  return lines.length?clean(lines[0]).slice(0,240):'Session notes on file.';
}

function quote(md){
  var m=md.match(/##\s*Section\s*7[\s\S]*?###\s*Quote\s*Board\s*\n+([\s\S]+?)(?=\n###|\n##\s*Section\s*[89]|\n---)/i);
  if(!m) m=md.match(/###\s*Quote\s*Board\s*\n+([\s\S]+?)(?=\n###|\n##|\n---)/i);
  if(!m) return null;
  var sec=m[1];
  var re=/\*\*([^*\n]+)\*\*\s*[\u00b7\u2022:.\-]\s*\[([^\]\n]+)\][^\n]*\n\*["\u201c]([^"\u201d*\n]+)["\u201d]?\*/g;
  var quotes=[],qm;
  while((qm=re.exec(sec))!==null){
    var sp=qm[1].trim(),tg=qm[2].trim(),tx=qm[3].trim();
    if(tx.length<15||tx.length>180) continue;
    quotes.push({sp:sp,tg:tg,tx:tx});
  }
  if(!quotes.length) return null;
  function score(q){
    var t=q.tg.toLowerCase(),s=0;
    if(/important to story/.test(t)) s+=100;
    if(/threat/.test(t)) s+=70;
    if(/poignant/.test(t)) s+=55;
    if(/serious/.test(t)) s+=40;
    if(/dm quip/.test(t)) s+=22;
    if(/funny/.test(t)) s+=10;
    if(/banter/.test(t)) s+=5;
    // PCs (the party) rank above DM/NPC quotes; PCs equal to each other
    if(/orphie|ogre|sanis|rin(?!estra)?|rinestra|varis/i.test(q.sp)) s+=8;
    if(q.tx.length>55) s+=4;
    if(q.tx.length>90) s+=3;
    s+=(q.sp.length%5);
    return s;
  }
  quotes.sort(function(a,b){return score(b)-score(a);});
  return quotes[0];
}

function earlySum(md){
  if(!md) return 'Brief overview on file.';
  var lines=md.split('\n').filter(function(l){
    return l.trim()&&!l.startsWith('#')&&!l.startsWith('|')&&l.length>20;
  });
  if(!lines.length) return 'Brief overview on file.';
  return clean(lines[0]).slice(0,180)+(clean(lines[0]).length>180?'\u2026':'');
}

        var v=row.individual_values;
        if(typeof v==='string'){try{v=JSON.parse(v);}catch(e){}}
        if(Array.isArray(v)&&v.length){
          if(v[0]===20) bd[d].n20++;
          if(v[0]===1)  bd[d].n1++;
        }
      }
    });
    return bd;
  }catch(e){return {};}
}

async function init(){
  var tl=document.getElementById('tl');
  var h='';
  h+='<div class="era-hdr"><span class="era-hdr-lbl">The Early Campaign &nbsp;&middot;&nbsp; 2023&ndash;2024</span><div class="era-hdr-line"></div></div>';
  h+='<div class="early-grid">';
  for(var i=1;i<=16;i++){
    h+='<div class="ecard" id="ec'+i+'"><div class="ecard-top"><span class="enum">Session '+i+'</span>'
      +'<span class="dm-badge">DM Brief</span></div>'
      +'<div class="ecard-txt skel" id="et'+i+'">&nbsp;</div></div>';
  }
  h+='</div>';
  h+='<div class="gap"><div class="gap-dots">&ctdot;</div><div class="gap-title">The Lost Sessions</div>'
    +'<div class="gap-txt">~35 sessions &nbsp;&middot;&nbsp; Before the Archive Began &nbsp;&middot;&nbsp; 2024&ndash;2025</div></div>';
  h+='<div class="era-hdr archive"><span class="era-hdr-lbl">The Archive &nbsp;&middot;&nbsp; July 2025&ndash;May 2026</span><div class="era-hdr-line"></div></div>';
  ARC.forEach(function(s){
    h+='<div class="anode'+(s.fin?' finale':'')+'">'
      +'<div class="acard'+(s.fin?' finale':'')+'">'
      +'<div class="atop"><span class="anum">'+s.n+'</span><span class="adate">'+s.lbl+'</span>'
      +(s.fin?'<span class="abadge">Finale</span>':'')+' </div>'
      +'<div class="atitle">'+s.t+'</div>'
      +'<div class="asum skel" id="as'+s.n+'">&nbsp;</div>'
      +'<div class="apills"><span class="ap skel" id="pt'+s.n+'">&nbsp;</span>'
      +'<span class="ap skel" id="p20'+s.n+'">&nbsp;</span>'
      +'<span class="ap skel" id="p1'+s.n+'">&nbsp;</span></div>'
      +'</div></div>';
  });
  tl.innerHTML=h;

  var statsP=rollStats();

  for(var j=1;j<=16;j++){
    (function(n){
      fetchMd(VR+'/01-Sessions/Early%20Sessions/Session%20'+n+'.md').then(function(md){
        var el=document.getElementById('et'+n);
        if(el){el.textContent=earlySum(md);el.className='ecard-txt';}
      });
    })(j);
  }

  ARC.forEach(function(s){
    fetchMd(VR+'/'+s.f).then(function(md){
      var sel=document.getElementById('as'+s.n);
      if(sel){
        if(md){
          sel.textContent=summary(md);sel.className='asum';
          var q=quote(md);
          if(q){
            var qd=document.createElement('div');
            qd.className='aquote';
            qd.textContent='\u201c'+q.tx+'\u201d';
            var who=document.createElement('span');
            who.className='who';
            who.textContent='\u2014 '+q.sp;
            qd.appendChild(who);
            sel.parentNode.insertBefore(qd,sel.nextSibling);
          }
        } else { sel.textContent='Session notes on file.';sel.className='asum'; }
      }
    });
  });

  statsP.then(function(bd){
    ARC.forEach(function(s){
      var st=bd[s.d]||{total:0,n20:0,n1:0};
      var pt=document.getElementById('pt'+s.n);
      var p20=document.getElementById('p20'+s.n);
      var p1=document.getElementById('p1'+s.n);
      if(pt){pt.textContent=st.total+' rolls';pt.className='ap';}
      if(p20){p20.textContent='nat\u202f20 \u00d7\u202f'+st.n20;p20.className='ap up';}
      if(p1){p1.textContent='nat\u202f1 \u00d7\u202f'+st.n1;p1.className='ap dn';}
    });
  });
}

document.addEventListener('DOMContentLoaded',init);
</script>
</body>
</html>
