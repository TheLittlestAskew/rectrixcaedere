<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Where the Flowers Remember — Rectrix Caedere</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=Cinzel+Decorative:wght@400;700&family=Raleway:wght@300;400;500&family=Alegreya+Sans+SC:wght@400;500;700&family=EB+Garamond:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#050A0E;--card:#0D141C;--gold:#C7A369;--gold-bright:#DA9565;--gold-pale:#E8C690;
  --amber:#AF755A;--copper:#8C5D3F;--coral:#B7634D;--info:#6B8AAD;--success:#4A9E6E;
  --text:#E8E4DC;--text2:#9A9590;--muted:#5E5A55;--vellum:#F5EFE2;
  --border:rgba(199,163,105,.25);--border-strong:rgba(199,163,105,.45);--glow:rgba(199,163,105,.30);
  --fd:'Cinzel Decorative','Cinzel',serif;--fdisp:'Cinzel',serif;--fb:'Raleway',system-ui,sans-serif;
  --fl:'Alegreya Sans SC','Raleway',sans-serif;--fs:'EB Garamond',serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{min-height:100%}
body{font-family:var(--fb);color:var(--text);background:var(--navy);
  background-image:radial-gradient(120% 90% at 50% 12%,rgba(5,10,14,.15),rgba(5,10,14,.6) 55%,rgba(5,10,14,.93)),url('/assets/img/general_background.webp');
  background-size:cover;background-position:center 30%;background-attachment:fixed;min-height:100vh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:64px 22px 40px;position:relative}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:50;opacity:.05;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}
.back{position:fixed;top:20px;left:22px;z-index:20;font-family:var(--fl);font-size:12px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--gold-pale);text-decoration:none;border:1px solid var(--border);border-radius:3px;
  padding:9px 16px;background:rgba(13,20,28,.6);backdrop-filter:blur(4px);transition:border-color .35s,color .35s,box-shadow .4s}
.back:hover{border-color:var(--gold);color:var(--gold-bright);box-shadow:0 0 22px -8px var(--glow)}
.wrap{width:100%;max-width:560px;display:flex;flex-direction:column;align-items:center;text-align:center;z-index:2;
  opacity:0;transform:translateY(14px);animation:rise 1s cubic-bezier(.2,.7,.2,1) .15s forwards}
@keyframes rise{to{opacity:1;transform:none}}
.face{width:min(64vw,232px);aspect-ratio:440/703;border-radius:14px;overflow:hidden;margin-bottom:30px;
  box-shadow:0 18px 50px rgba(0,0,0,.6);outline:1px solid var(--border);outline-offset:-1px;background:var(--card);
  filter:saturate(.78) brightness(.92)}
.face img{width:100%;height:100%;object-fit:cover;display:block}
.eyebrow{font-family:var(--fl);font-size:12px;letter-spacing:.32em;text-transform:uppercase;color:var(--gold);margin-bottom:14px}
.eyebrow::before,.eyebrow::after{content:'';display:inline-block;width:26px;height:1px;vertical-align:middle;margin:0 12px;
  background:linear-gradient(90deg,transparent,var(--copper))}
.eyebrow::after{background:linear-gradient(90deg,var(--copper),transparent)}
h1{font-family:var(--fd);font-weight:700;color:var(--vellum);font-size:clamp(28px,5.6vw,46px);line-height:1.08;
  text-shadow:0 2px 22px rgba(0,0,0,.6)}
.pill{display:inline-block;margin-top:18px;font-family:var(--fl);font-size:11px;letter-spacing:.2em;text-transform:uppercase;
  padding:6px 16px;border-radius:20px;border:1px solid var(--info);color:var(--info)}
.lead{margin-top:22px;font-family:var(--fs);font-style:italic;font-size:clamp(15px,2.4vw,19px);line-height:1.6;color:var(--text2)}
.lead em{font-style:normal;color:var(--gold-pale)}
.date{margin-top:26px;font-family:var(--fdisp);font-weight:500;font-size:clamp(20px,4vw,30px);color:var(--gold-pale);letter-spacing:.04em}
.date small{display:block;font-family:var(--fl);font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);margin-top:8px}
footer{position:fixed;bottom:22px;left:0;right:0;font-family:var(--fl);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);text-align:center}
footer .dot{color:var(--copper);margin:0 8px}
@media(prefers-reduced-motion:reduce){.wrap{opacity:1;transform:none;animation:none}}
</style>
</head>
<body>
  <a class="back" href="/">&#8592;&nbsp;&nbsp;The Deck</a>
  <div class="wrap">
    <div class="face"><img src="/assets/img/wtfr_tarot_face.webp" alt="Where the Flowers Remember tarot card"></div>
    <div class="eyebrow">X &middot; The Wheel of Fortune</div>
    <h1>Where the Flowers Remember</h1>
    <div><span class="pill">Not Yet Begun</span></div>
    <p class="lead">A thread not yet woven. <em>No rolls cast, no quotes spoken</em> &mdash; the first card waits to be drawn.</p>
    <div class="date">June 14, 2026<small>The campaign begins</small></div>
  </div>
  <footer>Rectrix Caedere <span class="dot">&#10022;</span> Campaign Archive <span class="dot">&#10022;</span> rectrixcaedere.com</footer>
</body>
</html>
